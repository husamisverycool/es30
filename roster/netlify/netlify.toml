# Roster: the page (index.html) plus one function (netlify/functions/api.mjs) that is the class's
# shared database, stored in Netlify Blobs. The function is already bundled: nothing to install.
[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo Roster: nothing to build"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/setup.html"
  [headers.values]
    Cache-Control = "no-cache"
