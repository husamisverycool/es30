  return html`<span class="ic" dangerouslySetInnerHTML=${{ __html: iconSvg(name, size) }}></span>`;
}
function Avatar({ uid, size, online, name }) {
  const app = useApp();
  const p = name ? { ...app.person(uid), name, avatarUrl: "" } : app.person(uid);
  const s = size || 32;
  return html`<span class="av" style=${{ width: s + "px", height: s + "px", fontSize: Math.round(s * 0.38) + "px", background: p.color }} title=${p.name}>
    ${p.avatarUrl ? html`<img src=${p.avatarUrl} alt="" />` : initials(p.name)}
    ${online ? html`<span class="av-dot"></span>` : null}
  </span>`;
}
function AvatarStack({ ids, total, size }) {
  const shown = ids.slice(0, 4);
  return html`<span class="stack">${shown.map((id) => html`<${Avatar} key=${id} uid=${id} size=${size || 22} />`)}${total != null ? html`<span class="count">${total}</span>` : null}</span>`;
}
function Tile({ courseId, size }) {
  const look = courseLook(courseId);
  const s = size || 40;
  return html`<span class="tile" style=${{ width: s + "px", height: s + "px", background: look.bg, borderRadius: Math.round(s * 0.3) + "px" }}><span class="emo" style=${{ fontSize: Math.round(s * 0.52) + "px" }}>${look.emoji}</span></span>`;
}
function Modal({ title, onClose, children, footer, wide, icon }) {
  useEffect(() => {
    const k = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", k);
    return () => window.removeEventListener("keydown", k);
  }, [onClose]);
  return html`<div class="scrim" onClick=${(e) => e.target === e.currentTarget && onClose()}>
    <div class=${"modal" + (wide ? " wide" : "")} role="dialog" aria-modal="true" aria-label=${title}>
      <div class="modal-h">${icon ? html`<${Icon} name=${icon} />` : null}<h2>${title}</h2><button class="iconbtn" onClick=${onClose} aria-label="Close"><${Icon} name="x" /></button></div>
      <div class="modal-b">${children}</div>
      ${footer ? html`<div class="modal-f">${footer}</div>` : null}
    </div>
  </div>`;
}
function Popover({ anchor, onClose, children, align }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  useLayoutEffect(() => {
    if (!anchor || !ref.current) return;
    const r = anchor.getBoundingClientRect(), me = ref.current.getBoundingClientRect();
    let left = align === "right" ? r.right - me.width : r.left;
    left = Math.max(8, Math.min(left, window.innerWidth - me.width - 8));
    let top = r.top - me.height - 6;
    if (top < 8) top = Math.min(r.bottom + 6, window.innerHeight - me.height - 8);
    setPos({ left, top });
  }, [anchor]);
  useEffect(() => {
    const down = (e) => { if (ref.current && !ref.current.contains(e.target) && !(anchor && anchor.contains(e.target))) onClose(); };
    const key = (e) => e.key === "Escape" && onClose();
    setTimeout(() => document.addEventListener("pointerdown", down), 0);
    window.addEventListener("keydown", key);
    return () => { document.removeEventListener("pointerdown", down); window.removeEventListener("keydown", key); };
  }, [anchor, onClose]);
  return html`<div class="pop" ref=${ref} style=${pos ? { left: pos.left + "px", top: pos.top + "px" } : { left: "-9999px", top: "0" }}>${children}</div>`;
}
const QUICK = ["👍", "❤️", "😂", "😭", "🙏", "💯"]; // WhatsApp/iMessage-size tray, chosen for a pset chat
const MORE_EMOJI = ["🔥", "👀", "🤯", "😮", "😅", "🫡", "✅", "❌", "✋", "🐣", "🎲", "📌", "🧠", "💀", "🫶", "👏", "🙌", "🤝", "😴", "☕", "📚", "✍️", "🎉", "🤔"];
function EmojiPicker({ anchor, onPick, onClose }) {
  const [more, setMore] = useState(false);
  return html`<${Popover} anchor=${anchor} onClose=${onClose}>
    <div class="emoji-tray">
      ${QUICK.map((e) => html`<button class="emo" onClick=${() => onPick(e)} aria-label=${"React " + e}>${e}</button>`)}
      <button onClick=${() => setMore(!more)} aria-label="More emoji"><${Icon} name="plus" /></button>
    </div>
    ${more ? html`<div class="emoji-grid">${MORE_EMOJI.map((e) => html`<button class="emo" onClick=${() => onPick(e)}>${e}</button>`)}</div>` : null}
  <//>`;
}
function calLinks(title, start, minutes, details) {
  const end = start + (minutes || 30) * 60e3;
  const z = (t) => new Date(t).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const g = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(title) + "&dates=" + z(start) + "/" + z(end) + "&details=" + encodeURIComponent(details || "");
  const o = "https://outlook.office.com/calendar/0/deeplink/compose?subject=" + encodeURIComponent(title) + "&startdt=" + encodeURIComponent(new Date(start).toISOString()) + "&enddt=" + encodeURIComponent(new Date(end).toISOString()) + "&body=" + encodeURIComponent(details || "");
  return { google: g, outlook: o };
}


// ---------------------------------------------------------------------------
// Chat surface: message list, runs, bubbles, reactions, replies, composer,
// pinned bar, typing line. Anatomy per DESIGN.md §3 (GroupMe 2026 row on
// shared iMessage / WhatsApp / Telegram / Discord conventions).
// ---------------------------------------------------------------------------
function buildBlocks(msgs, uid, lastRead) {
  const blocks = [];
  let lastDay = null, run = null, unreadPlaced = false;
  for (const m of msgs) {
    const dk = dayKey(m.ts);
    if (dk !== lastDay) { blocks.push({ type: "day", ts: m.ts, key: "d" + dk }); lastDay = dk; run = null; }
    if (!unreadPlaced && lastRead && m.ts > lastRead && m.by !== uid) { blocks.push({ type: "unread", key: "unread" }); unreadPlaced = true; run = null; }
    if (m.kind === "system" || m.kind === "recap" || m.kind === "due") { blocks.push({ type: m.kind, m, key: m.id }); run = null; continue; }
    if (run && run.by === m.by && m.ts - run.last < 5 * 60e3 && run.items.length < 12) { run.items.push(m); run.last = m.ts; }
    else { run = { type: "run", by: m.by, items: [m], last: m.ts, key: "r" + m.id }; blocks.push(run); }
  }
  return blocks;
}

function MessageList({ courseId, messages, byId, lastRead, empty, header, recapCtx }) {
  const app = useApp();
  const scroller = useRef(null);
  const [newCount, setNewCount] = useState(0);
  const [atBottom, setAtBottom] = useState(true);
  const prevLen = useRef(0);
  const opened = useRef(false);
  const blocks = useMemo(() => buildBlocks(messages, app.uid, lastRead), [messages, app.uid, lastRead]);

  const nearBottom = () => { const el = scroller.current; return !el || el.scrollHeight - el.scrollTop - el.clientHeight < 140; };
  const toBottom = (smooth) => { const el = scroller.current; if (el) el.scrollTo({ top: el.scrollHeight, behavior: smooth ? "smooth" : "auto" }); };

  useLayoutEffect(() => {
    const el = scroller.current;
    if (!el) return;
    if (!opened.current && messages.length) {
      opened.current = true;
      const div = el.querySelector(".unread-div");
      if (div) el.scrollTop = Math.max(0, div.offsetTop - 80); else el.scrollTop = el.scrollHeight;
      prevLen.current = messages.length;
      return;
    }
    if (messages.length > prevLen.current) {
      const last = messages[messages.length - 1];
      if (atBottom || (last && last.by === app.uid)) toBottom(prevLen.current > 0);
      else setNewCount((n) => n + (messages.length - prevLen.current));
    }
    prevLen.current = messages.length;
  }, [messages]);

  const onScroll = () => { const b = nearBottom(); if (b !== atBottom) setAtBottom(b); if (b && newCount) setNewCount(0); };
  const flash = (id) => {
    const el = scroller.current && scroller.current.querySelector('[data-mid="' + id + '"]');
    if (!el) { app.toast("That message is further back than this chat has loaded."); return; }
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  };

  return html`<div class="scroller" ref=${scroller} onScroll=${onScroll}>
    <div class="msgs">
      ${header || null}
      ${messages.length === 0 ? empty : null}
      ${blocks.map((b) => {
        if (b.type === "day") return html`<div class="daysep" key=${b.key}>${dayLabel(b.ts)}</div>`;
        if (b.type === "unread") return html`<div class="unread-div" key="unread">Unread messages</div>`;
        if (b.type === "system") return html`<div class="sysline" key=${b.key}>${b.m.text}</div>`;
        if (b.type === "recap") return html`<${RecapInChat} key=${b.key} m=${b.m} courseId=${courseId} ctx=${recapCtx} />`;
        if (b.type === "due") return html`<${DueInChat} key=${b.key} m=${b.m} />`;
        return html`<${Run} key=${b.key} run=${b} courseId=${courseId} byId=${byId} flash=${flash} />`;
      })}
    </div>
    ${!atBottom ? html`<button class="jump" onClick=${() => { toBottom(true); setNewCount(0); }}><${Icon} name="arrowDown" size=${18} />${newCount ? newCount + " new" : "Latest"}</button>` : null}
  </div>`;
}

function Run({ run, courseId, byId, flash }) {
  const app = useApp();
  const mine = run.by === app.uid;
  const p = app.person(run.by);
  return html`<div class=${"run" + (mine ? " mine" : "")}>
    ${mine ? null : html`<${Avatar} uid=${run.by} size=${32} online=${app.online.has(run.by)} />`}
    <div class="col">
      ${run.items.map((m, i) => html`<${Msg} key=${m.id} m=${m} first=${i === 0} mine=${mine} person=${p} courseId=${courseId} byId=${byId} flash=${flash} />`)}
      ${mine ? html`<div class="mine-meta">${F.time.format(run.last)}</div>` : null}
    </div>
  </div>`;
}

function Msg({ m, first, mine, person, courseId, byId, flash }) {
  const app = useApp();
  const [picker, setPicker] = useState(null);
  const [sheet, setSheet] = useState(false);
  const press = useRef(null);
  const mentionsMe = (m.mentions || []).includes(app.uid);
  const mentionNames = useMemo(() => (m.mentions || []).map((id) => app.person(id).name).filter(Boolean), [m.mentions, app.members]);
  const reply = m.replyTo ? byId[m.replyTo] : null;
  const canAct = app.canWrite && !m.deleted;

  const onTouchStart = () => { if (!canAct) return; press.current = setTimeout(() => { press.current = null; setSheet(true); }, 430); };
  const cancelPress = () => { if (press.current) { clearTimeout(press.current); press.current = null; } };
  const onReact = (e) => { setPicker(null); setSheet(false); app.react(courseId, m, e); };
  const copy = async () => {
    setSheet(false);
    try { await navigator.clipboard.writeText(m.text || ""); app.toast("Copied"); } catch (_) { app.toast("Copy isn't available here. Select the text instead."); }
  };

  if (m.deleted) {
    return html`<div class="msg" data-mid=${m.id}><div class="bub" style=${{ opacity: 0.6, fontStyle: "italic" }}>Message deleted</div></div>`;
  }
  const reacts = Object.entries(m.reactions || {})
    .map(([e, who]) => ({ e, ids: Object.entries(who || {}).filter(([, t]) => t).map(([id]) => id) }))
    .filter((r) => r.ids.length)
    .sort((a, b) => b.ids.length - a.ids.length);

  return html`<div class=${"msg" + (mentionsMe ? " mentions-me" : "")} data-mid=${m.id}>
    <div class="bub" onContextMenu=${(e) => { if (canAct && matchMedia("(hover: none)").matches) { e.preventDefault(); setSheet(true); } }}
      onTouchStart=${onTouchStart} onTouchEnd=${cancelPress} onTouchMove=${cancelPress}>
      ${first && !mine ? html`<div class="hd"><b style=${{ color: nameColor(m.by) }}>${person.name}</b>${tagLine(person) ? html`<span class="tag">${tagLine(person)}</span>` : null}<span class="tm" title=${dueWhen(m.ts)}>${relShort(m.ts)}</span></div>` : null}
      ${m.replyTo ? html`<button class="quote" style=${{ color: reply ? nameColor(reply.by) : "var(--ink-3)" }} onClick=${() => flash(m.replyTo)}>
          <b>${reply ? app.person(reply.by).name : "Original message"}</b><span>${reply ? (reply.deleted ? "Message deleted" : reply.text) : "Not loaded"}</span></button>` : null}
      <div class="tx" title=${first ? undefined : F.time.format(m.ts)}>${(m.tags || []).map((t) => html`<span class="ptag">${prettyProblem(t)}</span>`)}${richText(m.text, mentionNames)}${m.editedAt ? html`<span class="edited">(edited)</span>` : null}</div>
      ${(m.attachments || []).map((a) => html`<button class="attach" onClick=${() => app.toast(app.demo ? "Example file in the demo class." : "Files open from the shared notes folder.")}>
          <span class=${"fi " + (a.kind || "")}>${a.kind === "image" ? "JPG" : "PDF"}</span><span style=${{ minWidth: 0 }}><span class="nm" style=${{ display: "block" }}>${a.name}</span><span class="sz">${a.size || ""}</span></span></button>`)}
    </div>
    ${reacts.length ? html`<div class="reacts">${reacts.map((r) => {
      const me = r.ids.includes(app.uid);
      const names = r.ids.slice(0, 6).map((id) => (id === app.uid ? "You" : app.person(id).name)).join(", ") + (r.ids.length > 6 ? " and " + (r.ids.length - 6) + " more" : "");
      return html`<button class=${"react" + (me ? " me" : "")} title=${names} disabled=${!app.canWrite} onClick=${() => app.react(courseId, m, r.e)}><span class="emo">${r.e}</span>${r.ids.length}</button>`;
    })}</div>` : null}
    ${canAct ? html`<div class="hover-tools">
      ${QUICK.slice(0, 3).map((e) => html`<button class="emo" onClick=${() => onReact(e)} aria-label=${"React " + e}>${e}</button>`)}
      <button onClick=${(e) => setPicker(e.currentTarget)} aria-label="Add reaction"><${Icon} name="smile" size=${18} /></button>
      <button onClick=${() => app.setReplyTo(m)} aria-label="Reply"><${Icon} name="reply" size=${18} /></button>
      ${mine ? html`<button onClick=${() => app.deleteMsg(courseId, m)} aria-label="Delete"><${Icon} name="x" size=${18} /></button>` : null}
    </div>` : null}
    ${picker ? html`<${EmojiPicker} anchor=${picker} onPick=${onReact} onClose=${() => setPicker(null)} />` : null}
    ${sheet ? html`<${Modal} title=${mine ? "Your message" : person.name} onClose=${() => setSheet(false)}>
      <div class="emoji-tray" style=${{ justifyContent: "space-between" }}>${QUICK.map((e) => html`<button class="emo" onClick=${() => onReact(e)}>${e}</button>`)}</div>
      <div class="menu">
        <button onClick=${() => { setSheet(false); app.setReplyTo(m); }}><${Icon} name="reply" />Reply</button>
        <button onClick=${copy}><${Icon} name="paste" />Copy text</button>
        ${mine ? html`<button onClick=${() => { setSheet(false); app.deleteMsg(courseId, m); }} style=${{ color: "var(--red)" }}><${Icon} name="x" />Delete</button>` : null}
      </div>
    <//>` : null}
  </div>`;
}

function DueInChat({ m }) {
  useTick(30000);
  const left = m.due ? m.due.at - Clock.now() : 0;
  const cal = m.due ? calLinks(m.due.title, m.due.at, 30, m.due.where || "") : null;
  return html`<div class="card" style=${{ alignSelf: "flex-start", margin: "10px 0 4px 40px", maxWidth: "420px", width: "calc(100% - 40px)" }}>
    <div class="due-card">
      <div class="top"><span class="emo" style=${{ fontSize: "22px" }}>📌</span>
        <div><div class="ttl">${m.due ? m.due.title : m.text}</div><div class="when">${m.due ? dueWhen(m.due.at) : ""}${m.due && m.due.where ? " · " + m.due.where : ""}</div></div>
        ${m.due && left > 0 ? html`<div class="left"><small>DUE IN</small><b>${countdown(left)}</b></div>` : null}
      </div>
      ${cal ? html`<div class="acts"><a class="btn btn-soft btn-sm" href=${cal.google} target="_blank" rel="noopener noreferrer"><${Icon} name="calendar" size=${16} />Google Calendar</a><a class="btn btn-ghost btn-sm" href=${cal.outlook} target="_blank" rel="noopener noreferrer">Outlook</a></div>` : null}
    </div>
  </div>`;
}

function PinBar({ items }) {
  useTick(1000);
  const [i, setI] = useState(0);
  if (!items.length) return null;
  const k = i % items.length;
  const it = items[k];
  const left = it.at ? it.at - Clock.now() : null;
  return html`<button class="pinbar" onClick=${() => setI(k + 1)} aria-label=${"Pinned " + (k + 1) + " of " + items.length + ". Show next."}>
    <span class="seg">${items.map((_, j) => html`<i class=${j === k ? "on" : ""} style=${{ height: Math.max(6, Math.floor(36 / items.length) - 2) + "px" }}></i>`)}</span>
    <span class="emo" style=${{ fontSize: "18px" }}>${it.emoji}</span>
    <span class="body"><span class="k" style=${{ display: "block" }}>Pinned${items.length > 1 ? " · " + (k + 1) + " of " + items.length : ""}</span><span class="v" style=${{ display: "block" }}>${it.text}</span></span>
    ${left != null && left > 0 ? html`<span class="cd"><small>DUE IN</small><b>${countdown(left)}</b></span>` : null}
  </button>`;
}

function TypingLine({ courseId }) {
  const app = useApp();
  const ids = app.typing(courseId);
  if (!ids.length) return html`<div class="typing"></div>`;
  const n = ids.map((id) => firstName(app.person(id).name));
  const txt = n.length === 1 ? html`<b>${n[0]}</b> is typing…` : n.length === 2 ? html`<b>${n[0]}</b> and <b>${n[1]}</b> are typing…` : n.length === 3 ? html`<b>${n[0]}</b>, <b>${n[1]}</b>, and <b>${n[2]}</b> are typing…` : "Several people are typing…";
  return html`<div class="typing"><span class="dots"><i></i><i></i><i></i></span><span>${txt}</span></div>`;
}

function Composer({ courseId, thread, placeholder, problems, problem, onProblem, members }) {
  const app = useApp();
  const [text, setText] = useState("");
  const [mentions, setMentions] = useState([]);
  const [suggest, setSuggest] = useState(null);
  const [plus, setPlus] = useState(null);
  const ta = useRef(null);
  const typingAt = useRef(0);
  const draftKey = "roster:draft:" + courseId + ":" + thread;
  useEffect(() => { setText(LS.get(draftKey, "")); }, [draftKey]);
  useLayoutEffect(() => { const el = ta.current; if (el) { el.style.height = "auto"; el.style.height = Math.min(140, el.scrollHeight) + "px"; } }, [text]);
  useEffect(() => { if (app.replyTo && ta.current) ta.current.focus(); }, [app.replyTo]);

  if (!app.canWrite) {
    return html`<div class="composer-wrap"><div class="readonly"><${Icon} name="info" /><span class="grow">You can read this class but not post. ${app.demo ? "" : "Ask the organizer to add you as a contributor."}</span>
      ${app.live ? html`<button class="btn btn-soft btn-sm" onClick=${() => app.switchMode("demo")}>Try the demo class</button>` : null}</div></div>`;
  }
  const onInput = (e) => {
    const v = e.target.value;
    setText(v);
    LS.set(draftKey, v);
    const now = Date.now();
    if (now - typingAt.current > 2500) { typingAt.current = now; app.setTyping(courseId, true); }
    const caret = e.target.selectionStart;
    const mm = v.slice(0, caret).match(/(?:^|\s)@([\w'-]{0,20})$/);
    if (mm) {
      const q = mm[1].toLowerCase();
      const list = members.filter((x) => x.id !== app.uid && (x.displayName || "").toLowerCase().split(/\s+/).some((w) => w.startsWith(q))).slice(0, 5);
      setSuggest(list.length ? { q: mm[1], list } : null);
    } else setSuggest(null);
  };
  const pickMention = (mem) => {
    const el = ta.current, caret = el.selectionStart;
    const before = text.slice(0, caret).replace(/@([\w'-]{0,20})$/, "@" + mem.displayName + " ");
    const v = before + text.slice(caret);
    setText(v); setMentions((m) => [...new Set([...m, mem.id])]); setSuggest(null);
    setTimeout(() => { el.focus(); el.selectionStart = el.selectionEnd = before.length; }, 0);
  };
  const send = async () => {
    const t = text.trim();
    if (!t) return;
    const used = mentions.filter((id) => t.includes("@" + app.person(id).name));
    setText(""); LS.set(draftKey, ""); setMentions([]); setSuggest(null);
    app.setTyping(courseId, false);
    const ok = await app.send(courseId, { text: t, thread, tags: problem && problem !== "all" ? [problem] : undefined, mentions: used.length ? used : undefined });
    if (!ok) setText(t);
  };
  const onKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); }
    if (e.key === "Escape" && app.replyTo) app.setReplyTo(null);
  };
  const shareLink = () => {
    setPlus(null);
    setText((v) => (v ? v + " " : "") + "https://");
    setTimeout(() => ta.current && ta.current.focus(), 0);
  };
  const r = app.replyTo;
  return html`<div class="composer-wrap">
    <${TypingLine} courseId=${courseId} />
    ${r ? html`<div class="replying"><${Icon} name="reply" size=${18} /><div class="body"><b>Replying to ${r.by === app.uid ? "yourself" : app.person(r.by).name}</b><span>${r.text}</span></div><button class="iconbtn" onClick=${() => app.setReplyTo(null)} aria-label="Cancel reply"><${Icon} name="x" size=${18} /></button></div>` : null}
    ${suggest ? html`<div class="card menu" style=${{ maxWidth: "860px", margin: "0 auto 6px", padding: "4px" }}>${suggest.list.map((mem) => html`<button onClick=${() => pickMention(mem)}><${Avatar} uid=${mem.id} size=${24} /><span>${mem.displayName}</span><span class="muted" style=${{ fontSize: "12px", marginLeft: "auto" }}>${tagLine(mem)}</span></button>`)}</div>` : null}
    <div class="composer">
      <div class="field-wrap">
        <button class="iconbtn" onClick=${(e) => setPlus(e.currentTarget)} aria-label="More"><${Icon} name="plus" /></button>
        ${problems && problems.length ? html`<button class="ptag-pick" onClick=${(e) => setPlus({ el: e.currentTarget, kind: "problem" })} aria-label="Tag a problem">${problem && problem !== "all" ? prettyProblem(problem) : "General"}<${Icon} name="updown" size=${14} /></button>` : null}
        <textarea id=${"composer-" + courseId + "-" + thread} ref=${ta} rows="1" value=${text} onInput=${onInput} onKeyDown=${onKey} onBlur=${() => app.setTyping(courseId, false)} placeholder=${placeholder} aria-label=${placeholder}></textarea>
      </div>
      <button class="send" onClick=${send} disabled=${!text.trim()} aria-label="Send"><${Icon} name="send" size=${20} /></button>
    </div>
    ${plus && !plus.kind ? html`<${Popover} anchor=${plus} onClose=${() => setPlus(null)}><div class="menu" style=${{ minWidth: "220px" }}>
      <button onClick=${shareLink}><${Icon} name="link" />Share a link</button>
      <button onClick=${() => { setPlus(null); setText((v) => v + "@"); setTimeout(() => ta.current && ta.current.focus(), 0); }}><${Icon} name="users" />Mention a classmate</button>
    </div><//>` : null}

// AI lecture recap + classmate corrections (DESIGN.md §4): X Collaborative
// Notes card anatomy, Granola's grey-until-checked AI text, Google Docs
// suggesting-mode strike/underline, Community Notes consensus to apply.
// ---------------------------------------------------------------------------
const APPLY_AT = 3;
const agreeN = (f) => Object.values(f.votes || {}).filter(Boolean).length;
const nayN = (f) => Object.values(f.nays || {}).filter(Boolean).length;
const autoApplied = (f) => f.status === "applied" || (f.status !== "dismissed" && agreeN(f) >= APPLY_AT && agreeN(f) >= 2 * nayN(f));

function bulletState(recap, b, fixes, checks, uid) {
  const fx = fixes.filter((f) => f.recapId === recap.id && f.bulletId === b.id && f.status !== "dismissed");
  let applied = null;
  if (b.fixedBy) applied = fx.find((f) => f.id === b.fixedBy) || { id: b.fixedBy, text: b.fixedText, by: null, ts: recap.ts };
  if (!applied) applied = fx.filter(autoApplied).sort((a, c) => a.ts - c.ts).pop() || null;
  const open = fx.filter((f) => !autoApplied(f) && (!applied || f.id !== applied.id));
  const ck = checks.filter((c) => c.recapId === recap.id && c.bulletId === b.id);
  return {
    applied, open, checks: ck,
    mine: ck.some((c) => c.by === uid),
    text: applied ? applied.text || b.fixedText : b.text,
    state: applied ? "fixed" : open.length ? "open" : ck.length >= 2 ? "checked" : "ai",
  };
}

function RecapCard({ recap, courseId, fixes, checks }) {
  const app = useApp();
  const [fixFor, setFixFor] = useState(null);
  const [history, setHistory] = useState(false);
  const states = recap.bullets.map((b) => bulletState(recap, b, fixes, checks, app.uid));
  const openN = states.reduce((n, s) => n + s.open.length, 0);
  const done = states.every((s) => s.state === "fixed" || s.state === "checked");
  const fixesHere = fixes.filter((f) => f.recapId === recap.id);
  const status = openN
    ? { dot: "warn", t: "Needs more checks", sub: openN + (openN === 1 ? " open fix" : " open fixes") }
    : done ? { dot: "ok", t: "Checked by classmates", sub: fixesHere.length ? fixesHere.length + (fixesHere.length === 1 ? " fix applied" : " fixes applied") : "" }
    : { dot: "", t: "Needs more checks", sub: "" };

  return html`<article class="recap" aria-label=${"Lecture " + recap.lecture + " recap"}>
    <div class="recap-status"><span class=${"dot " + status.dot}></span><span>${status.t}</span><span class="sub">${status.sub ? "· " + status.sub + " " : ""}· ${relShort(recap.ts)}</span></div>
    <div class="recap-label"><${Icon} name="ai" size=${16} /><span>Lecture recap</span><span>·</span><span>AI-drafted, updates with class corrections</span><span>·</span><button onClick=${() => setHistory(true)}>Revision history</button></div>
    <div class="recap-title"><h4>Lecture ${recap.lecture} · ${recap.title}</h4><p>${F.wmd.format(recap.date || recap.ts)}${recap.sections ? " · " + recap.sections : ""}</p></div>
    <ol class="bullets">
      ${recap.bullets.map((b, i) => {
        const s = states[i];
        return html`<li class=${"bl " + s.state} key=${b.id}>
          <span class="mk" aria-hidden="true"></span>
          <span class="t">${s.text}</span>
          ${s.applied ? html`<span class="orig" aria-label="Original AI text">${b.text}</span>` : null}
          <span class="row2">
            ${b.ref ? html`<span class="chip-ref">${b.ref}</span>` : null}
            ${s.applied ? html`<span class="fixed-by"><${Icon} name="checkCircle" size=${14} />${s.applied.by ? "Fixed by " + app.person(s.applied.by).name : "Fixed"}</span>`
              : s.state === "checked" ? html`<span>${s.checks.length} classmates say this matches</span>`
              : s.state === "ai" ? html`<span>${s.checks.length ? s.checks.length + " check so far" : "Not checked yet"}</span>` : null}
            ${app.canWrite && !s.applied ? html`<span class="act">
              <button class=${s.mine ? "on" : ""} onClick=${() => app.toggleCheck(courseId, recap.id, b.id, s.mine)} aria-pressed=${s.mine}><${Icon} name="check" size=${14} />Looks right</button>
              <button onClick=${() => setFixFor({ b, i, text: s.text })}><${Icon} name="edit" size=${14} />Suggest a fix</button>
            </span>` : null}
          </span>
          ${s.open.map((f) => html`<${Suggestion} key=${f.id} f=${f} b=${b} courseId=${courseId} />`)}
        </li>`;
      })}
    </ol>
    <div class="recap-panel">
      <div class="h">Spot something off?</div>
      <div class="muted" style=${{ fontSize: "13px" }}>Use “Suggest a fix” on the line. When ${APPLY_AT} classmates agree, the fix replaces the AI's version for everyone.</div>
    </div>
    <div class="recap-foot"><${Icon} name="ai" size=${14} />Drafted by AI from the organizer's lecture notes. May contain errors.</div>
    ${fixFor ? html`<${FixSheet} recap=${recap} courseId=${courseId} target=${fixFor} onClose=${() => setFixFor(null)} />` : null}
    ${history ? html`<${RevisionHistory} recap=${recap} fixes=${fixesHere} onClose=${() => setHistory(false)} />` : null}
  </article>`;
}

function Suggestion({ f, b, courseId }) {
  const app = useApp();
  const yes = !!(f.votes || {})[app.uid], no = !!(f.nays || {})[app.uid];
  const mineFix = f.by === app.uid;
  const n = agreeN(f);
  return html`<div class="sugg">
    <span class="strike">${b.text}</span>
    <span class="new">${f.text}</span>
    <span class="by"><${Avatar} uid=${f.by} size=${18} /><span>Suggested by <b>${mineFix ? "you" : app.person(f.by).name}</b>${f.reason ? " · " + f.reason : ""} · ${relShort(f.ts)}</span></span>
    <span class="q">
      <span>Is this right?</span>
      <span class="muted" style=${{ fontWeight: 600 }}>${n} of ${APPLY_AT} agree</span>
      <span class="grow"></span>
      ${app.canWrite && !mineFix ? html`
        <button class=${"yn" + (yes ? " on" : "")} aria-pressed=${yes} onClick=${() => app.voteFix(courseId, f, yes ? null : "yes")}>Yes</button>
        <button class=${"yn" + (no ? " on" : "")} aria-pressed=${no} onClick=${() => app.voteFix(courseId, f, no ? null : "no")}>No</button>` : null}
      ${app.isOrganizer ? html`<button class="yn" onClick=${() => app.resolveFix(courseId, f, "applied")}>Apply</button><button class="yn" onClick=${() => app.resolveFix(courseId, f, "dismissed")}>Dismiss</button>` : null}
    </span>
  </div>`;
}

const FIX_REASONS = ["Matches the slides", "Matches what was said", "Clearer wording", "Missing a key point"]; // after Community Notes' helpful-reason tags
function FixSheet({ recap, courseId, target, onClose }) {
  const app = useApp();
  const [text, setText] = useState(target.text);
  const [reason, setReason] = useState(FIX_REASONS[0]);
  const [busy, setBusy] = useState(false);
  const changed = text.trim() && text.trim() !== target.text.trim();
  const submit = async () => {
    setBusy(true);
    const ok = await app.suggestFix(courseId, { recapId: recap.id, bulletId: target.b.id, text: text.trim(), reason });
    setBusy(false);
    if (ok) onClose();
  };
  return html`<${Modal} title="Suggest a fix" icon="edit" onClose=${onClose} footer=${html`
      <button class="btn btn-ghost" onClick=${onClose}>Cancel</button>
      <button class="btn btn-primary" disabled=${!changed || busy} onClick=${submit}>${busy ? "Sending…" : "Suggest fix"}</button>`}>
    <div class="muted" style=${{ fontSize: "13px" }}>Lecture ${recap.lecture} · line ${target.i + 1}${target.b.ref ? " · " + target.b.ref : ""}</div>
    <div class="sugg" style=${{ marginTop: 0, background: "var(--surface-2)", borderColor: "var(--line)" }}><span class="strike" style=${{ textDecoration: "none", background: "none" }}>${target.text}</span></div>
    <label class="field"><span>What should it say?</span>
      <textarea id="fix-text" class="input" value=${text} onInput=${(e) => setText(e.target.value)} rows="4"></textarea></label>
    <div class="field"><span>Why</span><div class="choices">${FIX_REASONS.map((r) => html`<button class=${"choice" + (r === reason ? " on" : "")} onClick=${() => setReason(r)} aria-pressed=${r === reason}>${r}</button>`)}</div></div>
    <div class="muted" style=${{ fontSize: "12.5px" }}>Your name shows on the fix. When ${APPLY_AT} classmates agree, it replaces the AI's line for everyone.</div>
  <//>`;
}

function RevisionHistory({ recap, fixes, onClose }) {
  const app = useApp();

function PsetView({ courseId, thread, messages, byId, ctx, members }) {

}

      ${[["results", "Results"], ["recap", "Post a recap"], ["hub", "Dates & cycles"], ["export", "Export"]].map(([k, l]) => html`<button role="tab" aria-selected=${tab === k} class=${tab === k ? "on" : ""} onClick=${() => setTab(k)}>${l}</button>`)}
    </div>
    ${app.demo ? html`<div class="banner" style=${{ borderRadius: "12px", border: "0" }}><span class="grow">Demo data: example classmates in a simulated ${c.code} chat, one pset cycle after placement. In the live class these numbers come from real activity.</span></div>` : null}
    ${tab === "results" ? html`<${Results} courseId=${courseId} />` : null}
    ${tab === "recap" ? html`<${RecapComposer} courseId=${courseId} onDone=${onClose} />` : null}
    ${tab === "hub" ? html`<${HubEditor} courseId=${courseId} />` : null}
    ${tab === "export" ? html`<${Exporter} courseId=${courseId} />` : null}
  <//>`;
}

function useCourseLog(courseId) {
  const app = useApp();
  const [data, setData] = useState(null);
  const [n, setN] = useState(0);
  useEffect(() => {
    let alive = true;
    const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
    const safe = (p) => p.then(rows).catch(() => []);
    Promise.all([
      safe(app.db.collection("courses/" + courseId + "/messages").orderBy("ts", "asc").limit(1000).get()),
      safe(app.db.collection("courses/" + courseId + "/fixes").get()),
      safe(app.db.collection("courses/" + courseId + "/checks").limit(1000).get()),
      safe(app.db.collection("recaps/" + courseId + "/items").get()),
      safe(app.db.collection("members").get()),
      safe(app.db.collection("survey").get()),
      app.db.doc("hub/" + courseId).get().then((s) => (s.exists ? s.data() : {})).catch(() => ({})),
    ]).then(([messages, fixes, checks, recaps, members, surveys, hub]) => {
      if (alive) setData({ messages, fixes, checks, recaps, members, surveys: surveys.filter((s) => s.course === courseId), hub });
    });
    return () => { alive = false; };
  }, [courseId, n]);
  return [data, () => setN((x) => x + 1)];
}

function Thresh({ v, kill, ok, proj }) {
  const w = (x) => Math.max(0, Math.min(100, x * 100)) + "%";
  return html`<div class="thresh" aria-hidden="true">
    ${proj != null ? html`<div class="fill proj" style=${{ width: w(proj) }}></div>` : null}
    ${v != null ? html`<div class="fill" style=${{ width: w(v) }}></div>` : null}
    <div class="mark kill" style=${{ left: w(kill) }}><span>kill ${Math.round(kill * 100)}%</span></div>
    <div class="mark ok" style=${{ left: w(ok) }}><span>success ${Math.round(ok * 100)}%</span></div>
  </div>`;
}

function Results({ courseId }) {
  const app = useApp();
  const [data, refresh] = useCourseLog(courseId);
  if (!data) return html`<div class="muted">Reading the chat log…</div>`;
  const cycles = (data.hub && data.hub.cycles) || [];
  if (cycles.length < 2) return html`<div class="empty"><div class="big emo">🧪</div><h3>Set your two pset cycles first</h3><p>The research question compares cycle 1 with cycle 2. Add both under “Dates & cycles”.</p></div>`;
  const M = Metrics.compute({ courseId, members: data.members, messages: data.messages, fixes: data.fixes, checks: data.checks, recaps: data.recaps, cycles, organizerIds: app.organizerIds, now: Clock.now() });
  const [c1, c2] = M.cycles;
  const elapsed2 = c2.started ? Math.min(1, (Clock.now() - c2.start) / (c2.end - c2.start)) : 0;
  const pace = c2.started && !c2.finished && c1.studentMsgs && elapsed2 > 0.02 ? c2.studentMsgs / elapsed2 / c1.studentMsgs : null;

  // messages per day across both cycles
  const days = [];
  for (let t = c1.start; t < c2.end; t += 864e5) days.push({ t, n: 0, c2: t >= c2.start, future: t > Clock.now() });
  const org = new Set(app.organizerIds);
  for (const m of data.messages) {
    if (!m.by || org.has(m.by) || m.kind !== "text" || m.deleted) continue;
    const i = Math.floor((m.ts - c1.start) / 864e5);
    if (i >= 0 && i < days.length) days[i].n++;
  }
  const maxN = Math.max(1, ...days.map((d) => d.n));

  const tally = (key, opts) => opts.map((o) => [o, data.surveys.filter((s) => (Array.isArray(s[key]) ? s[key].includes(o) : s[key] === o)).length]);

  return html`<div class="dash">
    <div style=${{ display: "flex", alignItems: "center", gap: "10px", flexWrap: "wrap" }}>
      <div style=${{ flex: 1, minWidth: "240px" }}><b>Do placed students talk, and keep talking?</b><div class="muted" style=${{ fontSize: "13px" }}>${M.placed} students placed in ${Catalog.get(courseId, app.customCourses).code}. ${c1.label}: ${F.md.format(c1.start)}–${F.md.format(c1.end)} · ${c2.label}: ${F.md.format(c2.start)}–${F.md.format(c2.end)}. Organizer activity excluded.</div></div>
      <button class="btn btn-ghost btn-sm" onClick=${refresh}><${Icon} name="history" size=${16} />Refresh</button>
    </div>
    <div class="dash-verdicts">
      <div class="card metric">
        <span class="k">Posted, replied or reacted in ${c1.label}</span>
        <span class="v">${pct(c1.rate)}<small>${c1.contributors} of ${c1.placed}</small></span>
        <${Thresh} v=${c1.rate} kill=${0.15} ok=${0.35} />
        <span class=${"verdict " + M.verdicts.contribution}>${c1.finished ? VERDICT[M.verdicts.contribution] : c1.started ? "In progress · " + VERDICT[M.verdicts.contribution].toLowerCase() : VERDICT.pending}</span>
      </div>
      <div class="card metric">
        <span class="k">${c2.label} messages as a share of ${c1.label}</span>
        <span class="v">${pct(M.retention)}<small>${c2.studentMsgs} vs ${c1.studentMsgs}</small></span>
        <${Thresh} v=${M.retention} proj=${pace} kill=${0.25} ok=${0.5} />
        <span class=${"verdict " + (c2.finished ? M.verdicts.retention : pace == null ? "pending" : pace >= 0.5 ? "success" : pace < 0.25 ? "kill" : "revise")}>${c2.finished ? VERDICT[M.verdicts.retention] : pace != null ? "On pace for " + pct(pace) + " · " + Math.round(elapsed2 * 100) + "% of the cycle gone" : VERDICT.pending}</span>
      </div>
      <div class="card metric">
        <span class="k">Fixes to AI recaps (side signal)</span>
        <span class="v">${M.recaps.length ? (M.recaps.reduce((a, r) => a + r.fixes, 0) / M.recaps.length).toFixed(1) : "—"}<small>per recap</small></span>
        <span class="note">Success: at least 1 per recap. ${M.recaps.filter((r) => r.fixes >= 1).length} of ${M.recaps.length} recaps got one.</span>
        <span class=${"verdict " + M.verdicts.corrections}>${VERDICT[M.verdicts.corrections]}</span>
      </div>
      <div class="card metric">
        <span class="k">Unprompted shares: notes, photos, links</span>
        <span class="v">${M.sharesPerWeek.toFixed(1)}<small>a week</small></span>
        <span class="note">Success: at least 3 a week.</span>
        <span class=${"verdict " + M.verdicts.shares}>${VERDICT[M.verdicts.shares]}</span>
      </div>
    </div>

    <div class="card card-pad" style=${{ display: "grid", gap: "10px" }}>
      <b>Who showed up</b>
      ${[c1, c2].map((c) => {
        const never = Math.max(0, c.placed - c.opened);
        const contrib = c.contributors, silent = c.lurkers;
        const tot = Math.max(1, c.placed);
        return html`<div style=${{ display: "grid", gap: "6px" }}>
          <div style=${{ display: "flex", justifyContent: "space-between", fontSize: "13px" }}><b>${c.label}</b><span class="muted">${c.started ? "" : "not started"}</span></div>
          <div class="split" role="img" aria-label=${c.label + ": " + contrib + " contributed, " + silent + " read only, " + never + " never opened"}>
            <i style=${{ width: (contrib / tot) * 100 + "%", background: "var(--accent)" }}></i>
            <i style=${{ width: (silent / tot) * 100 + "%", background: "var(--amber)" }}></i>
          </div>
          <div class="legend"><span><i style=${{ background: "var(--accent)" }}></i>Contributed ${contrib}</span><span><i style=${{ background: "var(--amber)" }}></i>Opened, never contributed ${silent}</span><span><i style=${{ background: "var(--line)" }}></i>Didn't open ${never}</span></div>
        </div>`;
      })}
      <div class="muted" style=${{ fontSize: "12.5px" }}>GroupMe can't show who read without posting. Roster logs one open per person per day, so lurkers show up here instead of only in the exit survey.</div>
    </div>

    <div class="card card-pad">
      <b>Student messages per day</b>
      <div class="bars" role="img" aria-label="Messages per day">${days.map((d) => html`<i class=${(d.c2 ? "c2" : "") + (d.future ? " future" : "")} title=${F.md.format(d.t) + ": " + d.n} style=${{ height: Math.max(2, (d.n / maxN) * 100) + "%" }}></i>`)}</div>
      <div class="bars-axis"><span>${F.md.format(c1.start)}</span><span>${c2.label} starts ${F.md.format(c2.start)}</span><span>${F.md.format(c2.end)}</span></div>
    </div>

    <div class="card table-wrap">
      <table>
        <thead><tr><th>Per cycle</th><th class="num">Placed</th><th class="num">Opened</th><th class="num">Contributed</th><th class="num">Posters</th><th class="num">Messages</th><th class="num">Reactions</th><th class="num">Fixes</th><th class="num">Top 3 share</th></tr></thead>
        <tbody>${[c1, c2].map((c) => html`<tr><td><b>${c.label}</b></td><td class="num">${c.placed}</td><td class="num">${c.readers}</td><td class="num">${c.contributors}</td><td class="num">${c.posters}</td><td class="num">${c.studentMsgs}</td><td class="num">${c.byType.react}</td><td class="num">${c.byType.fix}</td><td class="num">${pct(c.top3Share)}</td></tr>`)}</tbody>
      </table>
    </div>
    <div class="muted" style=${{ fontSize: "12.5px" }}>“Top 3 share” checks whether one loud group carries the chat: the share of messages written by the three most active students. Each student counts once per cycle toward the contribution rate. People who signed up through a form are more motivated than the average lurker, so treat these numbers as an upper bound.</div>

    ${M.recaps.length ? html`<div class="card table-wrap"><table>
      <thead><tr><th>Recap</th><th class="num">Fixes</th><th class="num">Agreements</th></tr></thead>
      <tbody>${M.recaps.sort((a, b) => a.lecture - b.lecture).map((r) => html`<tr><td>Lecture ${r.lecture} · ${r.title}</td><td class="num">${r.fixes}</td><td class="num">${r.agrees}</td></tr>`)}</tbody>
    </table></div>` : null}

    <div class="card card-pad" style=${{ display: "grid", gap: "8px" }}>
      <b>Exit survey · ${data.surveys.length} ${data.surveys.length === 1 ? "answer" : "answers"}</b>
      ${data.surveys.length ? html`
        <div class="legend">${tally("q1", Q1).map(([o, n]) => html`<span>${o}: <b>${n}</b></span>`)}</div>
        <div class="legend">Replaced: ${tally("q2", Q2).filter(([, n]) => n).map(([o, n]) => html`<span>${o}: <b>${n}</b></span>`)}</div>
        ${data.surveys.filter((s) => s.q3).slice(0, 12).map((s) => html`<div class="sysline" style=${{ alignSelf: "start", textAlign: "left", borderRadius: "12px" }}>“${s.q3}”</div>`)}`
      : html`<div class="muted" style=${{ fontSize: "13px" }}>The survey card appears in the hub for every student once ${c1.label} ends.</div>`}
    </div>
  </div>`;
}

function RecapComposer({ courseId, onDone }) {
  const app = useApp();
  const c = Catalog.get(courseId, app.customCourses);
  const [lecture, setLecture] = useState("");
  const [date, setDate] = useState(toLocalInput(Clock.now()));
  const [title, setTitle] = useState("");
  const [sections, setSections] = useState("");
  const [notes, setNotes] = useState("");
  const [bullets, setBullets] = useState([]);
  const [busy, setBusy] = useState(false);
  const [stream, setStream] = useState("");
  const ctl = useRef(null);
  useEffect(() => {
    app.db.collection("recaps/" + courseId + "/items").get().then((s) => {
      const n = s.docs.reduce((m, d) => Math.max(m, d.data().lecture || 0), 0);
      setLecture(String(n + 1));
    }).catch(() => setLecture("1"));
  }, [courseId]);

  const draft = async () => {
    if (!app.sample) return;
    ctl.current = new AbortController();
    setBusy(true); setStream("");
    const prompt = "You are drafting a lecture recap for a student-run class group chat for " + c.code + (c.title ? " (" + c.title + ")" : "") + " at Harvard.\n" +
      "Use ONLY the organizer's notes below. Do not add facts, examples or formulas that are not in the notes. Keep the course's own notation and conventions exactly as the notes write them (for example, how a distribution is parameterized), even if other textbooks differ.\n" +
      "Reply with only JSON: {\"title\": short lecture title, \"bullets\": [{\"text\": one plain sentence of at most 30 words, \"ref\": the slide, timestamp or section the notes tie it to, or \"\"}]} with 4 to 6 bullets.\n\nNotes:\n\"\"\"\n" + notes.slice(0, 20000) + "\n\"\"\"";
    try {
      const out = await app.sample.json(prompt, { signal: ctl.current.signal, onText: ({ text }) => setStream(text) });
      if (out && Array.isArray(out.bullets)) {
        setBullets(out.bullets.slice(0, 8).map((b, i) => ({ id: "b" + (i + 1), text: String(b.text || "").trim(), ref: String(b.ref || "").trim() })).filter((b) => b.text));
        if (!title && out.title) setTitle(String(out.title));
      } else app.toast("Claude's draft didn't come back as a list. Try again or write the lines yourself.");
    } catch (e) {
      if (e && e.code === "cancelled") { /* stopped */ }
      else if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) app.toast("Claude isn't available on this view. Write the lines yourself below.");
      else if (e && e.code === "rate_limited") app.toast("Too many requests right now. Try again in a minute.");
      else app.toast("The draft didn't finish. Try again, or write the lines yourself.");
    }
    setBusy(false);
  };
  const setB = (i, k, v) => setBullets(bullets.map((b, j) => (j === i ? { ...b, [k]: v } : b)));
  const post = async () => {
    const clean = bullets.map((b, i) => ({ id: "b" + (i + 1), text: b.text.trim(), ref: (b.ref || "").trim() })).filter((b) => b.text);
    const ok = await app.postRecap(courseId, { lecture: Number(lecture) || 1, title: title.trim(), sections: sections.trim(), date: fromLocalInput(date) || Clock.now(), bullets: clean });
    if (ok) onDone();
  };
  return html`<div class="dash">
    <div class="grid2">
      <label class="field"><span>Lecture number</span><input id="rc-lecture" class="input" inputmode="numeric" value=${lecture} onInput=${(e) => setLecture(e.target.value)} /></label>
      <label class="field"><span>Lecture date</span><input id="rc-date" class="input" type="datetime-local" value=${date} onInput=${(e) => setDate(e.target.value)} /></label>
      <label class="field"><span>Title</span><input id="rc-title" class="input" value=${title} onInput=${(e) => setTitle(e.target.value)} placeholder="Expectation & Linearity" /></label>
      <label class="field"><span>Textbook sections</span><input id="rc-sections" class="input" value=${sections} onInput=${(e) => setSections(e.target.value)} placeholder="§4.1–4.3" /></label>
    </div>
    <label class="field"><span>Your lecture notes, slide text or transcript</span>
      <textarea id="rc-notes" class="input" rows="7" value=${notes} onInput=${(e) => setNotes(e.target.value)} placeholder="Paste what you wrote down. Claude drafts only from this, so it can't invent what wasn't said."></textarea></label>
    <div style=${{ display: "flex", gap: "10px", alignItems: "center", flexWrap: "wrap" }}>
      ${app.sample ? html`<button class="btn btn-ink" disabled=${busy || notes.trim().length < 40} onClick=${draft}><${Icon} name="ai" size=${18} />${busy ? "Drafting…" : "Draft with Claude"}</button>` : html`<span class="muted" style=${{ fontSize: "13px" }}>Claude isn't available on this view. Write the lines yourself.</span>`}
      ${busy ? html`<button class="btn btn-ghost" onClick=${() => ctl.current && ctl.current.abort()}>Stop</button><span class="shimmer">Claude is drafting from your notes</span>` : null}
      <button class="btn btn-ghost" onClick=${() => setBullets([...bullets, { id: "b" + (bullets.length + 1), text: "", ref: "" }])}><${Icon} name="plus" size=${18} />Add a line</button>
    </div>
    ${busy && stream ? html`<div class="stream">${stream}</div>` : null}
    ${bullets.length ? html`<div class="card card-pad" style=${{ display: "grid", gap: "8px" }}>
      <b>Check every line against your notes before posting</b>
      ${bullets.map((b, i) => html`<div class="draft-bullet" key=${i}>
        <textarea id=${"rc-b-" + i} class="input" rows="2" value=${b.text} onInput=${(e) => setB(i, "text", e.target.value)} aria-label=${"Line " + (i + 1)}></textarea>
        <input id=${"rc-r-" + i} class="input" value=${b.ref} onInput=${(e) => setB(i, "ref", e.target.value)} placeholder="Slide 14" aria-label=${"Reference for line " + (i + 1)} />
        <button class="iconbtn" onClick=${() => setBullets(bullets.filter((_, j) => j !== i))} aria-label=${"Remove line " + (i + 1)}><${Icon} name="x" /></button>
      </div>`)}
    </div>` : null}
    <div style=${{ display: "flex", justifyContent: "flex-end", gap: "10px" }}>
      <button class="btn btn-primary" disabled=${!title.trim() || !bullets.some((b) => b.text.trim())} onClick=${post}>Post recap to ${c.code}</button>
    </div>
  </div>`;
}

function HubEditor({ courseId }) {
  const app = useApp();
  const hub = useDocData(() => app.db.doc("hub/" + courseId), [courseId]);
  const threads = useCollection(() => app.db.collection("courses/" + courseId + "/threads"), [courseId]);
  const [form, setForm] = useState(null);
  const [newT, setNewT] = useState({ title: "", due: "", problems: "" });
  useEffect(() => {
    if (hub === null || form) return;
    const h = hub || {};
    const def = Clock.now();
    setForm({
      due: (h.due || []).map((d) => ({ ...d, at: toLocalInput(d.at) })),
      cycles: (h.cycles && h.cycles.length ? h.cycles : [{ id: "c1", label: "PSet 1", start: def, end: def + 7 * 864e5 }, { id: "c2", label: "PSet 2", start: def + 7 * 864e5, end: def + 14 * 864e5 }]).map((c) => ({ ...c, start: toLocalInput(c.start), end: toLocalInput(c.end) })),
      rules: (h.rules || ["Collaboration follows the course syllabus: talk through ideas, write up your own solutions.", "No posting solutions or answers to graded problems.", "This chat is run by a student. Course staff are not in it."]).join("\n"),
      links: (h.links || []).map((l) => l.title + " | " + l.url).join("\n"),
    });
  }, [hub]);
  if (!form) return html`<div class="muted">Loading…</div>`;
  const upd = (k, i, f, v) => setForm({ ...form, [k]: form[k].map((x, j) => (j === i ? { ...x, [f]: v } : x)) });
  const save = async () => {
    const data = {
      ...(hub || {}),
      due: form.due.filter((d) => d.title.trim() && d.at).map((d, i) => ({ id: d.id || "d" + Date.now().toString(36) + i, title: d.title.trim(), at: fromLocalInput(d.at), where: (d.where || "").trim() })),
      cycles: form.cycles.map((c, i) => ({ id: "c" + (i + 1), label: c.label.trim() || "Cycle " + (i + 1), start: fromLocalInput(c.start), end: fromLocalInput(c.end) })),
      rules: form.rules.split("\n").map((s) => s.trim()).filter(Boolean),

    };
    delete data.id;
    await app.write(() => app.db.doc("hub/" + courseId).set(data), "Saved. Everyone in the class sees the new dates.");
  };
  const addThread = async () => {
    const due = fromLocalInput(newT.due);
    const id = (newT.title.trim().toLowerCase().replace(/[^a-z0-9]+/g, "") || "pset") + "-" + Date.now().toString(36).slice(-4);
    const ok = await app.write(() => app.db.doc("courses/" + courseId + "/threads/" + id).set({ title: newT.title.trim(), kind: "pset", due, problems: newT.problems.split(/[,\s]+/).map((s) => s.trim().toLowerCase().replace(/[()]/g, "")).filter(Boolean), ts: Clock.now(), by: app.uid }), "PSet topic added.");
    if (ok) setNewT({ title: "", due: "", problems: "" });
  };
  return html`<div class="dash">
    <div class="card card-pad" style=${{ display: "grid", gap: "10px" }}>
      <b>Pinned dates</b>
      ${form.due.map((d, i) => html`<div class="draft-bullet" style=${{ gridTemplateColumns: "minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr) 34px" }} key=${i}>
        <input id=${"due-t-" + i} class="input" value=${d.title} placeholder="PSet 5" onInput=${(e) => upd("due", i, "title", e.target.value)} aria-label="Title" />
        <input id=${"due-a-" + i} class="input" type="datetime-local" value=${d.at} onInput=${(e) => upd("due", i, "at", e.target.value)} aria-label="Due" />
        <input id=${"due-w-" + i} class="input" value=${d.where || ""} placeholder="Gradescope" onInput=${(e) => upd("due", i, "where", e.target.value)} aria-label="Where" />
        <button class="iconbtn" onClick=${() => setForm({ ...form, due: form.due.filter((_, j) => j !== i) })} aria-label="Remove"><${Icon} name="x" /></button>
      </div>`)}
      <button class="btn btn-ghost btn-sm" style=${{ justifySelf: "start" }} onClick=${() => setForm({ ...form, due: [...form.due, { title: "", at: "", where: "" }] })}><${Icon} name="plus" size=${16} />Add a date</button>
    </div>
    <div class="card card-pad" style=${{ display: "grid", gap: "10px" }}>
      <b>Experiment cycles</b>
      <div class="muted" style=${{ fontSize: "13px" }}>Cycle 1 is the first full pset after placement; cycle 2 is the next one, run with no prompting. Avoid midterm week.</div>
      ${form.cycles.map((c, i) => html`<div class="draft-bullet" style=${{ gridTemplateColumns: "minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr)" }} key=${i}>
        <input id=${"cy-l-" + i} class="input" value=${c.label} onInput=${(e) => upd("cycles", i, "label", e.target.value)} aria-label=${"Cycle " + (i + 1) + " label"} />
        <input id=${"cy-s-" + i} class="input" type="datetime-local" value=${c.start} onInput=${(e) => upd("cycles", i, "start", e.target.value)} aria-label="Start" />
        <input id=${"cy-e-" + i} class="input" type="datetime-local" value=${c.end} onInput=${(e) => upd("cycles", i, "end", e.target.value)} aria-label="End" />
      </div>`)}

function Exporter({ courseId }) {
  const app = useApp();
  const [data] = useCourseLog(courseId);
  if (!data) return html`<div class="muted">Reading the chat log…</div>`;
  const cycles = (data.hub && data.hub.cycles) || [];
  const csv = Metrics.csv({ courseId, members: data.members, messages: data.messages, fixes: data.fixes, cycles, organizerIds: app.organizerIds });
  const summary = Metrics.compute({ courseId, members: data.members, messages: data.messages, fixes: data.fixes, checks: data.checks, recaps: data.recaps, cycles, organizerIds: app.organizerIds, now: Clock.now() });
  const rows = csv.split("\n");
  const save = async (filename, body) => {
    if (!app.downloads) { app.toast("Downloads aren't available here. Copy the text below instead."); return; }
    try { await app.downloads.save({ filename, data: body }); }
    catch (e) { if (!e || e.code !== "declined") app.toast("The file couldn't be saved here."); }
  };
  const code = Catalog.get(courseId, app.customCourses).code.replace(/\s+/g, "").toLowerCase();
  return html`<div class="dash">
    <div class="muted" style=${{ fontSize: "13.5px" }}>The log has no names and no message text: every student is a stable alias (S001…), the organizer is ORGANIZER. That's enough to recompute every number in the write-up.</div>
    <div style=${{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
      <button class="btn btn-primary" onClick=${() => save("roster-" + code + "-log.csv", csv)}><${Icon} name="download" size=${18} />Chat log · CSV · ${rows.length - 1} events</button>
      <button class="btn btn-ghost" onClick=${() => save("roster-" + code + "-results.json", JSON.stringify(summary, null, 2))}><${Icon} name="download" size=${18} />Results · JSON</button>
    </div>
    <div class="card table-wrap"><table>
      <thead><tr>${rows[0].split(",").map((h) => html`<th>${h}</th>`)}</tr></thead>
      <tbody>${rows.slice(-8).map((r) => html`<tr>${r.split(",").map((v) => html`<td>${v}</td>`)}</tr>`)}</tbody>
    </table></div>
    <label class="field"><span>Or copy it</span><textarea id="export-csv" class="input" rows="5" readonly value=${csv}></textarea></label>
  </div>`;
}

function useCourseCounts() {
  const app = useApp();
  return useMemo(() => {
    const counts = {}, faces = {};
    for (const m of app.members) for (const cid of Object.keys(m.courses || {})) {
      if (m.id === app.uid) continue;
      counts[cid] = (counts[cid] || 0) + 1;
      (faces[cid] = faces[cid] || []).length < 4 && faces[cid].push(m.id);
    }
    return { counts, faces };
  }, [app.members]);
}

    const found = new Map();

    let m;
    while ((m = re.exec(String(text).toUpperCase()))) {
      const c = m[1] + " " + m[2];

        <span class="add"><${Icon} name=${picked.some((p) => p.id === customId) ? "check" : "plus"} size=${18} /></span></button>` : null}
      ${results.map((c) => {
