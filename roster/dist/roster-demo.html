<title>Roster Demo Class</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..800;1,400..600&display=swap">
<style>
/* Layout: Saturn-style app — crimson school band over white sheets (light), navy with crimson glow (dark).
   Desktop is three panes (classes | chat | hub), phone is one pane at a time. Tokens and sources: DESIGN.md */
:root {
  --canvas: #F1F3F5;          /* Saturn light-mode ground */
  --surface: #FFFFFF;         /* Saturn white sheet */
  --surface-2: #F7F8FA;
  --raised: #FFFFFF;
  --bubble: #EDEFF2;          /* iMessage light incoming ~#E9E9EB */
  --bubble-ink: #111318;
  --own: #A51C30;             /* Harvard Crimson — school colour as Saturn/Fizz theme it */
  --own-ink: #FFFFFF;
  --own-meta: rgba(255,255,255,.72);
  --ink: #111318;
  --ink-2: #5E636E;
  --ink-3: #8A8F99;
  --ai-ink: #8A8F99;          /* Granola: AI text in grey until a person checks it */
  --line: #E3E6EB;
  --line-2: #EEF0F3;
  --accent: #A51C30;
  --accent-text: #A51C30;
  --accent-soft: #FBEAED;
  --accent-ink: #FFFFFF;
  --band-1: #B3213B;          /* school band gradient, Saturn hero recoloured */
  --band-2: #7A1226;
  --band-glow: rgba(255,170,185,.28);
  --amber: #A86A0B;           /* Saturn countdown amber, darkened for light ground */
  --amber-soft: #FFF4DE;
  --green: #138A6B;           /* Saturn "Free" */
  --green-soft: #E3F5EE;
  --red: #E22647;             /* Saturn badge */
  --online: #3D9E60;          /* Discord status online */
  --mention-wash: rgba(248,163,0,.10);  /* Discord mentioned-row wash */
  --flash: rgba(165,28,48,.14);
  --shadow-card: 0 1px 2px rgba(17,19,24,.05), 0 8px 24px rgba(17,19,24,.07);
  --shadow-pop: 0 2px 6px rgba(17,19,24,.08), 0 16px 40px rgba(17,19,24,.16);
  --scrim: rgba(12,14,22,.42);
  --n1: #CC5049; --n2: #D67722; --n3: #955CDB; --n4: #3A9A1F; --n5: #2B8FAA; --n6: #2F7CC2; --n7: #C7508B; /* Telegram sender hues */
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --r-sheet: 20px; --r-card: 16px; --r-btn: 12px; --r-bubble: 18px; --r-join: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --canvas: #0B0E1D; --surface: #10142A; --surface-2: #151A33; --raised: #181D38;
    --bubble: #1E2342; --bubble-ink: #EEF0F7; --own: #B4233D; --own-ink: #FFFFFF; --own-meta: rgba(255,255,255,.7);
    --ink: #F1F3F9; --ink-2: #A3A9BF; --ink-3: #747A95; --ai-ink: #8C92AB;
    --line: #262C4C; --line-2: #1D223F;
    --accent: #C42A45; --accent-text: #FF8497; --accent-soft: rgba(196,42,69,.18); --accent-ink: #FFFFFF;
    --band-1: #2A0F25; --band-2: #12142E; --band-glow: rgba(196,42,69,.45);
    --amber: #F5C063; --amber-soft: rgba(245,192,99,.13);
    --green: #3DD6A5; --green-soft: rgba(61,214,165,.13);
    --red: #FF4A67; --online: #3D9E60;
    --mention-wash: rgba(248,163,0,.09); --flash: rgba(255,132,151,.16);
    --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 18px 48px rgba(0,0,0,.55);
    --scrim: rgba(3,5,14,.62);
    --n1: #FF8A80; --n2: #FFB45E; --n3: #BC9BFF; --n4: #7FD86C; --n5: #5CCBE6; --n6: #72B6F7; --n7: #F684BD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --canvas: #0B0E1D; --surface: #10142A; --surface-2: #151A33; --raised: #181D38;
  --bubble: #1E2342; --bubble-ink: #EEF0F7; --own: #B4233D; --own-ink: #FFFFFF; --own-meta: rgba(255,255,255,.7);
  --ink: #F1F3F9; --ink-2: #A3A9BF; --ink-3: #747A95; --ai-ink: #8C92AB;
  --line: #262C4C; --line-2: #1D223F;
  --accent: #C42A45; --accent-text: #FF8497; --accent-soft: rgba(196,42,69,.18); --accent-ink: #FFFFFF;
  --band-1: #2A0F25; --band-2: #12142E; --band-glow: rgba(196,42,69,.45);
  --amber: #F5C063; --amber-soft: rgba(245,192,99,.13);
  --green: #3DD6A5; --green-soft: rgba(61,214,165,.13);
  --red: #FF4A67; --online: #3D9E60;
  --mention-wash: rgba(248,163,0,.09); --flash: rgba(255,132,151,.16);
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
  --shadow-pop: 0 2px 8px rgba(0,0,0,.4), 0 18px 48px rgba(0,0,0,.55);
  --scrim: rgba(3,5,14,.62);
  --n1: #FF8A80; --n2: #FFB45E; --n3: #BC9BFF; --n4: #7FD86C; --n5: #5CCBE6; --n6: #72B6F7; --n7: #F684BD;
  color-scheme: dark;
}

/* ---------- base ---------- */
html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); font: 400 15px/1.4 var(--font); word-spacing: .05em; -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
input, textarea, select { font: inherit; color: inherit; }
a { color: var(--accent-text); }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 8px; }
.ic { display: inline-flex; flex: none; line-height: 0; }
.emo { font-family: var(--emoji); font-style: normal; line-height: 1; }
.tnum { font-variant-numeric: tabular-nums; }
.label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.app-root { height: 100%; }

/* ---------- boot ---------- */
.boot { height: 100%; display: grid; place-content: center; text-align: center; gap: 6px;
  background: radial-gradient(120% 70% at 50% 10%, var(--band-glow), transparent 60%), linear-gradient(180deg, var(--band-1), var(--band-2)); color: #fff; }
.boot-mark { font: 800 40px/1 var(--font); letter-spacing: -.03em; }
.boot-sub { font-size: 14px; opacity: .78; }

/* ---------- primitives ---------- */
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: var(--r-btn);
  font-weight: 700; font-size: 15px; transition: transform .12s ease, background-color .15s ease, opacity .15s; white-space: nowrap; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ink { background: var(--ink); color: var(--surface); }
.btn-white { background: #fff; color: #A51C30; }
.btn-soft { background: var(--accent-soft); color: var(--accent-text); }
.btn-ghost { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); }
.btn-sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn-block { width: 100%; }
.iconbtn { width: 36px; height: 36px; border-radius: 999px; display: inline-grid; place-items: center; color: var(--ink-2); transition: background-color .15s, color .15s; }
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill-soft { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.pill-accent { background: var(--accent-soft); color: var(--accent-text); }
.pill-amber { background: var(--amber-soft); color: var(--amber); }
.pill-green { background: var(--green-soft); color: var(--green); }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 14px; font-size: 16px; outline: none; transition: border-color .15s, box-shadow .15s; }
.input:focus { border-color: var(--accent-text); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { height: auto; min-height: 96px; padding: 12px 14px; resize: vertical; line-height: 1.45; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 18px) 20px, calc(100% - 13px) 20px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }

/* avatars: people are circles (Discord 2026) */
.av { position: relative; flex: none; border-radius: 999px; display: inline-grid; place-items: center; color: #fff; font-weight: 700; overflow: hidden; user-select: none; }
.av img { width: 100%; height: 100%; object-fit: cover; }
.av-dot { position: absolute; right: -1px; bottom: -1px; width: 30%; height: 30%; min-width: 9px; min-height: 9px; border-radius: 999px; background: var(--online); box-shadow: 0 0 0 2px var(--surface); }
.stack { display: inline-flex; align-items: center; }
.stack .av { box-shadow: 0 0 0 2px var(--surface); }
.stack .av + .av { margin-left: -7px; }
.stack .count { margin-left: 4px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
/* courses are squircles with an emoji (Saturn emoji + Sidechat group gradient) */
.tile { flex: none; display: grid; place-items: center; border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.tile .emo { filter: drop-shadow(0 1px 1px rgba(0,0,0,.18)); }

/* ---------- layout ---------- */
.app { height: 100%; display: grid; grid-template-columns: 300px minmax(0,1fr) 340px; background: var(--canvas); }
.app.no-hub { grid-template-columns: 300px minmax(0,1fr); }
.pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.pane-main { background: var(--surface); border-left: 1px solid var(--line); border-right: 1px solid var(--line); position: relative; }
.pane-hub { background: var(--canvas); overflow-y: auto; overscroll-behavior: contain; }
@media (max-width: 1099px) {
  .app, .app.no-hub { grid-template-columns: 280px minmax(0,1fr); }
  .pane-hub { position: fixed; z-index: 40; top: 0; right: 0; bottom: 0; width: min(380px, 92vw); box-shadow: var(--shadow-pop); transform: translateX(105%); transition: transform .25s ease; padding-top: env(safe-area-inset-top, 0px); }
  .app.hub-open .pane-hub { transform: none; }
  .hub-scrim { position: fixed; inset: 0; z-index: 39; background: var(--scrim); }
}
@media (max-width: 759px) {
  .app, .app.no-hub { grid-template-columns: minmax(0,1fr); }
  .app[data-pane="list"] .pane-main { display: none; }
  .app[data-pane="chat"] .pane-side { display: none; }
  .pane-main { border: 0; }
  body { font-size: 16px; }
}

/* ---------- sidebar (Saturn calendar tab: school band + white sheet) ---------- */
.pane-side { background: var(--canvas); }
.band { position: relative; padding: 14px 16px 30px; color: #fff; background: radial-gradient(140% 120% at 85% -20%, var(--band-glow), transparent 55%), linear-gradient(160deg, var(--band-1), var(--band-2)); }
.band-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wordmark { font: 800 22px/1 var(--font); letter-spacing: -.035em; display: inline-flex; align-items: baseline; gap: 6px; }
.wordmark small { font: 600 12px/1 var(--font); letter-spacing: 0; opacity: .72; }
.band .iconbtn { color: rgba(255,255,255,.85); }
.band .iconbtn:hover { background: rgba(255,255,255,.14); color: #fff; }
.countpill { margin-top: 14px; display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 34px; padding: 0 12px 0 6px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 13px; font-weight: 600; text-align: left; }
.countpill .t { flex: none; white-space: nowrap; height: 24px; padding: 0 9px; border-radius: 999px; background: rgba(0,0,0,.22); display: inline-grid; place-items: center; font-weight: 800; font-variant-numeric: tabular-nums; color: #FFD892; }
.countpill .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sheet { flex: 1; min-height: 0; margin-top: -18px; position: relative; background: var(--surface); border-radius: var(--r-sheet) var(--r-sheet) 0 0; display: flex; flex-direction: column; box-shadow: 0 -1px 0 var(--line-2); }
.sheet-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 8px 0 12px; }
.side-h { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 6px; }
.class-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 16px; text-align: left; transition: background-color .12s; position: relative; }
.class-row:hover { background: var(--surface-2); }
.class-row.on { background: var(--accent-soft); }
.class-row.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
.class-row .body { flex: 1; min-width: 0; display: grid; gap: 1px; overflow: hidden; }
.class-row .body > span { min-width: 0; }
.class-row .top { display: flex; align-items: baseline; gap: 8px; }
.class-row .code { font-weight: 800; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
.class-row .when { margin-left: auto; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.class-row .prev { min-width: 0; font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.class-row .prev b { color: var(--ink); font-weight: 600; }
.class-row.unread .prev { color: var(--ink); }
.class-row .badge { margin-left: 6px; }
.up-row { display: flex; gap: 12px; align-items: center; padding: 9px 16px; }
.up-row .d { width: 42px; flex: none; text-align: center; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px 0; }
.up-row .d b { display: block; font-size: 15px; font-weight: 800; line-height: 1.1; }
.up-row .d span { display: block; font-size: 10px; font-weight: 700; color: var(--accent-text); text-transform: uppercase; letter-spacing: .05em; }
.up-row .body { min-width: 0; flex: 1; }
.up-row .t1 { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.up-row .t2 { font-size: 12px; color: var(--ink-2); }
.up-row .left { font-size: 12px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; white-space: nowrap; }
.me-island { display: flex; align-items: center; gap: 10px; padding: 10px 12px 10px 16px; border-top: 1px solid var(--line); background: var(--surface); padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.me-island .who { min-width: 0; flex: 1; }
.me-island .n { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-island .s { font-size: 12px; color: var(--ink-2); }

/* ---------- demo / access banner ---------- */
.banner { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; background: var(--amber-soft); color: var(--ink); border-bottom: 1px solid var(--line); }
.banner b { font-weight: 700; }
.banner .grow { flex: 1; min-width: 0; }
.banner button { font-weight: 700; color: var(--amber); white-space: nowrap; }

/* ---------- chat header + tabs + pinned bar ---------- */
.chat-head { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 16px; min-height: 64px; border-bottom: 1px solid var(--line-2); background: var(--surface); }
.chat-head .meta { min-width: 0; flex: 1; }
.chat-head .t { font-weight: 800; font-size: 17px; letter-spacing: -.015em; display: flex; align-items: center; gap: 8px; min-width: 0; }
.chat-head .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-head .t .code { flex: none; }
@media (max-width: 759px) { .chat-head .t .ttl { display: none; } }
.chat-head .s { font-size: 13px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-head .s .on { color: var(--online); font-weight: 600; }
.chat-head .back { display: none; margin-left: -8px; }
@media (max-width: 759px) { .chat-head .back { display: inline-grid; } }
.tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--surface); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { position: relative; height: 42px; padding: 0 10px; font-size: 14px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.tab.on { color: var(--ink); }
.tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--accent); }
.tab .badge { height: 18px; min-width: 18px; font-size: 11px; }
.tab-hub { display: none; }
@media (max-width: 1099px) { .tab-hub { display: inline-flex; } }
.pinbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-bottom: 1px solid var(--line-2); background: var(--surface); text-align: left; width: 100%; }
.pinbar .seg { display: grid; gap: 2px; width: 3px; align-self: stretch; }
.pinbar .seg i { display: block; border-radius: 2px; background: var(--line); }
.pinbar .seg i.on { background: var(--accent); }
.pinbar .body { min-width: 0; flex: 1; }
.pinbar .k { font-size: 12px; font-weight: 700; color: var(--accent-text); }
.pinbar .v { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pinbar .cd { text-align: right; line-height: 1.1; }
.pinbar .cd small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--amber); }
.pinbar .cd b { font-size: 17px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; }

/* ---------- message list ---------- */
.scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.msgs { padding: 12px 16px 8px; display: flex; flex-direction: column; max-width: 860px; margin: 0 auto; width: 100%; }
.daysep { position: relative; z-index: 3; align-self: center; margin: 14px 0 8px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink-2); background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2px 8px rgba(17,19,24,.08); }
.unread-div { display: flex; align-items: center; gap: 10px; margin: 10px 0; color: var(--red); font-size: 12px; font-weight: 800; letter-spacing: .02em; }
.unread-div::before, .unread-div::after { content: ""; flex: 1; height: 1px; background: var(--red); opacity: .5; }
.sysline { align-self: center; max-width: 92%; margin: 8px 0; padding: 5px 12px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; font-weight: 600; text-align: center; }
.run { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; }
.run.mine { flex-direction: row-reverse; }
.run > .av { margin-top: 2px; }
.run .col { min-width: 0; display: flex; flex-direction: column; gap: 2px; max-width: min(78%, 560px); align-items: flex-start; }
.run.mine .col { align-items: flex-end; }
.msg { position: relative; display: flex; flex-direction: column; max-width: 100%; border-radius: 8px; }
.run.mine .msg { align-items: flex-end; }
.bub { position: relative; padding: 7px 12px 8px; background: var(--bubble); color: var(--bubble-ink); border-radius: var(--r-bubble); max-width: 100%; overflow-wrap: anywhere; line-height: 1.38; }
.run:not(.mine) .msg + .msg .bub { border-top-left-radius: var(--r-join); }
.run:not(.mine) .msg:not(:last-child) .bub { border-bottom-left-radius: var(--r-join); }
.run.mine .bub { background: var(--own); color: var(--own-ink); }
.run.mine .msg + .msg .bub { border-top-right-radius: var(--r-join); }
.run.mine .msg:not(:last-child) .bub { border-bottom-right-radius: var(--r-join); }
.bub .hd { display: flex; align-items: baseline; gap: 6px; margin-bottom: 1px; font-size: 13.5px; }
.bub .hd b { font-weight: 800; }
.bub .hd .tm { font-size: 12px; color: var(--ink-3); font-weight: 600; }
.bub .hd .tag { font-size: 11px; font-weight: 700; color: var(--ink-3); }
.bub .tx { white-space: pre-wrap; }
.bub .tx a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.bub .edited { font-size: 11px; opacity: .65; margin-left: 4px; }
.bub .ptag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; margin-right: 6px; border-radius: 6px; background: rgba(127,127,127,.16); font-size: 12px; font-weight: 800; vertical-align: 1px; }
.mention { padding: 0 3px; border-radius: 4px; background: var(--accent-soft); color: var(--accent-text); font-weight: 700; }
.run.mine .mention { background: rgba(255,255,255,.2); color: #fff; }
.msg.mentions-me .bub { box-shadow: 0 0 0 2px var(--mention-wash), inset 3px 0 0 #F8A300; }
.mine-meta { font-size: 11.5px; color: var(--ink-3); margin: 2px 4px 0; font-weight: 600; }
.msg.flash .bub { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 4px var(--flash); } 100% { box-shadow: 0 0 0 0 transparent; } }
.quote { display: block; width: 100%; text-align: left; margin: 2px 0 5px; padding: 5px 9px; border-radius: 10px; border-left: 3px solid currentColor; background: rgba(127,127,127,.12); font-size: 13px; line-height: 1.3; }
.quote b { display: block; font-weight: 800; font-size: 12.5px; }
.quote span { display: block; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
.run.mine .quote { background: rgba(0,0,0,.16); color: #fff; }
.run.mine .quote span { color: rgba(255,255,255,.82); }
.attach { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; padding: 8px 10px; border-radius: 12px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); min-width: 220px; text-align: left; }
.attach .fi { width: 34px; height: 40px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #fff; background: #D9472B; flex: none; }
.attach .fi.image { background: #2F7CC2; }
.attach .nm { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30ch; }
.attach .sz { font-size: 12px; color: var(--ink-3); }
.reacts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: -6px; padding: 0 8px; position: relative; z-index: 1; }
.react { height: 26px; padding: 0 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--ink-2); box-shadow: 0 1px 2px rgba(17,19,24,.06); font-variant-numeric: tabular-nums; }
.react .emo { font-size: 14px; }
.react.me { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.react.add { color: var(--ink-3); padding: 0 6px; }
.hover-tools { position: absolute; top: -18px; display: none; gap: 2px; padding: 3px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow-pop); z-index: 5; }
.run:not(.mine) .hover-tools { right: -8px; transform: translateX(100%); top: 0; }
.run.mine .hover-tools { left: -8px; transform: translateX(-100%); top: 0; }
@media (hover: hover) { .msg:hover .hover-tools, .msg:focus-within .hover-tools { display: flex; } }
.hover-tools button { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--ink-2); font-size: 17px; }
.hover-tools button:hover { background: var(--surface-2); color: var(--ink); }
.jump { position: absolute; right: 16px; bottom: 12px; z-index: 6; height: 38px; padding: 0 14px 0 10px; border-radius: 999px; background: var(--raised); border: 1px solid var(--line); box-shadow: var(--shadow-pop); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; }
.empty { margin: auto; padding: 40px 24px; text-align: center; max-width: 380px; display: grid; gap: 10px; justify-items: center; }
.empty .big { font-size: 44px; }
.empty h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.empty p { margin: 0; color: var(--ink-2); font-size: 14px; }

/* ---------- composer ---------- */
.composer-wrap { padding: 6px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); }
.typing { height: 20px; font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; padding: 0 6px; max-width: 860px; margin: 0 auto; }
.typing b { color: var(--ink); font-weight: 700; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 99px; background: var(--ink-3); animation: dot 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: .15s; } .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
.replying { display: flex; align-items: center; gap: 10px; max-width: 860px; margin: 0 auto 6px; padding: 7px 8px 7px 12px; border-radius: 12px; background: var(--surface-2); border-left: 3px solid var(--accent); font-size: 13px; }
.replying .body { min-width: 0; flex: 1; }
.replying b { font-weight: 800; }
.replying span { display: block; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.composer { display: flex; align-items: flex-end; gap: 8px; max-width: 860px; margin: 0 auto; }
.composer .field-wrap { flex: 1; min-width: 0; display: flex; align-items: flex-end; gap: 4px; padding: 4px 4px 4px 6px; border-radius: 22px; background: var(--surface-2); border: 1px solid var(--line); transition: border-color .15s; }
.composer .field-wrap:focus-within { border-color: var(--ink-3); }
.composer textarea { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; resize: none; padding: 8px 4px; max-height: 140px; font-size: 16px; line-height: 1.35; }
.composer .send { width: 44px; height: 44px; border-radius: 999px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; transition: transform .15s ease, opacity .15s; }
.composer .send:disabled { opacity: .35; }
.ptag-pick { height: 34px; padding: 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; flex: none; margin-bottom: 1px; }
.readonly { max-width: 860px; margin: 0 auto; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13.5px; color: var(--ink-2); display: flex; gap: 10px; align-items: center; }
.readonly .grow { flex: 1; }

/* ---------- pickers / popovers ---------- */
.pop { position: fixed; z-index: 60; background: var(--raised); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 6px; }
.emoji-tray { display: flex; gap: 2px; }
.emoji-tray button { width: 40px; height: 40px; border-radius: 12px; font-size: 22px; display: grid; place-items: center; transition: transform .12s; }
.emoji-tray button:hover { background: var(--surface-2); transform: scale(1.12); }
.emoji-grid { display: grid; grid-template-columns: repeat(8, 36px); gap: 2px; padding: 4px; max-height: 220px; overflow-y: auto; }
.emoji-grid button { width: 36px; height: 36px; border-radius: 10px; font-size: 20px; }
.emoji-grid button:hover { background: var(--surface-2); }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; text-align: left; }
.menu button:hover { background: var(--surface-2); }

/* ---------- sheets / modals / toasts ---------- */
.scrim { position: fixed; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 16px; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: min(86vh, 860px); overflow: hidden; display: flex; flex-direction: column; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-pop); animation: rise .22s cubic-bezier(.2,.9,.3,1.15); }
.modal.wide { width: min(980px, 100%); }
@keyframes rise { from { transform: translateY(14px) scale(.98); opacity: 0; } }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px 20px; border-bottom: 1px solid var(--line-2); }
.modal-h h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.015em; flex: 1; min-width: 0; }
.modal-b { padding: 16px 20px 20px; overflow-y: auto; display: grid; gap: 14px; }
.modal-f { padding: 12px 20px calc(14px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line-2); display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
@media (max-width: 759px) {
  .scrim { place-items: end stretch; padding: 0; }
  .modal, .modal.wide { width: 100%; max-height: 92vh; border-radius: 22px 22px 0 0; }
  .modal::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 8px auto 0; }
}
.toasts { position: fixed; z-index: 80; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; pointer-events: none; width: min(420px, calc(100% - 32px)); }
.toast { padding: 10px 16px; border-radius: 14px; background: var(--ink); color: var(--surface); font-size: 14px; font-weight: 600; box-shadow: var(--shadow-pop); animation: rise .2s ease; text-align: center; }

/* ---------- recap card (X Collaborative Notes × Granola × Docs suggesting) ---------- */
.recap { align-self: stretch; margin: 12px 0 4px; border: 1px solid var(--line); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow-card); overflow: hidden; max-width: 640px; }
.recap + .reacts { padding-left: 14px; }
.recap-status { display: flex; align-items: center; gap: 8px; padding: 12px 14px 0 16px; font-size: 13.5px; font-weight: 800; }
.recap-status .dot { width: 10px; height: 10px; border-radius: 99px; background: #98A3AB; flex: none; }
.recap-status .dot.ok { background: var(--green); }
.recap-status .dot.warn { background: #E9A23B; }
.recap-status .sub { color: var(--ink-3); font-weight: 600; }
.recap-status .grow { flex: 1; }
.recap-label { margin: 8px 14px 0; padding: 7px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 12.5px; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; }
.recap-label button { color: inherit; text-decoration: underline; text-underline-offset: 2px; font-weight: 700; }
.recap-title { padding: 10px 16px 2px; }
.recap-title h4 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.015em; }
.recap-title p { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-2); }
.bullets { list-style: none; margin: 6px 0 0; padding: 0 8px 4px; display: grid; gap: 2px; }
.bl { position: relative; display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 4px 8px; padding: 8px 8px; border-radius: 12px; }
.bl:hover { background: var(--surface-2); }
.bl .mk { width: 6px; height: 6px; border-radius: 99px; background: var(--ai-ink); margin: 8px 0 0 6px; }
.bl.checked .mk { background: var(--ink); }
.bl.fixed .mk { background: var(--green); }
.bl.open .mk { background: #E9A23B; box-shadow: 0 0 0 3px rgba(233,162,59,.2); }
.bl .t { color: var(--ai-ink); font-size: 14.5px; line-height: 1.45; }
.bl.checked .t, .bl.fixed .t { color: var(--ink); }
.bl .row2 { grid-column: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 12px; color: var(--ink-3); }
.chip-ref { height: 20px; padding: 0 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; }
.bl .act { display: inline-flex; gap: 4px; margin-left: auto; }
.bl .act button { height: 26px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; gap: 4px; }
.bl .act button.on { background: var(--green-soft); border-color: transparent; color: var(--green); }
.bl .act button:hover { color: var(--ink); }
.fixed-by { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: var(--green); }
.orig { grid-column: 2; font-size: 12.5px; color: var(--ink-3); text-decoration: line-through; text-decoration-color: rgba(226,38,71,.6); }
.sugg { grid-column: 2; margin-top: 4px; padding: 10px 12px; border-radius: 12px; background: var(--amber-soft); border: 1px solid rgba(233,162,59,.35); display: grid; gap: 6px; }
.sugg .strike { font-size: 13px; color: var(--ink-2); text-decoration: line-through; text-decoration-color: #E22647; background: rgba(226,38,71,.07); border-radius: 4px; padding: 0 2px; }
.sugg .new { font-size: 14px; color: var(--ink); text-decoration: underline; text-decoration-color: #E9A23B; text-decoration-thickness: 2px; text-underline-offset: 3px; line-height: 1.45; }
.sugg .by { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.sugg .by b { color: var(--ink); }
.sugg .q { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; }
.sugg .q .grow { flex: 1; }
.yn { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 700; }
.yn.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.recap-panel { margin: 6px 12px 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); display: grid; gap: 8px; }
.recap-panel .h { font-weight: 800; font-size: 14px; }
.recap-foot { padding: 0 16px 14px; font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }

/* ---------- pset view (Telegram topics + Ed megathread) ---------- */
.ptabs { display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line-2); background: var(--surface); }
.ptabs::-webkit-scrollbar { display: none; }
.ptab { height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--ink-2); }
.ptab.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.ptab .n { font-size: 11px; font-weight: 800; padding: 0 6px; height: 18px; border-radius: 999px; background: var(--red); color: #fff; display: inline-grid; place-items: center; }
.ptab.on .n { background: var(--accent); }
.pset-hero { margin: 12px 16px 0; padding: 14px 16px; border-radius: var(--r-card); background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.pset-hero .grow { flex: 1; min-width: 180px; }
.pset-hero h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.015em; }
.pset-hero p { margin: 2px 0 0; font-size: 13px; color: var(--ink-2); }
.pset-hero .cd { text-align: right; }
.pset-hero .cd small { display: block; font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--amber); }
.pset-hero .cd b { font-size: 26px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }

/* ---------- recaps list ---------- */
.recaps-wrap { padding: 4px 16px 24px; max-width: 760px; margin: 0 auto; width: 100%; display: grid; gap: 6px; }

/* ---------- hub panel ---------- */
.hub { padding: 16px; display: grid; gap: 14px; align-content: start; }
.hub-h { display: flex; align-items: center; gap: 10px; }
.hub-h h3 { margin: 0; font-size: 15px; font-weight: 800; flex: 1; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.card-pad { padding: 14px; }
.course-card { overflow: hidden; }
.course-cover { position: relative; height: 92px; padding: 14px; display: flex; align-items: flex-end; gap: 10px; color: #fff; }
.course-cover .code { font-size: 28px; font-weight: 800; letter-spacing: -.035em; line-height: 1; text-shadow: 0 1px 12px rgba(0,0,0,.18); }
.course-cover .emo { position: absolute; right: 12px; top: 10px; font-size: 40px; transform: rotate(8deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
.course-info { padding: 12px 14px 14px; display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
.course-info .ttl { font-size: 14px; font-weight: 700; color: var(--ink); }
.due-card { padding: 12px 14px; display: grid; gap: 10px; }
.due-card + .due-card { border-top: 1px solid var(--line-2); }
.due-card .top { display: flex; align-items: center; gap: 10px; }
.due-card .ttl { font-weight: 800; font-size: 14.5px; }
.due-card .when { font-size: 13px; color: var(--ink-2); }
.due-card .left { margin-left: auto; text-align: right; }
.due-card .left b { white-space: nowrap; display: block; font-size: 15px; font-weight: 800; color: var(--amber); font-variant-numeric: tabular-nums; }
.due-card .left small { font-size: 10px; font-weight: 800; letter-spacing: .08em; color: var(--amber); }
.due-card .acts { display: flex; gap: 8px; }
.due-card .acts .btn { flex: 1; }
.rules { margin: 0; padding: 0 14px 12px 32px; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }
.link-row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; font-size: 14px; font-weight: 600; color: var(--ink); text-decoration: none; }
.link-row + .link-row { border-top: 1px solid var(--line-2); }
.link-row .ic { color: var(--ink-3); }
.link-row span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person { display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
.person .who { min-width: 0; flex: 1; }
.person .n { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .s { font-size: 12px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .you { font-size: 11px; font-weight: 700; color: var(--ink-3); }
.people-search { margin: 0 14px 6px; }
.org-cta { display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left; width: 100%; }
.org-cta .grow { flex: 1; }
.org-cta b { display: block; font-size: 14px; }
.org-cta small { font-size: 12.5px; color: var(--ink-2); }
.survey { display: grid; gap: 12px; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; }
.choice { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 600; }
.choice.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* ---------- onboarding (Saturn arrival) ---------- */
.ob { height: 100%; overflow-y: auto; background: var(--canvas); }
.ob-hero { position: relative; min-height: 46%; padding: 28px 16px 64px; color: #fff; display: grid; place-items: center; text-align: center; overflow: hidden;
  background: radial-gradient(100% 80% at 50% 0%, var(--band-glow), transparent 60%), linear-gradient(170deg, var(--band-1), var(--band-2)); }
.ob-hero::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1.4px); background-size: 18px 18px; mask-image: radial-gradient(80% 70% at 50% 40%, #000, transparent 75%); pointer-events: none; }
.ob-hero .in { position: relative; z-index: 1; display: grid; gap: 12px; justify-items: center; max-width: 520px; }
.ob-pin { width: 76px; height: 76px; border-radius: 24px; background: #fff; display: grid; place-items: center; font-size: 40px; box-shadow: 0 14px 40px rgba(0,0,0,.25); transform: rotate(-6deg); }
.ob-hero h1 { margin: 6px 0 0; font-size: clamp(30px, 6vw, 44px); line-height: 1.04; font-weight: 800; letter-spacing: -.035em; text-wrap: balance; }
.ob-hero p { margin: 0; font-size: 16px; opacity: .86; text-wrap: balance; }
.ob-card { position: relative; z-index: 2; width: min(560px, calc(100% - 32px)); margin: -44px auto 32px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-card); padding: 20px; display: grid; gap: 16px; }
.ob-card h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.025em; text-wrap: balance; }
.ob-card .lead { margin: -8px 0 0; color: var(--ink-2); font-size: 14.5px; }
.ob-steps { display: flex; gap: 6px; }
.ob-steps i { height: 4px; flex: 1; border-radius: 9px; background: var(--line); }
.ob-steps i.on { background: var(--accent); }
.ob-points { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
.ob-points li { display: flex; gap: 12px; align-items: flex-start; font-size: 14.5px; }
.ob-points .emo { font-size: 22px; width: 28px; text-align: center; flex: none; }
.ob-points b { display: block; }
.ob-points span { color: var(--ink-2); font-size: 13.5px; }
.ob-who { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.ob-who .grow { flex: 1; min-width: 0; }
.ob-who b { display: block; }
.ob-who small { color: var(--ink-2); }
.ob-fine { font-size: 12px; color: var(--ink-3); text-align: center; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; }
.picked .pill { padding-right: 4px; }
.picked .pill button { width: 22px; height: 22px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-3); }
.results { display: grid; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; max-height: 360px; overflow-y: auto; }
.result { display: flex; align-items: center; gap: 12px; padding: 10px 12px; text-align: left; width: 100%; background: var(--surface); }
.result + .result { border-top: 1px solid var(--line-2); }

<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script>
window.ROSTER_FORCE_DEMO = true;
// ---------------------------------------------------------------------------
// LocalDB — an in-page store with the same surface as the artifact `db`
// capability (doc / collection / where / orderBy / limit / get / set /
// update / delete / add / onSnapshot). Demo mode runs on it, so the demo and
// the live class chat share one code path. Nothing here leaves the browser.
// ---------------------------------------------------------------------------
const LocalDB = (() => {
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const freeze = (v) => {
    if (v && typeof v === "object") {
      Object.freeze(v);
      for (const k of Object.keys(v)) freeze(v[k]);
    }
    return v;
  };
  function merge(base, patch) {
    const out = isObj(base) ? { ...base } : {};
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      out[k] = isObj(v) ? merge(isObj(out[k]) ? out[k] : {}, v) : clone(v);
    }
    return out;
  }
  const segs = (p) => p.split("/");
  function cmp(a, b) {
    if (a === b) return 0;
    if (a === undefined) return 1;
    if (b === undefined) return -1;
    return a < b ? -1 : 1;
  }
  function test(v, op, x) {
    switch (op) {
      case "==": return v === x;
      case "!=": return v !== x;
      case "<": return v < x;
      case "<=": return v <= x;
      case ">": return v > x;
      case ">=": return v >= x;
      case "in": return x.includes(v);
      case "not-in": return !x.includes(v);
      case "array-contains": return Array.isArray(v) && v.includes(x);
      default: throw new TypeError("unsupported operator " + op);
    }
  }
  let idSeq = 0;
  const newId = () =>
    Date.now().toString(36) + (idSeq++).toString(36).padStart(3, "0") + Math.random().toString(36).slice(2, 7);

  function create({ persistKey } = {}) {
    const docs = new Map(); // path -> frozen body
    const snaps = new Map(); // path -> cached snapshot for the current body
    const listeners = new Set();
    let flushQueued = false;

    if (persistKey) {
      try {
        const raw = localStorage.getItem(persistKey);
        if (raw) for (const [p, d] of JSON.parse(raw)) docs.set(p, freeze(d));
      } catch (_) { /* storage unavailable: start fresh */ }
    }
    let saveTimer = null;
    function persist() {
      if (!persistKey) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(persistKey, JSON.stringify([...docs])); } catch (_) { /* ignore */ }
      }, 250);
    }

    function snapOf(path) {
      const body = docs.get(path);
      const cached = snaps.get(path);
      if (cached && cached.__body === body) return cached;
      const id = segs(path).pop();
      const s = {
        id,
        exists: body !== undefined,
        data: () => body,
        metadata: { fromCache: false, hasPendingWrites: false },
      };
      Object.defineProperty(s, "__body", { value: body });
      snaps.set(path, s);
      return s;
    }

    function rowsFor(q) {
      const prefix = q.path + "/";
      const depth = segs(q.path).length + 1;
      let rows = [];
      for (const [p, d] of docs) {
        if (p.startsWith(prefix) && segs(p).length === depth) rows.push({ p, d });
      }
      rows = rows.filter(({ d }) => q.filters.every((f) => test(d[f.field], f.op, f.value)));
      if (q.order) {
        const dir = q.order.dir === "desc" ? -1 : 1;
        rows.sort((a, b) => {
          const av = a.d[q.order.field], bv = b.d[q.order.field];
          if (av === undefined || bv === undefined) return cmp(av, bv);
          return cmp(av, bv) * dir;
        });
      } else rows.sort((a, b) => cmp(a.p, b.p));
      if (q.lim) rows = rows.slice(0, q.lim);
      return rows.map((r) => snapOf(r.p));
    }

    function querySnap(list, prev) {
      const changes = [];
      const prevIdx = new Map((prev || []).map((s, i) => [s.id, i]));
      const nextIds = new Set(list.map((s) => s.id));
      list.forEach((s, i) => {
        if (!prevIdx.has(s.id)) changes.push({ type: "added", doc: s, oldIndex: -1, newIndex: i });
        else if (prev[prevIdx.get(s.id)] !== s) changes.push({ type: "modified", doc: s, oldIndex: prevIdx.get(s.id), newIndex: i });
      });
      (prev || []).forEach((s, i) => {
        if (!nextIds.has(s.id)) changes.push({ type: "removed", doc: s, oldIndex: i, newIndex: -1 });
      });
      return {
        docs: list,
        size: list.length,
        empty: list.length === 0,
        docChanges: () => changes,
        metadata: { fromCache: false, hasPendingWrites: false },
      };
    }

    function flush() {
      flushQueued = false;
      for (const l of listeners) {
        if (l.dead) continue;
        try {
          if (l.kind === "doc") {
            const s = snapOf(l.path);
            if (s !== l.last) { l.last = s; l.next(s); }
          } else {
            const list = rowsFor(l.q);
            const same = l.last && l.last.length === list.length && list.every((s, i) => s === l.last[i]);
            if (!same) { const prev = l.last; l.last = list; l.next(querySnap(list, prev)); }
          }
        } catch (e) { console.error(e); }
      }
    }
    function schedule() {
      if (!flushQueued) { flushQueued = true; setTimeout(flush, 0); }
    }
    function write(path, body) {
      if (body === undefined) docs.delete(path);
      else docs.set(path, freeze(clone(body)));
      persist();
      schedule();
    }

    function checkDoc(path) {
      if (segs(path).length % 2 !== 0) throw new TypeError("document path needs an even number of segments: " + path);
    }
    function checkCol(path) {
      if (segs(path).length % 2 !== 1) throw new TypeError("collection path needs an odd number of segments: " + path);
    }

    function docRef(path) {
      checkDoc(path);
      return {
        id: segs(path).pop(),
        path,
        async get() { return snapOf(path); },
        async set(data) { write(path, data); },
        async update(data) {
          if (!docs.has(path)) throw { code: "invalid_argument", message: "update needs an existing document" };
          write(path, merge(docs.get(path), data));
        },
        async delete() { write(path, undefined); },
        async acquire() { return { acquired: true }; },
        onSnapshot(next) {
          const l = { kind: "doc", path, next, last: null };
          listeners.add(l);
          schedule();
          return () => { l.dead = true; listeners.delete(l); };
        },
        collection(sub) { return colRef(path + "/" + sub); },
      };
    }

    function query(path, filters, order, lim) {
      const q = { path, filters, order, lim };
      return {
        where: (field, op, value) => query(path, [...filters, { field, op, value }], order, lim),
        orderBy: (field, dir) => query(path, filters, { field, dir: dir || "asc" }, lim),
        limit: (n) => query(path, filters, order, n),
        async get() { return querySnap(rowsFor(q), null); },
        onSnapshot(next) {
          const l = { kind: "query", q, next, last: null };
          listeners.add(l);
          schedule();
          return () => { l.dead = true; listeners.delete(l); };
        },
      };
    }

    function colRef(path) {
      checkCol(path);
      const base = query(path, [], null, 0);
      return {
        ...base,
        path,
        doc: (id) => docRef(path + "/" + (id || newId())),
        async add(data) { const r = docRef(path + "/" + newId()); await r.set(data); return r; },
      };
    }

    return {
      doc: docRef,
      collection: colRef,
      // Demo-only helpers (not part of the capability surface).
      _seed(entries) { for (const [p, d] of entries) docs.set(p, freeze(clone(d))); schedule(); },
      _isEmpty: () => docs.size === 0,
      _reset() { docs.clear(); snaps.clear(); try { localStorage.removeItem(persistKey); } catch (_) {} schedule(); },
      _dump: () => [...docs],
    };
  }
  return { create, newId };
})();


// ---------------------------------------------------------------------------
// Research metrics — computed straight from the chat log, nothing
// self-reported. Thresholds come from the Assignment 2a plan:
//   contribution in pset cycle 1: success >= 35%, kill < 15%
//   cycle-2 student messages as a share of cycle 1: success >= 50%, kill < 25%
//   corrections per AI recap: success >= 1
//   unprompted shares (links, files, photos): success >= 3 a week
// The organizer is excluded from every numerator and denominator.
// ---------------------------------------------------------------------------
const Metrics = (() => {
  const URL_RE = /\bhttps?:\/\/\S+|\b(?:docs\.google|drive\.google|overleaf|notion\.so|canvas\.harvard|edstem)\S*/i;
  const isShare = (m) => (m.attachments && m.attachments.length > 0) || URL_RE.test(m.text || "");
  const verdict = (v, ok, kill) => (v == null ? "pending" : v >= ok ? "success" : v < kill ? "kill" : "revise");

  function compute({ courseId, members, messages, fixes, recaps, cycles, organizerIds, now, checks }) {
    const org = new Set(organizerIds || []);
    const t = now || Date.now();
    const students = members.filter((m) => !org.has(m.id) && m.courses && m.courses[courseId]);

    // Every contribution event: who, when, what.
    const events = [];
    for (const m of messages) {
      if (!m.by || org.has(m.by) || m.kind === "system" || m.kind === "recap" || m.deleted) continue;
      events.push({ by: m.by, ts: m.ts, type: m.replyTo ? "reply" : "post", msg: m });
    }
    for (const m of messages) {
      for (const [emoji, who] of Object.entries(m.reactions || {})) {
        for (const [uid, ts] of Object.entries(who || {})) {
          if (ts && !org.has(uid)) events.push({ by: uid, ts, type: "react", emoji });
        }
      }
      for (const [uid, opt] of Object.entries((m.poll && m.poll.votes) || {})) {
        if (opt && !org.has(uid)) events.push({ by: uid, ts: opt.ts || m.ts, type: "vote" });
      }
    }
    for (const f of fixes) {
      if (!org.has(f.by)) events.push({ by: f.by, ts: f.ts, type: "fix" });
      for (const [uid, ts] of Object.entries(f.votes || {})) if (ts && !org.has(uid)) events.push({ by: uid, ts, type: "agree" });
      for (const [uid, ts] of Object.entries(f.nays || {})) if (ts && !org.has(uid)) events.push({ by: uid, ts, type: "agree" });
    }
    // A "looks right" on a recap line is the same act as a 👍 on a summary in GroupMe.
    for (const c of checks || []) if (!org.has(c.by)) events.push({ by: c.by, ts: c.ts, type: "react" });

    const cyc = (cycles || []).map((c) => {
      const placed = students.filter((s) => (s.courses[courseId] || Infinity) < c.end);
      const placedIds = new Set(placed.map((s) => s.id));
      const inWin = events.filter((e) => e.ts >= c.start && e.ts < c.end && placedIds.has(e.by));
      const contributors = new Set(inWin.map((e) => e.by));
      const posts = inWin.filter((e) => e.type === "post" || e.type === "reply");
      const perPoster = new Map();
      for (const e of posts) perPoster.set(e.by, (perPoster.get(e.by) || 0) + 1);
      const ranked = [...perPoster.values()].sort((a, b) => b - a);
      const top3 = ranked.slice(0, 3).reduce((a, b) => a + b, 0);
      const readers = new Set();
      for (const s of placed) {
        const v = (s.visits && s.visits[courseId]) || {};
        if (Object.values(v).some((ts) => ts >= c.start && ts < c.end)) readers.add(s.id);
      }
      const lurkers = [...readers].filter((id) => !contributors.has(id)).length;
      const opened = new Set([...readers, ...contributors]).size;
      const byType = { post: 0, reply: 0, react: 0, fix: 0, agree: 0, vote: 0 };
      for (const e of inWin) byType[e.type]++;
      const started = t >= c.start;
      const finished = t >= c.end;
      const rate = placed.length ? contributors.size / placed.length : null;
      return {
        ...c,
        started,
        finished,
        placed: placed.length,
        contributors: contributors.size,
        rate: started ? rate : null,
        studentMsgs: posts.length,
        posters: perPoster.size,
        top3Share: posts.length ? top3 / posts.length : null,
        readers: readers.size,
        opened,
        lurkers,
        byType,
        shares: posts.filter((e) => isShare(e.msg)).length,
      };
    });

    const c1 = cyc[0], c2 = cyc[1];
    const retention = c1 && c2 && c2.started && c1.studentMsgs ? c2.studentMsgs / c1.studentMsgs : null;

    const recapRows = (recaps || []).map((r) => ({
      id: r.id,
      title: r.title,
      lecture: r.lecture,
      ts: r.ts,
      fixes: fixes.filter((f) => f.recapId === r.id && !org.has(f.by)).length,
      agrees: fixes
        .filter((f) => f.recapId === r.id)
        .reduce((n, f) => n + Object.values(f.votes || {}).filter(Boolean).length, 0),
    }));

    const allShares = messages.filter((m) => m.by && !org.has(m.by) && !m.deleted && m.kind !== "system" && isShare(m));
    const firstStart = cyc.length ? cyc[0].start : null;
    const weeks = firstStart ? Math.max(1, (Math.min(t, cyc[cyc.length - 1].end) - firstStart) / (7 * 864e5)) : 1;

    return {
      placed: students.length,
      cycles: cyc,
      retention,
      recaps: recapRows,
      sharesPerWeek: allShares.length / weeks,
      verdicts: {
        contribution: verdict(c1 && c1.started ? c1.rate : null, 0.35, 0.15),
        retention: verdict(retention, 0.5, 0.25),
        corrections: recapRows.length ? (recapRows.every((r) => r.fixes >= 1) ? "success" : recapRows.some((r) => r.fixes >= 1) ? "revise" : "kill") : "pending",
        shares: allShares.length ? (allShares.length / weeks >= 3 ? "success" : "revise") : "pending",
      },
      cycleFinal: { c1: c1 && c1.finished, c2: c2 && c2.finished },
    };
  }

  // A pseudonymous log for the write-up: no names, no message text.
  function csv({ courseId, members, messages, fixes, cycles, organizerIds }) {
    const org = new Set(organizerIds || []);
    const alias = new Map();
    const nameOf = (uid) => {
      if (org.has(uid)) return "ORGANIZER";
      if (!alias.has(uid)) alias.set(uid, "S" + String(alias.size + 1).padStart(3, "0"));
      return alias.get(uid);
    };
    members.filter((m) => m.courses && m.courses[courseId]).forEach((m) => nameOf(m.id));
    const cycleOf = (ts) => {
      const c = (cycles || []).find((c) => ts >= c.start && ts < c.end);
      return c ? c.label : "";
    };
    const rows = [["timestamp_iso", "cycle", "member", "event", "thread", "chars", "has_link_or_file", "reply_to"]];
    const push = (ts, who, ev, thread, chars, share, reply) =>
      rows.push([new Date(ts).toISOString(), cycleOf(ts), nameOf(who), ev, thread || "", chars, share ? 1 : 0, reply || ""]);
    for (const m of messages) {
      if (m.deleted || !m.by) continue;
      push(m.ts, m.by, m.kind === "recap" ? "recap" : m.replyTo ? "reply" : "post", m.thread, (m.text || "").length, isShare(m), m.replyTo ? m.replyTo.id : "");
      for (const [emoji, who] of Object.entries(m.reactions || {}))
        for (const [uid, ts] of Object.entries(who || {})) if (ts) push(ts, uid, "react " + emoji, m.thread, 0, false, m.id);
    }
    for (const f of fixes) {
      push(f.ts, f.by, "correction", "recap", (f.text || "").length, false, f.recapId);
      for (const [uid, ts] of Object.entries(f.votes || {})) if (ts) push(ts, uid, "agree", "recap", 0, false, f.id);
    }
    const header = rows.shift();
    rows.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
    rows.unshift(header);
    return rows.map((r) => r.map((v) => (/[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v)).join(",")).join("\n");
  }

  return { compute, csv, isShare };
})();


// ---------------------------------------------------------------------------
// Runtime — decides between the live class chat (shared `db`, real classmates)
// and the demo class (LocalDB with marked example classmates), and wraps
// identity, presence, Claude and downloads behind one small object.
// ---------------------------------------------------------------------------
const Runtime = (() => {
  const hasClaude = () => typeof window.claude === "object" && window.claude && typeof window.claude.use === "function";
  const use = (name) => (hasClaude() ? window.claude.use(name).catch(() => null) : Promise.resolve(null));

  async function boot() {
    const forceDemo = !!window.ROSTER_FORCE_DEMO;
    const [db, user, sample, room, downloads] = await Promise.all([
      forceDemo ? null : use("db"), use("user"), use("sample"), forceDemo ? null : use("room"), use("downloads"),
    ]);
    let me = null, canWrite = null, isOwner = false;
    if (user) {
      try {
        me = await user.me();
        isOwner = !!me.isOwner;
        canWrite = await user.can("data.write");
      } catch (_) { me = null; }
    }
    const live = !!(db && me && me.id);
    return {
      forceDemo,
      live,
      db,
      user,
      me,
      uid: me && me.id,
      isOwner,
      // null = the platform said nothing; keep inputs and let a refused write decide.
      canWrite: canWrite === null ? (live ? true : false) : canWrite,
      sample,
      room,
      downloads,
      signedIn: !!(me && me.id),
    };
  }

  // Profiles resolver: live uses the platform; demo uses the example roster.
  function profileResolver(rt, demoPeople) {
    if (rt && rt.live && rt.user) {
      return async (ids) => {
        try { return await rt.user.profiles(ids); } catch (_) { return {}; }
      };
    }
    return async (ids) => {
      const out = {};
      for (const id of ids) {
        const p = demoPeople[id];
        out[id] = p
          ? { id, name: p.name, avatarUrl: "", color: p.color, isMe: false, guest: false }
          : { id, name: "", avatarUrl: "", color: "#8a8f98", isMe: false, guest: false };
      }
      return out;
    };
  }

  return { boot, profileResolver, hasClaude };
})();
