  const isCourse = (id) => !/^(house|year)-/.test(id);
  return { courses, byId, get, search, idFromCode, normalizeCode, houses, houseShort, years, termDates, SLOTS, slot, PROMPTS, CONCENTRATIONS, houseId, yearId, space, isCourse, BOARD_CATS, STATUSES };
})();


// ---------------------------------------------------------------------------
// Schedules and time, all in Cambridge time (America/New_York).
// Meeting strings look like my.harvard's: "Tu Th 1:30–2:45 PM", "MWF 10:30-11:45 AM".
// A meeting is {d: [weekday...], s: minutes, e: minutes, where, kind}.
// ---------------------------------------------------------------------------
const Sched = (() => {
  const TZ = "America/New_York";
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" });
  const WD = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  function et(ts) {
    const p = {};
    for (const { type, value } of parts.formatToParts(ts)) p[type] = value;
    return { y: +p.year, mo: +p.month, d: +p.day, h: +p.hour, mi: +p.minute, wd: WD[p.weekday], key: p.year + "-" + p.month + "-" + p.day };
  }
  // Epoch for a Cambridge wall-clock time.
  function at(y, mo, d, minutes) {
    const guess = Date.UTC(y, mo - 1, d, Math.floor(minutes / 60), minutes % 60);
    const p = et(guess);
    const asUTC = Date.UTC(p.y, p.mo - 1, p.d, p.h, p.mi);
    return guess - (asUTC - guess);
  }
  const startOfDay = (ts) => { const p = et(ts); return at(p.y, p.mo, p.d, 0); };
  const addDays = (ts, n) => { const p = et(ts + 12 * 3600e3); const b = Date.UTC(p.y, p.mo - 1, p.d) + n * 864e5; const q = new Date(b); return at(q.getUTCFullYear(), q.getUTCMonth() + 1, q.getUTCDate(), 0); };
  const startOfWeek = (ts) => { const p = et(ts); return addDays(startOfDay(ts), -((p.wd + 6) % 7)); }; // Monday

  const DAY_TOKENS = [["Su", 0], ["Th", 4], ["Tu", 2], ["Sa", 6], ["M", 1], ["T", 2], ["W", 3], ["R", 4], ["F", 5]];
  function parseDays(s) {
    const out = new Set();
    let rest = s.replace(/\s+/g, "").replace(/Mon/gi, "M").replace(/Tue/gi, "Tu").replace(/Wed/gi, "W").replace(/Thu/gi, "Th").replace(/Fri/gi, "F").replace(/Sat/gi, "Sa").replace(/Sun/gi, "Su");
    while (rest.length) {
      const hit = DAY_TOKENS.find(([t]) => rest.startsWith(t));
      if (!hit) return null;
      out.add(hit[1]);
      rest = rest.slice(hit[0].length);
    }
    return [...out].sort();
  }
  const toMin = (h, m, ap) => { let hh = +h % 12; if (/p/i.test(ap)) hh += 12; return hh * 60 + (+m || 0); };
  function parseMeets(str, where) {
    if (!str) return [];
    const m = String(str).match(/^\s*([A-Za-z ]+?)\s+(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*[–-]\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
    if (!m) return [];
    const d = parseDays(m[1]);
    if (!d || !d.length) return [];
    const endAp = m[7];
    let s = toMin(m[2], m[3], m[4] || endAp), e = toMin(m[5], m[6], endAp);
    if (!m[4] && s > e) s -= 12 * 60; // "10:30–11:45 AM"/"11:30–1:00 PM"
    return [{ d, s, e, where: where || "", kind: "lecture" }];
  }
  const DAY_SHORT = ["Su", "M", "Tu", "W", "Th", "F", "Sa"];
  const DAY_NAME = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const fmtMin = (mins) => { const h = Math.floor(mins / 60), m = mins % 60; return ((h + 11) % 12 + 1) + (m ? ":" + String(m).padStart(2, "0") : "") + (h < 12 ? " AM" : " PM"); };
  const fmtMeeting = (mt) => mt.d.map((x) => DAY_SHORT[x]).join(" ") + " " + fmtMin(mt.s).replace(/ (AM|PM)$/, "") + "–" + fmtMin(mt.e);

  // Every occurrence of a set of meetings between two instants.
  function occurrences(meetings, from, to) {
    const out = [];
    for (let day = startOfDay(from); day < to; day = addDays(day, 1)) {
      const p = et(day + 12 * 3600e3);
      for (const mt of meetings) {
        if (!mt.d.includes(p.wd)) continue;
        const start = at(p.y, p.mo, p.d, mt.s), end = at(p.y, p.mo, p.d, mt.e);
        if (end > from && start < to) out.push({ ...mt, start, end });
      }
    }
    return out.sort((a, b) => a.start - b.start);
  }

  // Calm → soon → today → urgent → due, per Flighty-style "smart states".
  function urgency(msLeft) {
    if (msLeft <= 0) return "past";
    if (msLeft < 3 * 3600e3) return "urgent";
    if (msLeft < 24 * 3600e3) return "today";
    if (msLeft < 3 * 864e5) return "soon";
    return "calm";
  }

  return { et, at, startOfDay, addDays, startOfWeek, parseMeets, parseDays, occurrences, urgency, fmtMin, fmtMeeting, DAY_NAME, DAY_SHORT };
})();


// ---------------------------------------------------------------------------
// Photos and math.
// Photos ride inside message documents (a db document holds up to 256 KiB),
// so they're downscaled and re-encoded on the sender's device first.
// Demo "photos of the board" are drawn on a canvas at runtime and referenced
// as "gen:<key>" so the demo store stays small.
// Math between $…$ renders as native MathML through KaTeX (no fonts or CSS).
// ---------------------------------------------------------------------------
const Media = (() => {
  const MAX_BYTES = 170 * 1024;
  function loadImage(src) {
    return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  }
  async function compress(file, opts) {
    const url = URL.createObjectURL(file);
    try {
      const img = await loadImage(url);
      let side = (opts && opts.max) || 1280, q = 0.78, out = null, w = 0, h = 0;
      for (let pass = 0; pass < 7; pass++) {
        const k = Math.min(1, side / Math.max(img.naturalWidth, img.naturalHeight));
        w = Math.max(1, Math.round(img.naturalWidth * k)); h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
        out = c.toDataURL("image/jpeg", q);
        if (out.length * 0.75 <= MAX_BYTES) break;
        if (q > 0.55) q -= 0.1; else side = Math.round(side * 0.8);
      }
      return { src: out, w, h };
    } finally { URL.revokeObjectURL(url); }
  }

  // ---- demo chalkboard photos ----
  const BOARDS = {
    chicks: { lines: ["100 chicks in a circle", "each pecks L or R  (p = 1/2)", "I_j = 1 if chick j unpecked", "P(I_j = 1) = 1/2 · 1/2 = 1/4", "E[# unpecked] = 100 · 1/4 = 25"], tilt: -1.4 },
    geom: { lines: ["Geom(p): # failures before 1st success", "P(X = k) = q^k p ,  k = 0,1,2,…", "E[X] = q/p", "FS(p) = Geom(p) + 1  →  E = 1/p"], tilt: 1.1 },
    lotus: { lines: ["LOTUS", "E[g(X)] = Σ g(x) P(X = x)", "Var(X) = E[X²] − (EX)²", "Bin(n,p):  Var = npq"], tilt: -0.6 },
    folding: { lines: ["Protein folding", "ΔG = ΔH − TΔS", "hydrophobic effect → entropy of water", "α-helix: i → i+4 H-bonds"], tilt: 0.8, green: false },
  };
  const cache = {};
  function board(key) {
    if (cache[key]) return cache[key];
    const spec = BOARDS[key];
    if (!spec || typeof document === "undefined") return null;
    const W = 960, H = 720, c = document.createElement("canvas"); c.width = W; c.height = H;
    const g = c.getContext("2d");
    let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    // room + board
    g.fillStyle = "#2c2a27"; g.fillRect(0, 0, W, H);
    g.save(); g.translate(W / 2, H / 2); g.rotate((spec.tilt * Math.PI) / 180); g.translate(-W / 2, -H / 2);
    const grad = g.createLinearGradient(0, 0, W, H);
    if (spec.green === false) { grad.addColorStop(0, "#f4f4f1"); grad.addColorStop(1, "#dfe0dc"); } else { grad.addColorStop(0, "#2f4a3c"); grad.addColorStop(1, "#22362c"); }
    g.fillStyle = grad; g.fillRect(40, 50, W - 80, H - 110);
    // eraser haze
    for (let i = 0; i < 26; i++) {
      g.fillStyle = spec.green === false ? "rgba(120,130,140,.05)" : "rgba(255,255,255,.035)";
      g.beginPath(); g.ellipse(80 + rnd() * (W - 160), 90 + rnd() * (H - 200), 60 + rnd() * 140, 18 + rnd() * 30, rnd(), 0, 7); g.fill();
    }
    g.fillStyle = "#8a6a43"; g.fillRect(40, H - 64, W - 80, 14);
    // chalk / marker text
    g.textBaseline = "top";
    spec.lines.forEach((ln, i) => {
      const y = 100 + i * 108, size = i === 0 ? 50 : 40;
      g.font = (i === 0 ? "600 " : "500 ") + size + "px 'Bradley Hand', 'Segoe Print', 'Comic Sans MS', cursive";
      for (let pass = 0; pass < 3; pass++) {
        g.fillStyle = spec.green === false ? "rgba(23,56,140," + (0.55 + pass * 0.15) + ")" : "rgba(245,245,235," + (0.35 + pass * 0.2) + ")";
        g.fillText(ln, 90 + rnd() * 3 + (i ? 26 : 0), y + rnd() * 3);
      }
    });
    g.restore();
    // phone-photo vignette
    const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.85);
    v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.45)");
    g.fillStyle = v; g.fillRect(0, 0, W, H);
    return (cache[key] = c.toDataURL("image/jpeg", 0.8));
  }
  const resolve = (src) => (typeof src === "string" && src.startsWith("gen:") ? board(src.slice(4)) : src);

  // ---- math ----
  const MATH = /\$([^$\n]{1,200})\$/g;
  function mathHtml(tex) {
    if (!window.katex) return null;
    try { return window.katex.renderToString(tex, { output: "mathml", throwOnError: false, strict: "ignore" }); } catch (_) { return null; }
  }
  return { compress, board, resolve, MATH, mathHtml };
})();


// ---------------------------------------------------------------------------
// Derived views over the class feeds — computed on the device, no AI:
// the Activity inbox, the "While you were away" digest, the weekly class
// story, and search. feeds: {courseId: [message…] ascending by ts}.
// ---------------------------------------------------------------------------
const Derive = (() => {
  const countReacts = (m) => Object.values(m.reactions || {}).reduce((n, who) => n + Object.values(who || {}).filter(Boolean).length, 0);
  const isChat = (m) => !m.deleted && !m.hidden && (m.kind === "text" || m.kind === "photo" || m.kind === "poll" || m.kind === "event");

  function inbox({ uid, feeds, fixes, recapsDone }) {
    const items = [];
    for (const [cid, feed] of Object.entries(feeds)) {
      const byId = {};
      for (const m of feed) byId[m.id] = m;
      for (const m of feed) {
        if (m.deleted || m.hidden) continue;
        if (m.by !== uid && (m.mentions || []).includes(uid)) items.push({ id: "men:" + cid + m.id, kind: "mention", cid, mid: m.id, ts: m.ts, actors: [m.by], text: m.text });
        if (m.by !== uid && m.replyTo && byId[m.replyTo] && byId[m.replyTo].by === uid) items.push({ id: "rep:" + cid + m.id, kind: "reply", cid, mid: m.id, ts: m.ts, actors: [m.by], text: m.text, quote: byId[m.replyTo].text });
        if (m.kind === "recap") items.push({ id: "rc:" + cid + m.id, kind: "recap", cid, mid: m.id, ts: m.ts, actors: [m.by], text: m.text, recapId: m.recapId, done: !!(recapsDone && recapsDone[m.recapId]) });
        if (m.kind === "announce") items.push({ id: "an:" + cid + m.id, kind: "announce", cid, mid: m.id, ts: m.ts, actors: [m.by], text: m.text });
        if (m.by === uid) {
          const reacts = [];
          for (const [e, who] of Object.entries(m.reactions || {})) for (const [id, t] of Object.entries(who || {})) if (t && id !== uid) reacts.push({ e, id, t });
          if (reacts.length) {
            reacts.sort((a, b) => b.t - a.t);
            items.push({ id: "rx:" + cid + m.id, kind: "reactions", cid, mid: m.id, ts: reacts[0].t, actors: [...new Set(reacts.map((r) => r.id))], emoji: [...new Set(reacts.map((r) => r.e))].slice(0, 3), text: m.text || (m.poll && m.poll.question) || (m.event && m.event.title) || "your photo" });
          }
          if (m.kind === "event" && m.event) {
            const going = Object.entries(m.event.rsvps || {}).filter(([id, v]) => id !== uid && v && v.s === "going").sort((a, b) => b[1].t - a[1].t);
            if (going.length) items.push({ id: "ev:" + cid + m.id, kind: "rsvp", cid, mid: m.id, ts: going[0][1].t, actors: going.map(([id]) => id), text: m.event.title });
          }
          if (m.kind === "poll" && m.poll) {
            const votes = Object.entries(m.poll.votes || {}).filter(([id, v]) => id !== uid && v && v.o).sort((a, b) => b[1].t - a[1].t);
            if (votes.length) items.push({ id: "pv:" + cid + m.id, kind: "votes", cid, mid: m.id, ts: votes[0][1].t, actors: votes.map(([id]) => id), text: m.poll.question });
          }
        }
      }
    }
    for (const f of fixes || []) if (f.by === uid && f.appliedAt) items.push({ id: "fx:" + f.cid + f.id, kind: "fix", cid: f.cid, ts: f.appliedAt, actors: [], text: f.text, recapId: f.recapId });
    return items.sort((a, b) => b.ts - a.ts);
  }

  function digest(feed, since, uid) {
    const fresh = feed.filter((m) => m.ts > since && m.by !== uid && (isChat(m) || m.kind === "recap"));
    const chat = fresh.filter(isChat);
    const authors = [...new Set(chat.map((m) => m.by))];
    const answered = new Set(feed.filter((m) => m.replyTo).map((m) => m.replyTo));
    return {
      count: chat.length,
      authors,
      top: [...chat].filter((m) => countReacts(m) >= 2).sort((a, b) => countReacts(b) - countReacts(a) || b.ts - a.ts).slice(0, 3),
      questions: chat.filter((m) => m.kind === "text" && /\?\s*$/.test(m.text || "") && !answered.has(m.id) && !m.resolved).slice(-3),
      shares: chat.filter((m) => m.kind === "photo" || /https?:\/\//.test(m.text || "") || (m.attachments && m.attachments.length)).slice(-4),
      recaps: fresh.filter((m) => m.kind === "recap"),
      events: chat.filter((m) => m.kind === "event"),
    };
  }

  function week({ feed, from, to, uid, fixes, checks, notes }) {
    const inWeek = feed.filter((m) => m.ts >= from && m.ts < to && isChat(m));
    const people = new Set(inWeek.map((m) => m.by));
    const byDay = {};
    for (const m of inWeek) { const k = Sched.et(m.ts).wd; byDay[k] = (byDay[k] || 0) + 1; }
    const busiest = Object.entries(byDay).sort((a, b) => b[1] - a[1])[0];
    const emoji = {};
    let myReacts = 0;
    for (const m of feed) for (const [e, who] of Object.entries(m.reactions || {})) for (const [id, t] of Object.entries(who || {})) {
      if (!t || t < from || t >= to) continue;
      emoji[e] = (emoji[e] || 0) + 1;
      if (id === uid) myReacts++;
    }
    const problems = {};
    for (const m of inWeek) for (const t of m.tags || []) problems[t] = (problems[t] || 0) + 1;
    const topProblem = Object.entries(problems).sort((a, b) => b[1] - a[1])[0];
    const top = [...inWeek].sort((a, b) => countReacts(b) - countReacts(a))[0];
    const mine = inWeek.filter((m) => m.by === uid);
    const helped = new Set(inWeek.filter((m) => m.by === uid && m.replyTo).map((m) => { const q = feed.find((x) => x.id === m.replyTo); return q && q.by; }).filter((x) => x && x !== uid));
    return {
      messages: inWeek.length,
      people: people.size,
      busiest: busiest ? { day: +busiest[0], n: busiest[1] } : null,
      topEmoji: Object.entries(emoji).sort((a, b) => b[1] - a[1]).slice(0, 3),
      reactions: Object.values(emoji).reduce((a, b) => a + b, 0),
      topProblem: topProblem ? { p: topProblem[0], n: topProblem[1] } : null,
      top: top && countReacts(top) ? { m: top, n: countReacts(top) } : null,
      mine: mine.length,
      myReacts,
      helped: helped.size,
      fixes: (fixes || []).filter((f) => f.ts >= from && f.ts < to).length,
      checks: (checks || []).filter((c) => c.ts >= from && c.ts < to).length,
      notes: (notes || []).filter((n) => n.ts >= from && n.ts < to).length,
      photos: inWeek.filter((m) => m.kind === "photo").length,
      sessions: inWeek.filter((m) => m.kind === "event").length,
    };
  }

  function search(q, { feeds, members, courses, nameOf }) {
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return { messages: [], people: [], classes: [] };
    const hit = (s) => { const t = (s || "").toLowerCase(); return terms.every((w) => t.includes(w)); };
    const messages = [];
    for (const [cid, feed] of Object.entries(feeds)) for (const m of feed) {
      if (m.deleted || m.hidden) continue;
      const body = [m.text, m.poll && m.poll.question, m.event && m.event.title, m.event && m.event.where, (m.tags || []).join(" ")].filter(Boolean).join(" ");
      if (hit(body) || hit(nameOf(m.by) + " " + body)) messages.push({ cid, m });
    }
    messages.sort((a, b) => b.m.ts - a.m.ts);
    return {
      messages: messages.slice(0, 40),
      people: members.filter((p) => hit([p.displayName, p.house, p.year, p.concentration].join(" "))).slice(0, 12),
      classes: courses.filter((c) => hit(c.code + " " + c.title + " " + (c.who || ""))).slice(0, 8),
    };
  }

  // ---- schedules of people (Saturn's "who's free", "compare") ----
  function meetingsOf(member, getCourse) {
    const out = [];
    if (!member) return out;
    for (const cid of Object.keys(member.courses || {})) {
      if (!Catalog.isCourse(cid)) continue;
      const c = getCourse(cid);
      const custom = member.schedule && member.schedule[cid];
      for (const mt of custom && custom.length ? custom : Sched.parseMeets(c.meets, c.where)) out.push({ ...mt, cid, kind: mt.kind || "lecture" });
      const sl = member.sections && member.sections[cid] && Catalog.slot(member.sections[cid]);
      if (sl) out.push({ d: sl.d, s: sl.s, e: sl.e, where: "", kind: "section", cid, label: sl.label });
    }
    return out;
  }
  function busyAt(meetings, ts) {
    return Sched.occurrences(meetings, ts - 6 * 3600e3, ts + 60e3).find((o) => o.start <= ts && o.end > ts) || null;
  }
  function nextOf(meetings, ts, days) {
    return Sched.occurrences(meetings, ts, ts + (days || 7) * 864e5).find((o) => o.start > ts) || null;
  }
  // Shared free blocks between two people on one day, 8 AM to 10 PM.
  function freeTogether(a, b, dayTs) {
    const from = Sched.startOfDay(dayTs) + 8 * 3600e3, to = Sched.startOfDay(dayTs) + 22 * 3600e3;
    const busy = [...Sched.occurrences(a, from, to), ...Sched.occurrences(b, from, to)].map((o) => [Math.max(o.start, from), Math.min(o.end, to)]).sort((x, y) => x[0] - y[0]);
    const free = [];
    let cur = from;
    for (const [s, e] of busy) { if (s - cur >= 45 * 60e3) free.push([cur, s]); cur = Math.max(cur, e); }
    if (to - cur >= 45 * 60e3) free.push([cur, to]);
    return free;
  }
  function suggestions(me, members, uid) {
    if (!me) return [];
    const mine = Object.keys(me.courses || {}).filter((c) => Catalog.isCourse(c));
    return members
      .filter((m) => m.id !== uid && !(me.following && me.following[m.id]))
      .map((m) => ({ m, shared: mine.filter((c) => m.courses && m.courses[c]), house: m.house && m.house === me.house, addedYou: !!(m.following && m.following[uid]) }))
      .filter((x) => x.shared.length || x.house || x.addedYou)
      .sort((x, y) => y.addedYou - x.addedYou || y.shared.length + (y.house ? 1.5 : 0) - (x.shared.length + (x.house ? 1.5 : 0)) || (x.m.displayName || "").localeCompare(y.m.displayName || ""));
  }

  return { inbox, digest, week, search, countReacts, isChat, meetingsOf, busyAt, nextOf, freeTogether, suggestions };
})();

// Demo class — STAT 110 on Saturday, Oct 3, 2026, one pset cycle after

const Demo = (() => {
  const ET = (s) => Date.parse(s + (s.length <= 16 ? ":00" : "") + "-04:00");
  const NOW = ET("2026-10-03T21:40");
  const PLACED_AT = ET("2026-09-25T18:00");

    { id: "c1", label: "PSet 4", start: ET("2026-09-25T17:00"), end: ET("2026-10-02T17:00") },
    { id: "c2", label: "PSet 5", start: ET("2026-10-02T17:00"), end: ET("2026-10-09T17:00") },
  ];

// ---------------------------------------------------------------------------
// Rich text: links, @mentions, $math$ (KaTeX → MathML), and a small Markdown
// subset for shared notes (**bold**, *italic*, lists, paragraphs).
// Everything except KaTeX's own output is rendered as text nodes.
// ---------------------------------------------------------------------------
const URL_SPLIT = /(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g;
const MATH_SPLIT = /((?<!\\)\$(?=\S)[^$\n]{1,200}?(?<=\S)\$(?!\d))/g;
const MATH_ONE = /^\$(?=\S)[^$\n]{1,200}(?<=\S)\$$/;
function MathSpan({ tex }) {
  const out = Media.mathHtml(tex);
  if (!out) return html`<code class="tex">${tex}</code>`;
  return html`<span class="math" dangerouslySetInnerHTML=${{ __html: out }}></span>`;
}
function inlineParts(text, mentionNames, opts) {
  const out = [];
  const pushMentions = (s) => {
    if (!mentionNames || !mentionNames.length) { out.push(s); return; }
    const re = new RegExp("(@(?:" + mentionNames.map((n) => n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + "))", "g");
    s.split(re).forEach((p, j) => out.push(j % 2 === 1 ? html`<span class="mention">${p}</span>` : p));
  };
  const pushEmphasis = (s) => {
    if (!opts || !opts.md) { pushMentions(s); return; }
    s.split(/(\*\*[^*]+\*\*|\*[^*\s][^*]*\*)/g).forEach((p) => {
      if (/^\*\*[^*]+\*\*$/.test(p)) out.push(html`<strong>${p.slice(2, -2)}</strong>`);
      else if (/^\*[^*]+\*$/.test(p)) out.push(html`<em>${p.slice(1, -1)}</em>`);
      else if (p) pushMentions(p);
    });
  };
  String(text || "").split(URL_SPLIT).forEach((part, i) => {
    if (i % 2 === 1) { out.push(html`<a href=${part} target="_blank" rel="noopener noreferrer">${part.replace(/^https?:\/\/(www\.)?/, "")}</a>`); return; }
    // Pandoc's currency-safe rule: "$5 for pizza and $10 for drinks" stays text.
    part.split(MATH_SPLIT).forEach((seg) => {
      if (MATH_ONE.test(seg)) out.push(html`<${MathSpan} tex=${seg.slice(1, -1)} />`);
      else if (seg) pushEmphasis(seg.replace(/\\\$/g, "$"));
    });
  });

}
function RichText({ text, mentions }) {
  return inlineParts(text, mentions);
}
function NoteBody({ text }) {
  const blocks = [];
  let list = null;
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trimEnd();
    const ul = line.match(/^\s*[-•]\s+(.*)$/), ol = line.match(/^\s*(\d+)\.\s+(.*)$/);
    if (ul || ol) {
      const kind = ul ? "ul" : "ol";
      if (!list || list.kind !== kind) { list = { kind, items: [] }; blocks.push(list); }
      list.items.push(ul ? ul[1] : ol[2]);
      continue;
    }
    list = null;
    if (!line.trim()) { blocks.push({ kind: "gap" }); continue; }
    blocks.push({ kind: "p", text: line });
  }
  return html`<div class="note-body">${blocks.map((b, i) => {
    if (b.kind === "ul") return html`<ul key=${i}>${b.items.map((t) => html`<li>${inlineParts(t, null, { md: true })}</li>`)}</ul>`;
    if (b.kind === "ol") return html`<ol key=${i}>${b.items.map((t) => html`<li>${inlineParts(t, null, { md: true })}</li>`)}</ol>`;
    if (b.kind === "gap") return null;
    return html`<p key=${i}>${inlineParts(b.text, null, { md: true })}</p>`;

const RUN_GAP = 5 * 60e3; // Bluesky: cluster within 5 minutes
function buildBlocks(msgs, uid, lastRead) {
  const blocks = [];
  let lastDay = null, run = null, unreadPlaced = false;
  for (const m of msgs) {
    const dk = dayKey(m.ts);
    if (dk !== lastDay) { blocks.push({ type: "day", ts: m.ts, key: "d" + dk }); lastDay = dk; run = null; }
    if (!unreadPlaced && lastRead && m.ts > lastRead && m.by !== uid && m.kind !== "system") { blocks.push({ type: "unread", key: "unread" }); unreadPlaced = true; run = null; }
    if (["system", "recap", "due", "announce", "poll", "event"].includes(m.kind)) { blocks.push({ type: m.kind, m, key: m.id }); run = null; continue; }
    if (run && run.by === m.by && m.ts - run.last < RUN_GAP && run.items.length < 14) { run.items.push(m); run.last = m.ts; }
    else { run = { type: "run", by: m.by, items: [m], last: m.ts, key: "r" + m.id }; blocks.push(run); }
  }
  return blocks;
}

function MessageList({ courseId, messages, byId, lastRead, empty, header, recapCtx, catchup }) {
  const app = useApp();
  const scroller = useRef(null);
  const [newCount, setNewCount] = useState(0);
  const [atBottom, setAtBottom] = useState(true);
  const prevLen = useRef(0);
  const opened = useRef(false);
  const blocks = useMemo(() => buildBlocks(messages, app.uid, lastRead), [messages, app.uid, lastRead]);
  const unreadN = useMemo(() => messages.filter((m) => m.ts > lastRead && m.by !== app.uid && m.kind !== "system").length, [messages, lastRead]);
  const nearBottom = () => { const el = scroller.current; return !el || el.scrollHeight - el.scrollTop - el.clientHeight < 160; };
  const toBottom = (smooth) => { const el = scroller.current; if (el) el.scrollTo({ top: el.scrollHeight, behavior: smooth ? "smooth" : "auto" }); };
  const toUnread = () => { const el = scroller.current, d = el && el.querySelector(".unread-div"); if (d) el.scrollTo({ top: Math.max(0, d.offsetTop - 90), behavior: "smooth" }); };
  useLayoutEffect(() => {
    const el = scroller.current;
    if (!el) return;
    if (!opened.current && messages.length) {
      opened.current = true;
      const div = el.querySelector(".unread-div");
      if (div && unreadN > 4) el.scrollTop = Math.max(0, div.offsetTop - 120); else el.scrollTop = el.scrollHeight;
      prevLen.current = messages.length;
      setAtBottom(nearBottom());
      return;
    }
    if (messages.length > prevLen.current) {
      const last = messages[messages.length - 1];
      if (atBottom || (last && last.by === app.uid)) requestAnimationFrame(() => toBottom(true));
      else setNewCount((n) => n + (messages.length - prevLen.current));
    }
    prevLen.current = messages.length;
  }, [messages]);
  const onScroll = () => { const b = nearBottom(); if (b !== atBottom) setAtBottom(b); if (b && newCount) setNewCount(0); };
  const flash = (id) => {
    const el = scroller.current && scroller.current.querySelector('[data-mid="' + id + '"]');
    if (!el) { app.toast("That message is further back than this chat has loaded."); return; }
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  };
  // Arriving from Activity, Saved or search: scroll to that message and flash it.
  const focus = app.route.focus;
  useEffect(() => {
    if (!focus || !messages.some((m) => m.id === focus)) return;
    const t = setTimeout(() => { flash(focus); app.setRoute({ focus: null }); }, 160);
    return () => clearTimeout(t);
  }, [focus, messages.length]);
  return html`<div class="scroller" ref=${scroller} onScroll=${onScroll}>
    <div class="msgs">
      ${header || null}
      ${catchup ? html`<${CatchUp} courseId=${courseId} messages=${messages} lastRead=${lastRead} byId=${byId} onJump=${flash} onUnread=${toUnread} />` : null}
      ${messages.length === 0 ? empty : null}
      ${blocks.map((b) => {
        if (b.type === "day") return html`<div class="daysep" key=${b.key}><span>${dayLabel(b.ts)}</span></div>`;
        if (b.type === "unread") return html`<div class="unread-div" key="unread"><span>${plural(unreadN, "new message")}</span></div>`;
        if (b.type === "system") return html`<div class="sysline" key=${b.key}>${b.m.text}</div>`;
        if (b.type === "recap") return html`<${RecapInChat} key=${b.key} m=${b.m} courseId=${courseId} ctx=${recapCtx} />`;
        if (b.type === "due") return html`<${DueCard} key=${b.key} m=${b.m} courseId=${courseId} />`;
        if (b.type === "announce") return html`<${AnnounceCard} key=${b.key} m=${b.m} />`;
        if (b.type === "poll") return html`<${CardMsg} key=${b.key} m=${b.m} courseId=${courseId} byId=${byId} flash=${flash}><${PollCard} m=${b.m} courseId=${courseId} /><//>`;
        if (b.type === "event") return html`<${CardMsg} key=${b.key} m=${b.m} courseId=${courseId} byId=${byId} flash=${flash}><${EventCard} m=${b.m} courseId=${courseId} /><//>`;
        return html`<${Run} key=${b.key} run=${b} courseId=${courseId} byId=${byId} flash=${flash} />`;
      })}
    </div>

      <${Icon} name="arrowDown" size=${18} />${newCount ? html`<span>${newCount} new</span>` : null}
    </button>
  </div>`;

// "While you were away" — extractive, no AI, no calls to action (AI+data spec c).
function CatchUp({ courseId, messages, lastRead, byId, onJump, onUnread }) {
  const app = useApp();

  const [gone, setGone] = useState(false);
  const d = useMemo(() => Derive.digest(messages, lastRead, app.uid), [messages, lastRead]);
  const away = Clock.now() - lastRead;
  const hub = app.hubs[courseId];
  const due = ((hub && hub.due) || []).filter((x) => x.at > Clock.now()).sort((a, b) => a.at - b.at)[0];
  const mentions = messages.filter((m) => m.ts > lastRead && (m.mentions || []).includes(app.uid));
  const things = d.top.length + d.questions.length + d.recaps.length + (d.shares.length ? 1 : 0) + mentions.length;
  if (gone || (d.count < 25 && away < 864e5) || !d.count) return null;
  const Q = ({ m, meta }) => html`<button class="cu-q" onClick=${() => onJump(m.id)}>
    <span class="cu-q-t">${m.kind === "photo" ? "📷 " : ""}<${RichText} text=${m.text || (m.poll && m.poll.question) || ""} /></span>

    </button>

      ${mentions.length ? html`<div class="cu-sec"><span class="eyebrow">Mentions of you</span>${mentions.slice(-2).map((m) => html`<${Q} key=${m.id} m=${m} meta=${relShort(m.ts)} />`)}</div>` : null}
      ${due ? html`<div class="cu-sec"><span class="eyebrow">Due soon</span><div class="cu-due"><span>${due.title}</span><span class=${"due-tone " + dueLadder(due.at).tone}>${dueLadder(due.at).text}</span></div></div>` : null}
      ${d.recaps.length ? html`<div class="cu-sec"><span class="eyebrow">New recap</span>${d.recaps.map((m) => html`<button class="cu-q" key=${m.id} onClick=${() => onJump(m.id)}><span class="cu-q-t">${m.text}</span></button>`)}</div>` : null}
      ${d.top.length ? html`<div class="cu-sec"><span class="eyebrow">Most reacted</span>${d.top.slice(0, 2).map((m) => html`<${Q} key=${m.id} m=${m} meta=${Derive.countReacts(m) + " reactions · " + relShort(m.ts)} />`)}</div>` : null}
      ${d.questions.length ? html`<div class="cu-sec"><span class="eyebrow">Open questions</span>${d.questions.slice(-2).map((m) => html`<${Q} key=${m.id} m=${m} meta=${"no replies yet · " + relShort(m.ts)} />`)}</div>` : null}
      ${d.shares.length ? html`<div class="cu-sec"><span class="eyebrow">Shared</span><div class="cu-chips">${d.shares.map((m) => html`<button class="chip" onClick=${() => onJump(m.id)}>${m.kind === "photo" ? "📷 Photo" : "🔗 Link"} · ${firstName(app.person(m.by).name)}</button>`)}</div></div>` : null}

    </div>` : null}

  return [
    [app.canWrite && { key: "reply", label: "Reply", icon: "reply" }, m.text && { key: "copy", label: "Copy text", icon: "paste" }, { key: "save", label: savedOn ? "Remove from Saved" : "Save", icon: "bookmark", hint: "S" }],
    [mine && m.thread && m.thread !== "main" && m.text && /\?/.test(m.text) && { key: "resolve", label: m.resolved ? "Mark as open" : "Mark as answered", icon: "checkCircle" },
      mine && m.kind === "text" && { key: "edit", label: "Edit", icon: "edit" }],
    [!mine && { key: "profile", label: "View " + firstName(app.person(m.by).name) + "'s profile", icon: "users" }],
    [!mine && { key: "report", label: "Report", icon: "flag", danger: true }, app.isOrganizer && !mine && { key: "hide", label: m.hidden ? "Restore message" : "Remove for everyone", icon: "x", danger: true }, mine && { key: "delete", label: "Delete", icon: "x", danger: true }],
  ].filter((g) => g.some(Boolean));
}
function runAction(app, it, m, courseId, extra) {
  const k = it.key;
  if (k === "reply") app.setReplyTo(m);
  if (k === "copy") navigator.clipboard.writeText(m.text || "").then(() => app.toast("Copied"), () => app.toast("Copy isn't available here. Select the text instead."));
  if (k === "save") app.save(courseId, m);

function Msg({ m, first, last, mine, person, courseId, byId, flash }) {
  const app = useApp();
  const [pop, setPop] = useState(null);
  const [sheet, setSheet] = useState(false);
  const [dx, setDx] = useState(0);
  const g = useRef(null);
  const mentionNames = useMemo(() => (m.mentions || []).map((id) => app.person(id).name).filter(Boolean), [m.mentions, app.members]);
  if (m.deleted || (m.hidden && !app.isOrganizer)) {
    return html`<div class="msg" data-mid=${m.id}><div class="bub ghost">${m.hidden ? "Removed by the organizer" : "Message deleted"}</div></div>`;
  }
  const reply = m.replyTo ? byId[m.replyTo] : null;
  const canAct = app.canWrite;
  const onReact = (e) => { setPop(null); setSheet(false); app.react(courseId, m, e); };

  // Touch: swipe inward to reply (Bluesky 56px + 32px resistance), press-and-hold for the menu.
  const onPointerDown = (e) => {
    if (e.pointerType !== "touch" || !canAct) return;
    g.current = { x: e.clientX, y: e.clientY, armed: false, hold: setTimeout(() => { if (g.current && !g.current.armed) { g.current = null; setSheet(true); if (navigator.vibrate) navigator.vibrate(10); } }, 400) };
  };
  const onPointerMove = (e) => {
    const s = g.current;
    if (!s) return;
    const ddx = (e.clientX - s.x) * (mine ? -1 : 1), ddy = Math.abs(e.clientY - s.y);
    if (!s.armed && (Math.abs(e.clientX - s.x) > 10 || ddy > 10)) { clearTimeout(s.hold); if (ddy > 10 || ddx < 0) { g.current = null; setDx(0); return; } s.armed = true; }
    if (s.armed) {
      const x = Math.max(0, ddx);
      const v = x <= 56 ? x : 56 + 32 * (1 - Math.exp(-(x - 56) / 32));
      if (!s.crossed && x > 56) { s.crossed = true; if (navigator.vibrate) navigator.vibrate(10); }
      setDx(v * (mine ? -1 : 1));
    }
  };
  const onPointerUp = () => {
    const s = g.current;
    g.current = null;
    if (!s) return;
    clearTimeout(s.hold);
    if (s.armed && s.crossed) app.setReplyTo(m);
    setDx(0);
  };
  const mentionsMe = (m.mentions || []).includes(app.uid);
  return html`<div class=${"msg" + (mentionsMe ? " mentions-me" : "") + (first ? " first" : "") + (last ? " last" : "") + (m.hidden ? " is-hidden" : "")} data-mid=${m.id}>
    <div class="swipe-ic" style=${{ opacity: Math.min(1, Math.abs(dx) / 56), transform: "scale(" + (0.5 + Math.min(1, Math.abs(dx) / 56) * 0.5) + ")" }} aria-hidden="true"><${Icon} name="reply" size=${18} /></div>
    <div class=${"bub" + (m.kind === "photo" ? " photo" : "")} style=${dx ? { transform: "translateX(" + dx + "px)", transition: "none" } : null}
      onPointerDown=${onPointerDown} onPointerMove=${onPointerMove} onPointerUp=${onPointerUp} onPointerCancel=${onPointerUp}
      onContextMenu=${(e) => { if (canAct && matchMedia("(hover: none)").matches) e.preventDefault(); }}
      onDblClick=${() => canAct && matchMedia("(hover: hover)").matches && app.setReplyTo(m)}>
      ${first && !mine ? html`<div class="hd"><b>${person.name}</b>${tagLine(person) ? html`<span class="tag">${tagLine(person)}</span>` : null}<span class="tm" title=${dueWhen(m.ts)}>${relShort(m.ts)}</span></div>` : null}
      ${m.replyTo ? html`<button class="quote" style=${{ "--qc": reply ? nameColor(reply.by) : "var(--ink-3)" }} onClick=${() => flash(m.replyTo)}>
          <b>${reply ? (reply.by === app.uid ? "You" : app.person(reply.by).name) : "Earlier message"}</b><span>${reply ? (reply.deleted ? "Message deleted" : reply.kind === "photo" ? "📷 Photo" + (reply.text ? " · " + reply.text : "") : reply.text) : "Not loaded"}</span></button>` : null}
      ${m.kind === "photo" && m.image ? html`<button class="ph" onClick=${() => app.open("photo", { m, courseId })} style=${{ aspectRatio: (m.image.w || 4) + "/" + (m.image.h || 3) }} aria-label="Open photo"><img src=${Media.resolve(m.image.src)} alt=${m.text || "Photo"} loading="lazy" /></button>` : null}
      ${m.text || (m.tags && m.tags.length) ? html`<div class="tx">${(m.tags || []).map((t) => html`<span class="pchip">${prettyProblem(t)}</span>`)}<${RichText} text=${m.text} mentions=${mentionNames} />${m.editedAt ? html`<span class="edited">edited</span>` : null}</div>` : null}
      ${(m.attachments || []).map((a) => html`<button class="attach" onClick=${() => app.toast(app.demo ? "Example file in the demo class." : "Files open from the shared notes folder.")}>
          <span class=${"fi " + (a.kind || "")}>${a.kind === "image" ? "JPG" : "PDF"}</span><span class="attach-t"><b>${a.name}</b><small>${a.size || ""}</small></span></button>`)}
      ${m.resolved ? html`<div class="answered"><${Icon} name="checkCircle" size=${14} />Answered</div>` : null}
      ${m.hidden ? html`<div class="answered warn">Hidden from classmates</div>` : null}
    </div>
    <${Reactions} m=${m} courseId=${courseId} />
    ${canAct ? html`<div class="hover-tools" role="toolbar" aria-label="Message actions">
      <button onClick=${(e) => setPop(e.currentTarget)} aria-label="React"><${Icon} name="smile" size=${18} /></button>
      <button onClick=${() => app.setReplyTo(m)} aria-label="Reply"><${Icon} name="reply" size=${18} /></button>
      <${MsgMenuButton} m=${m} courseId=${courseId} />
    </div>` : null}
    ${pop ? html`<${Popover} anchor=${pop} onClose=${() => setPop(null)}><${ReactionTray} onPick=${onReact} /><//>` : null}
    ${sheet ? html`<${Sheet} bare label="Message actions" onClose=${() => setSheet(false)} size="ctx">
      <div class="ctx-preview"><div class=${"bub" + (mine ? " own" : "")}>${m.kind === "photo" ? "📷 " : ""}${m.text || (m.kind === "photo" ? "Photo" : "")}</div></div>
      <${ReactionTray} onPick=${onReact} compact />
      <${Menu} items=${msgActions(app, m, courseId, mine)} onPick=${(it) => { setSheet(false); runAction(app, it, m, courseId); }} />
    <//>` : null}
  </div>`;
}

const RSVP = [["going", "👍", "Going"], ["maybe", "🤔", "Maybe"], ["no", "😢", "Can't"]];

}

function Composer({ courseId, thread, placeholder, problems, problem, onProblem, members, hint }) {
  const app = useApp();
  const [text, setText] = useState("");
  const [mentions, setMentions] = useState([]);
  const [suggest, setSuggest] = useState(null);
  const [sel, setSel] = useState(0);
  const [probPop, setProbPop] = useState(null);
  const ta = useRef(null);
  const file = useRef(null);
  const typingAt = useRef(0);
  const draftKey = "roster:draft:" + courseId + ":" + thread;
  useEffect(() => { setText(LS.get(draftKey, "")); }, [draftKey]);
  useLayoutEffect(() => { const el = ta.current; if (el) { el.style.height = "auto"; el.style.height = Math.min(150, el.scrollHeight) + "px"; } }, [text]);
  useEffect(() => { if (app.replyTo && ta.current) ta.current.focus(); }, [app.replyTo]);
  // Editing lives in the session so a menu anywhere can start it (Telegram's edit bar).
  const editing = app.editing && app.editing.courseId === courseId && app.editing.m.thread === thread ? app.editing.m : null;
  const setEditing = (m) => app.setEditing(m ? { courseId, m } : null);
  const editId = editing && editing.id;
  useEffect(() => { if (editing) { setText(editing.text || ""); setTimeout(() => ta.current && ta.current.focus(), 0); } }, [editId]);
  if (!app.canWrite) {
    return html`<div class="composer-wrap"><div class="readonly"><${Icon} name="info" /><span class="grow">You can read this class but not post.${app.demo ? "" : " Ask the organizer to add you as a contributor."}</span>
      ${app.live ? html`<button class="btn sm soft" onClick=${() => app.switchMode("demo")}>Try the demo class</button>` : null}</div></div>`;
  }
  if (app.me && !app.me.pledgeAt) {
    return html`<div class="composer-wrap"><button class="pledge-gate" onClick=${() => app.open("pledge")}><span class="pledge-ic"><${Icon} name="wave" size=${20} /></span><span class="grow"><b>Take the Roster pledge to start talking.</b><small>You can read everything already.</small></span><span class="btn sm primary">Continue</span></button></div>`;
  }
  const onInput = (e) => {
    const v = e.target.value;
    setText(v); LS.set(draftKey, v);
    const now = Date.now();
    if (now - typingAt.current > 2500) { typingAt.current = now; app.setTyping(courseId, true); }
    const mm = v.slice(0, e.target.selectionStart).match(/(?:^|\s)@([\w'-]{0,20})$/);
    if (mm) {
      const q = mm[1].toLowerCase();
      const list = members.filter((x) => x.id !== app.uid && (x.displayName || "").toLowerCase().split(/\s+/).some((w) => w.startsWith(q))).slice(0, 6);
      setSuggest(list.length ? list : null); setSel(0);
    } else setSuggest(null);
  };
  const pickMention = (mem) => {
    const el = ta.current, caret = el.selectionStart;
    const before = text.slice(0, caret).replace(/@([\w'-]{0,20})$/, "@" + mem.displayName + " ");
    setText(before + text.slice(caret)); setMentions((x) => [...new Set([...x, mem.id])]); setSuggest(null);
    setTimeout(() => { el.focus(); el.selectionStart = el.selectionEnd = before.length; }, 0);
  };
  const send = async () => {
    const t = text.trim();
    if (!t) return;
    if (editing) { const ok = await app.editMsg(courseId, editing, t); if (ok) { setEditing(null); setText(""); LS.set(draftKey, ""); } return; }
    const used = mentions.filter((id) => t.includes("@" + app.person(id).name));
    setText(""); LS.set(draftKey, ""); setMentions([]); setSuggest(null);
    app.setTyping(courseId, false);
    const ok = await app.send(courseId, { text: t, thread, tags: problem && problem !== "all" ? [problem] : undefined, mentions: used });
    if (!ok) setText(t);
  };
  const onKey = (e) => {
    if (suggest) {
      if (e.key === "ArrowDown") { e.preventDefault(); setSel((sel + 1) % suggest.length); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); setSel((sel - 1 + suggest.length) % suggest.length); return; }
      if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); pickMention(suggest[sel]); return; }
      if (e.key === "Escape") { setSuggest(null); return; }
    }
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !matchMedia("(pointer: coarse)").matches) { e.preventDefault(); send(); }
    if (e.key === "Escape") { if (editing) { setEditing(null); setText(""); } else if (app.replyTo) app.setReplyTo(null); }
  };
  const onFile = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (f) app.open("photo-send", { courseId, thread, file: f, tags: problem && problem !== "all" ? [problem] : undefined });
  };
  const r = app.replyTo;
  return html`<div class="composer-wrap">
    <${TypingLine} courseId=${courseId} />
    ${suggest ? html`<div class="mentions" role="listbox">${suggest.map((mem, i) => html`<button role="option" aria-selected=${i === sel} class=${i === sel ? "on" : ""} onMouseEnter=${() => setSel(i)} onClick=${() => pickMention(mem)}>
      <${Avatar} uid=${mem.id} size=${28} online=${app.online.has(mem.id)} /><span class="grow"><b>${mem.displayName}</b><small>${[tagLine(mem), mem.sections && mem.sections[courseId] && Catalog.slot(mem.sections[courseId]) ? "Section " + Catalog.slot(mem.sections[courseId]).label : ""].filter(Boolean).join(" · ")}</small></span></button>`)}</div>` : null}
    ${hint && !text ? html`<div class="composer-hint">${hint}</div>` : null}
    <div class="composer">
      <button class="cbtn" onClick=${() => app.open("attach", { courseId, thread, pick: () => file.current && file.current.click(), problem })} aria-label="Add a photo, poll or study session"><${Icon} name="plus" size=${22} /></button>
      <input type="file" accept="image/*" ref=${file} hidden onChange=${onFile} />
      <div class="pillbox">
        ${r || editing ? html`<div class="embed"><span class="embed-rail" style=${{ background: editing ? "var(--accent)" : nameColor(r.by) }}></span>
          <span class="grow"><b>${editing ? "Editing message" : "Reply to " + (r.by === app.uid ? "yourself" : app.person(r.by).name)}</b><small>${(editing || r).text || "📷 Photo"}</small></span>
          <button class="iconbtn sm" onClick=${() => { if (editing) { setEditing(null); setText(""); } else app.setReplyTo(null); }} aria-label="Cancel"><${Icon} name="x" size=${16} /></button></div>` : null}
        <div class="pillrow">
          ${problems && problems.length ? html`<button class="pchip pick" onClick=${(e) => setProbPop(e.currentTarget)} aria-label="Tag a problem">${problem && problem !== "all" ? prettyProblem(problem) : "Tag"}<${Icon} name="updown" size=${12} /></button>` : null}
          <textarea id=${"composer-" + courseId + "-" + thread} ref=${ta} rows="1" value=${text} onInput=${onInput} onKeyDown=${onKey} onBlur=${() => app.setTyping(courseId, false)} placeholder=${placeholder} aria-label=${placeholder}></textarea>
        </div>
      </div>
      <button class=${"send" + (text.trim() ? " on" : "")} onClick=${send} disabled=${!text.trim()} aria-label=${editing ? "Save edit" : "Send"}><${Icon} name=${editing ? "check" : "send"} size=${20} /></button>
    </div>
    ${probPop ? html`<${Popover} anchor=${probPop} onClose=${() => setProbPop(null)}><${Menu} items=${[[{ key: "all", label: "No problem tag", icon: "x" }, ...problems.map((p) => ({ key: p, label: "Problem " + prettyProblem(p), icon: "hash" }))]]} onPick=${(it) => { onProblem(it.key); setProbPop(null); }} /><//>` : null}
  </div>`;
}


// ---------------------------------------------------------------------------
// AI lecture recap v2 (AI+data spec a): Collaborative Notes anatomy, Granola's
// grey-until-checked rule, guided fixes with a Docs-style diff, Community

const FIX_REASONS = ["Wrong number or formula", "Missing a step", "Not said in lecture", "Unclear wording"];
function bulletState(recap, b, fixes, checks, uid) {
  const fx = fixes.filter((f) => f.recapId === recap.id && f.bulletId === b.id && f.status !== "dismissed");
  let applied = null;
  if (b.fixedBy) applied = fx.find((f) => f.id === b.fixedBy) || { id: b.fixedBy, text: b.fixedText, by: null, ts: recap.ts };
  const ckAll = checks.filter((c) => c.recapId === recap.id && c.bulletId === b.id);
  const checkedBefore = (t) => ckAll.filter((c) => c.ts < t).length >= 2;
  // A wording-only fix can't replace a line classmates already checked (Community Notes decider).
  const canApply = (f) => autoApplied(f) && !(f.reason === "Unclear wording" && checkedBefore(f.ts));
  if (!applied) applied = fx.filter(canApply).sort((a, c) => appliedAt(a) - appliedAt(c)).pop() || null;
  const open = fx.filter((f) => !canApply(f) && (!applied || f.id !== applied.id));
  // Checks made before a fix landed belong to the old text.
  const since = applied ? appliedAt(applied) || applied.ts : 0;
  const ck = ckAll.filter((c) => c.ts >= since);
  return {
    applied, open, checks: ck, mine: ck.some((c) => c.by === uid),
    text: applied ? applied.text || b.fixedText : b.text,
    state: applied ? "fixed" : open.length ? "open" : ck.length >= 2 ? "checked" : "ai",
  };
}

function RecapCard({ recap, courseId, fixes, checks, compact }) {
  const app = useApp();
  const [history, setHistory] = useState(false);
  const states = recap.bullets.map((b) => bulletState(recap, b, fixes, checks, app.uid));
  const openN = states.reduce((n, s) => n + s.open.length, 0);
  const needs = states.filter((s) => s.state === "ai").length;
  const fixesHere = fixes.filter((f) => f.recapId === recap.id);
  const appliedN = states.filter((s) => s.state === "fixed").length;
  const done = !openN && !needs;
  const status = done
    ? { dot: "ok", t: "Checked by classmates", sub: [appliedN ? plural(appliedN, "fix", "fixes") + " applied" : "", "Matches the slides"].filter(Boolean).join(" · ") }
    : openN ? { dot: "warn", t: "Has a fix waiting", sub: plural(openN, "fix", "fixes") + " waiting" + (needs ? " · " + needs + " to check" : "") }
    : { dot: "", t: "Needs " + needs + " more " + (needs === 1 ? "check" : "checks"), sub: "" };
  return html`<article class="recap" aria-label=${"Lecture " + recap.lecture + " recap"} data-mid=${"rm-" + recap.id}>
    <div class="recap-status"><span class=${"dot " + status.dot}></span><b>${status.t}</b>${status.sub ? html`<span class="sub">· ${status.sub}</span>` : null}<span class="sub">· ${relShort(recap.ts)}</span></div>
    <div class="recap-label"><${Icon} name="ai" size=${14} /><span>Lecture recap · AI-drafted from the organizer's notes · updates with class fixes ·</span><button onClick=${() => setHistory(true)}>History</button></div>

}

function Suggestion({ f, b, current, courseId }) {
  const app = useApp();
  const yes = !!(f.votes || {})[app.uid], no = !!(f.nays || {})[app.uid];
  const mineFix = f.by === app.uid;
  const n = agreeN(f);
  return html`<div class="sugg">

  </div>`;
}
function FixSheet({ recap, b, i, text, courseId, onClose }) {
  const app = useApp();
  const [val, setVal] = useState(text);
  const [reason, setReason] = useState(null);
  const [busy, setBusy] = useState(false);
  const changed = val.trim() && val.trim() !== text.trim();

    setBusy(true);

}
function RecapHistory({ recap, fixes, onClose }) {
  const app = useApp();

function RecapInChat({ m, courseId, ctx }) {
  const recap = ctx && ctx.recaps[m.recapId];

function useClassData(courseId) {
  const app = useApp();
  const feed = app.feeds[courseId] || null;
  const threads = useCollection(() => app.db.collection("courses/" + courseId + "/threads"), [courseId, app.db]) || [];
  const recapList = useCollection(() => app.db.collection("recaps/" + courseId + "/items"), [courseId, app.db]) || [];
  const checks = useCollection(() => app.db.collection("courses/" + courseId + "/checks").limit(1000), [courseId, app.db]) || [];
  const notes = useCollection(() => app.db.collection("courses/" + courseId + "/notes"), [courseId, app.db]) || [];
  const stuck = useCollection(() => app.db.collection("courses/" + courseId + "/stuck"), [courseId, app.db]) || [];
  const fixes = useMemo(() => app.fixes.filter((f) => f.cid === courseId), [app.fixes, courseId]);
  const messages = feed || [];
  const byId = useMemo(() => Object.fromEntries(messages.map((m) => [m.id, m])), [messages]);
  const ctx = useMemo(() => ({ recaps: Object.fromEntries(recapList.map((r) => [r.id, r])), fixes, checks }), [recapList, fixes, checks]);
  const members = useMemo(() => app.members.filter((m) => m.courses && m.courses[courseId]), [app.members, courseId]);
  const now = Clock.now();
  const psets = threads.filter((t) => t.kind === "pset").sort((a, b) => (a.due || 0) - (b.due || 0));
  const pset = psets.find((t) => t.due > now - 864e5) || psets[psets.length - 1] || null;
  return { feed, messages, byId, ctx, members, threads, psets, pset, recapList, fixes, checks, notes, stuck };
}

// Telegram's pinned bar with a segmented rail; Saturn's amber countdown on deadlines.
function PinBar({ courseId, hub, pset }) {
  useTick(1000);
  const [i, setI] = useState(0);
  const now = Clock.now();
  const items = [];
  const psetFirst = (d) => (/pset|problem set/i.test(d.title) ? 0 : 1);
  for (const d of ((hub && hub.due) || []).filter((x) => x.at > now).sort((a, b) => psetFirst(a) - psetFirst(b) || a.at - b.at).slice(0, 2)) items.push({ icon: "flag", k: "Due", text: d.title + (d.where ? " · " + d.where : ""), at: d.at });
  if (hub && hub.rules && hub.rules[0]) items.push({ icon: "shield", k: "Class rule", text: hub.rules[0] });
  if (!items.length) return null;
  const k = i % items.length, it = items[k];
  const left = it.at ? it.at - now : null;
  return html`<button class="pinbar" onClick=${() => setI(k + 1)} aria-label=${"Pinned " + (k + 1) + " of " + items.length + ". Show next."}>
    <span class="pin-rail">${items.map((_, j) => html`<i class=${j === k ? "on" : ""}></i>`)}</span>
    <span class="grow pin-body"><span class="pin-k">Pinned · ${it.k}</span><span class="pin-v">${it.text}</span></span>
    ${left != null ? html`<span class="pin-cd"><small>${left < 864e5 ? "DUE IN" : dueLadder(it.at).text.toUpperCase()}</small><b class="tnum">${left < 864e5 ? countdown(left) : inWords(left)}</b></span>` : null}
  </button>`;
}

// ---- PSet board (Gradescope chips, Ed pills, GitHub upvote pill) ----
function PsetBoard({ courseId, D }) {
  const app = useApp();
  useTick(1000);
  const t = D.pset;
  const [problem, setProblem] = useState(null);
  const [sort, setSort] = useState("order");
  const inThread = D.messages.filter((m) => m.thread === t.id);
  const lrKey = "roster:lr:" + app.mode + ":" + courseId + ":" + t.id;
  const [lastRead] = useState(() => LS.get(lrKey, Clock.now() - 3 * 3600e3));
  useEffect(() => () => LS.set(lrKey, Clock.now()), [lrKey]);
  const left = t.due - Clock.now();
  const rows = (t.problems || []).map((p, idx) => {
    const msgs = inThread.filter((m) => (m.tags || []).includes(p));
    const qs = msgs.filter((m) => !m.replyTo && m.kind === "text");
    const answered = qs.length > 0 && qs.every((q) => q.resolved || msgs.some((x) => x.replyTo === q.id));
    const stuckers = D.stuck.filter((s) => s.thread === t.id && s.problem === p).map((s) => s.by);
    return { p, idx, msgs, qs, status: !msgs.length ? "none" : answered ? "answered" : "open", stuckers, mine: stuckers.includes(app.uid), fresh: msgs.filter((m) => m.ts > lastRead && m.by !== app.uid).length, last: msgs[msgs.length - 1] };
  });
  const sorted = [...rows].sort((a, b) => (sort === "stuck" ? b.stuckers.length - a.stuckers.length : sort === "open" ? (a.status === "open" ? -1 : 0) - (b.status === "open" ? -1 : 0) : 0) || a.idx - b.idx);
  if (problem) {
    const r = rows.find((x) => x.p === problem);
    return html`<div class="pane-col">
      <div class="probhead"><button class="iconbtn" onClick=${() => setProblem(null)} aria-label="All problems"><${Icon} name="chevronLeft" /></button>
        <span class="pchip lg">${prettyProblem(problem)}</span><b class="grow">${t.title} · problem ${prettyProblem(problem)}</b>
        ${app.canWrite ? html`<button class=${"stuck" + (r.mine ? " on" : "")} aria-pressed=${r.mine} onClick=${() => app.toggleStuck(courseId, t.id, problem, r.mine)}>↑ ${r.mine ? (r.stuckers.length > 1 ? "You + " + (r.stuckers.length - 1) + " stuck" : "You're stuck") : r.stuckers.length + " stuck"}</button>` : null}</div>
      <${MessageList} courseId=${courseId} messages=${r.msgs} byId=${D.byId} lastRead=${lastRead} recapCtx=${D.ctx}
        empty=${html`<${Empty} icon="question" title=${"No one's asked about " + prettyProblem(problem) + " yet"}>Ask the class. People stuck on the same part will find it here.<//>`} />
      <${Composer} courseId=${courseId} thread=${t.id} members=${D.members} problems=${t.problems} problem=${problem} onProblem=${(p) => p !== "all" && setProblem(p)}
        placeholder=${"Ask about " + prettyProblem(problem)} hint=${left > 0 ? "Explain the idea, not the final answer." : null} />
    </div>`;
  }
  return html`<div class="scroller"><div class="psetboard">
    <div class="psethero">
      <div class="grow"><span class="eyebrow">${t.title}</span><h3>Due ${dueWhen(t.due)}</h3><p class=${"due-tone " + dueLadder(t.due).tone}>${dueLadder(t.due).text}${dueLadder(t.due).sub ? " · " + dueLadder(t.due).sub : ""}</p></div>
      ${left > 0 && left < 2 * 864e5 ? html`<div class="bigcd"><small>ENDS IN</small><b class="tnum">${countdown(left)}</b></div>` : null}
    </div>
    <div class="policy"><${Icon} name="shield" size=${22} /><p><b>Collaboration policy.</b> ${(app.hubs[courseId] && app.hubs[courseId].rules && app.hubs[courseId].rules[0]) || "Talk through ideas, write up your own solutions."} Don't share or ask for full answers before the deadline.</p></div>
    <div class="board-h"><span class="eyebrow">Problems</span><span class="grow"></span>
      <${Seg} value=${sort} onChange=${setSort} label="Sort problems" options=${[["order", "In order"], ["stuck", "Most stuck"], ["open", "Unanswered"]]} /></div>
    <div class="probs">${sorted.map((r) => html`<div class=${"prob" + (r.fresh ? " fresh" : "")} key=${r.p}>
      <button class="prob-main" onClick=${() => setProblem(r.p)}>
        <span class="pchip lg">${prettyProblem(r.p)}</span>
        <span class="prob-body"><b>${r.qs[0] || r.msgs[0] ? html`${(r.qs[0] || r.msgs[0]).kind === "photo" ? "📷 " : ""}<${RichText} text=${(r.qs[0] || r.msgs[0]).text || "Photo"} />` : "No questions yet"}</b>
          <small>${r.msgs.length ? plural(r.msgs.length, "message") + " · last " + relShort(r.last.ts) : "Be the first to ask"}</small></span>
        <span class=${"status s-" + r.status}>${r.status === "answered" ? html`<${Icon} name="check" size=${12} />Answered` : r.status === "open" ? "Open" : ""}</span>
      </button>
      ${app.canWrite ? html`<button class=${"stuck" + (r.mine ? " on" : "")} aria-pressed=${r.mine} onClick=${() => app.toggleStuck(courseId, t.id, r.p, r.mine)} title="I'm stuck too">↑ ${r.stuckers.length}<span class="sr"> stuck</span></button>` : html`<span class="stuck">↑ ${r.stuckers.length}</span>`}
    </div>`)}</div>
    <p class="muted sm center">Tap ↑ if you're stuck too. You'll see when the problem gets answered.</p>
  </div></div>`;
}

// ---------------------------------------------------------------------------
// Now (time spec a + Saturn's home): one summary sentence, a now/next hero
// with smart states, friends' status row, due soon, tasks, today's classes,
// "This Evening", what's new in your classes, and the weekly story (pull-only).
// ---------------------------------------------------------------------------
function myMeetings(app, member) {
  return Derive.meetingsOf(member || app.me, (id) => course(app, id));
}
function heroState(app, meetings) {
  const now = Clock.now();
  const occ = Sched.occurrences(meetings, now - 864e5, now + 8 * 864e5);
  const cur = occ.find((o) => o.start <= now && o.end > now);
  if (cur) return { s: "in", o: cur };
  const justEnded = occ.filter((o) => o.end <= now && now - o.end < 15 * 60e3).pop();
  const next = occ.find((o) => o.start > now);
  const today = Sched.et(now).key;
  if (justEnded) return { s: "ended", o: justEnded, next };
  if (!next) return { s: "none" };
  const ms = next.start - now;
  if (Sched.et(next.start).key !== today) return { s: occ.some((o) => Sched.et(o.start).key === today) ? "done" : "free", next };
  if (ms <= 10 * 60e3) return { s: "starting", o: next };
  if (ms <= 60 * 60e3) return { s: "soon", o: next };
  return { s: "later", o: next };
}

function NowView() {
  const app = useApp();
  useTick(1000);
  const now = Clock.now();
  const meetings = useMemo(() => myMeetings(app), [app.me]);
  const H = heroState(app, meetings);
  const due = [];
  for (const cid of app.myCourses) for (const d of ((app.hubs[cid] && app.hubs[cid].due) || [])) if (d.at > now - 3600e3 && d.at - now < 72 * 3600e3) due.push({ ...d, cid });
  due.sort((a, b) => a.at - b.at);
  const tasks = app.tasks.filter((t) => !t.done).sort((a, b) => (a.due || 9e15) - (b.due || 9e15)).slice(0, 4);
  const todays = Sched.occurrences(meetings, Sched.startOfDay(now), Sched.addDays(now, 1)).filter((o) => o.start < Sched.addDays(Sched.startOfDay(now), 1));
  const events = useLiveEvents(app);
  const liveNow = events.filter((e) => e.ev.at <= now && (e.ev.end || e.ev.at + 7200e3) > now);
  const evening = events.filter((e) => e.ev.at > now && Sched.et(e.ev.at).key === Sched.et(now).key && Sched.et(e.ev.at).h >= 17);
  const nextDue = due.find((d) => d.at > now);
  const summary = [
    H.s === "in" ? "In " + course(app, H.o.cid).code + " now" : H.o && (H.s === "soon" || H.s === "starting" || H.s === "later") ? course(app, H.o.cid).code + " " + (H.s === "later" ? "at " + tShort(H.o.start) : "in " + inWords(H.o.start - now)) : H.s === "free" || H.s === "none" ? "No classes today" : "No more classes today",
    nextDue ? nextDue.title + " due " + dueLadder(nextDue.at).text.replace(/^Today /, "today ").replace(/^Tomorrow /, "tomorrow ") : due.length ? "" : "nothing due in the next 3 days",
  ].filter(Boolean).join(" · ");
  return html`<div class="page">
    <${PageHead} title=${F.wlmd.format(now)} sub=${summary} />
    <div class="scroller page-scroll"><div class="page-in now">
      ${app.web && app.isOrganizerReal ? html`<${OrgChecklist} />` : null}
      <${NowHero} H=${H} />
      ${liveNow.map((e) => html`<div class="livecard" key=${e.key}><span class="eyebrow live"><i class="pulse-dot"></i>Happening now${e.cid ? " · " + course(app, e.cid).code : " · Board"}</span><${EventCard} m=${e.m} courseId=${e.cid} /></div>`)}
      <${FriendsRow} />
      ${due.length ? html`<section><h2 class="sec-h">Due soon</h2><div class="group">${due.map((d) => html`<${DueRow} key=${d.cid + d.id} d=${d} courseId=${d.cid} compact=${true} />`)}</div></section>` : null}
      <section><div class="sec-hrow"><h2 class="sec-h">Tasks</h2><button class="link" onClick=${() => app.setRoute({ view: "tasks" })}>See all</button></div>
        <div class="group">${tasks.length ? tasks.map((t) => html`<${TaskRow} key=${t.id} t=${t} />`) : html`<div class="rowempty">Nothing on your list. Add “Start PSet 5” from a due date, or <button class="link" onClick=${() => app.open("task-new")}>add a task</button>.</div>`}</div></section>
      <section><h2 class="sec-h">${todays.length ? "Today's classes" : "Next class"}</h2>
        <div class="group">${todays.length ? todays.map((o) => html`<${MeetingRow} key=${o.cid + o.start} o=${o} />`)
          : H.next || H.o ? html`<${MeetingRow} o=${H.next || H.o} showDay=${true} />` : html`<div class="rowempty">Add meeting times in <button class="link" onClick=${() => app.setRoute({ view: "calendar" })}>Calendar</button> to see your classes here.</div>`}</div></section>
      ${evening.length ? html`<section><h2 class="sec-h"><${Icon} name="moon" size=${18} fill=${true} /> This Evening</h2>${evening.map((e) => html`<${EventCard} key=${e.key} m=${e.m} courseId=${e.cid} />`)}</section>` : null}
      <${InYourClasses} />
      <${StoryEntry} />

function NowHero({ H }) {
  const app = useApp();
  const now = Clock.now();
  if (H.s === "in") {
    const o = H.o, left = o.end - now, pct = Math.min(1, (now - o.start) / (o.end - o.start));
    return html`<section class="hero in" style=${{ "--edge": courseLook(o.cid).hue }}>
      <span class="eyebrow">${o.kind === "section" ? "In section" : "In lecture"}</span>
      <div class="hero-row"><${Tile} courseId=${o.cid} size=${44} /><div class="grow"><b>${course(app, o.cid).code}</b><small>${tShort(o.start)}–${tShort(o.end)}${o.where ? " · " + o.where : ""}</small></div>
        <div class="hero-cd"><small>ENDS IN</small><b class="tnum">${countdown(left)}</b></div></div>
      <div class="hero-bar"><i style=${{ width: pct * 100 + "%" }}></i></div>
      <div class="hero-acts"><button class="btn primary sm" onClick=${() => app.openCourse(o.cid)}><${Icon} name="chat" size=${16} />Class chat</button><button class="btn ghost sm" onClick=${() => app.open("task-new", { cid: o.cid })}><${Icon} name="plus" size=${16} />New task</button></div>
    </section>`;
  }
  if (H.s === "soon" || H.s === "starting") {
    const o = H.o, ms = o.start - now;
    return html`<section class="hero soon" style=${{ "--edge": courseLook(o.cid).hue }}>
      <span class="eyebrow">${H.s === "starting" ? html`<i class="pulse-dot"></i>Starting` : "Up next"}</span>
      <div class="hero-row"><${Tile} courseId=${o.cid} size=${44} /><div class="grow"><b>${course(app, o.cid).code} starts in ${Math.max(1, Math.ceil(ms / 60e3))} min</b><small>${tShort(o.start)}${o.where ? " · " + o.where : ""}</small></div></div>
      <div class="hero-acts"><button class="btn ghost sm" onClick=${() => app.openCourse(o.cid)}>Open chat</button></div>
    </section>`;
  }
  if (H.s === "later") {
    const o = H.o;
    return html`<button class="hero later" onClick=${() => app.openCourse(o.cid)} style=${{ "--edge": courseLook(o.cid).hue }}>
      <span class="eyebrow">Next</span><div class="hero-row"><${Tile} courseId=${o.cid} size=${40} /><div class="grow"><b>${course(app, o.cid).code} · ${tShort(o.start)}</b><small>${o.where || course(app, o.cid).title}</small></div><${Icon} name="chevronRight" size=${18} /></div></button>`;
  }
  if (H.s === "ended") {
    return html`<section class="hero"><span class="eyebrow">${course(app, H.o.cid).code} ended</span>
      <div class="hero-row"><div class="grow"><b>${H.next ? "Next: " + course(app, H.next.cid).code + " · " + (Sched.et(H.next.start).key === Sched.et(now).key ? tShort(H.next.start) : dayLabel(H.next.start) + " " + tShort(H.next.start)) : "That's it for today"}</b><small>Anything said in class is in the chat.</small></div>
      <button class="btn ghost sm" onClick=${() => app.openCourse(H.o.cid)}>Open chat</button></div></section>`;
  }
  const n = H.next;
  return html`<section class="hero quiet">
    <span class="chip-allday">${H.s === "done" ? "Done for today" : Sched.et(now).wd === 0 || Sched.et(now).wd === 6 ? "No classes · Weekend" : "No classes today"}</span>
    ${n ? html`<button class="hero-row hero-next" onClick=${() => app.openCourse(n.cid)}><${Tile} courseId=${n.cid} size=${36} /><div class="grow"><small>First class next</small><b>${course(app, n.cid).code} · ${dayLabel(n.start)} ${tShort(n.start)}</b></div><${Icon} name="chevronRight" size=${18} /></button>` : null}
  </section>`;
}

// Web build, organizer only: the few steps between "site is up" and "students are in the chat".
function OrgChecklist() {
  const app = useApp();
  const KEY = "roster:web:setup";
  const [seen, setSeen] = useState(() => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (_) { return {}; } });
  const [olink, setOlink] = useState(null);
  const mark = (k) => { const v = { ...seen, [k]: true }; setSeen(v); try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (_) { /* private mode */ } };
  const cid = app.myCourses.includes("stat110") ? "stat110" : app.myCourses.find((c) => Catalog.isCourse(c));
  const placed = (useCollection(() => app.db.collection("placements"), [app.db]) || []).filter((p) => !cid || (p.courses || []).includes(cid));
  if (seen.hidden || !cid) return null;
  const joined = placed.filter((p) => p.claimedBy).length;
  const code = course(app, cid).code;
  const demoLink = location.origin + location.pathname + "?demo";
  const cyc = (app.hubs[cid] && app.hubs[cid].cycles) || [];

    { k: "olink", done: seen.olink, t: "Save your organizer link", s: "Your way back in as the organizer on your phone or another browser. Keep it private.",

function useLiveEvents(app) {

}

// ---------------------------------------------------------------------------
// Calendar (time spec b/d). Desktop: a week grid like Notion Calendar/Google
// Calendar (overlaps split side by side, red now-line with a time label,
// all-day lane for deadlines). Phone: Apple Calendar's week strip over one
// day's timeline, or a list (Things' Upcoming). Your class times come from
// the catalog, and you can set or fix them (Saturn's schedule editor).
// ---------------------------------------------------------------------------
function calItems(app, from, to) {
  const now = Clock.now();
  const out = [], allDay = [];
  for (const o of Sched.occurrences(myMeetings(app), from, to)) {
    const c = course(app, o.cid);
    out.push({ key: "m" + o.cid + o.start + o.kind, start: o.start, end: o.end, cid: o.cid, kind: o.kind, title: c.code + (o.kind === "section" ? " · Section" : ""), sub: o.where || (o.kind === "section" ? "" : c.where) || "", run: () => app.openCourse(o.cid, o.kind === "section" ? "section" : "chat") });
  }
  for (const cid of app.myCourses) {
    for (const d of ((app.hubs[cid] && app.hubs[cid].due) || [])) if (d.at >= from && d.at < to) allDay.push({ key: "d" + cid + d.id, at: d.at, kind: "due", cid, title: d.title, sub: course(app, cid).code + " · " + tShort(d.at), tone: dueLadder(d.at).tone, run: () => app.openCourse(cid, "people") });
    for (const m of app.feeds[cid] || []) {
      if (m.kind !== "event" || !m.event || m.deleted || m.hidden) continue;
      const r = (m.event.rsvps || {})[app.uid];
      if (!r || !r.s || r.s === "no") continue;
      const ev = m.event, end = ev.end || ev.at + 2 * 3600e3;
      if (end > from && ev.at < to) out.push({ key: "e" + cid + m.id, start: ev.at, end, cid, kind: "event", rsvp: r.s, title: ev.title, sub: ev.where || "", run: () => app.open("event", { m, courseId: cid }) });
    }
  }
  for (const t of app.tasks) if (t.due && t.due >= from && t.due < to && !t.done) allDay.push({ key: "t" + t.id, at: t.due, kind: "task", cid: t.cid, title: t.title, sub: "Task · " + tShort(t.due), run: () => app.setRoute({ view: "tasks" }) });
  const norm = (t) => t.toLowerCase().replace(/\(.*?\)/g, "").replace(/[^a-z ]/g, "").trim().slice(0, 18);
  for (const d of Catalog.termDates) { const at = Date.parse(d.at); if (at >= from && at < to && !allDay.some((a) => Sched.et(a.at).key === Sched.et(at).key && norm(a.title) === norm(d.title))) allDay.push({ key: "td" + d.title, at, kind: "term", title: d.title, sub: d.kind === "holiday" ? "Harvard calendar" : "Registrar deadline", run: null }); }
  return { timed: out.sort((a, b) => a.start - b.start), allDay: allDay.sort((a, b) => a.at - b.at), now };
}
function useBoardGoing(app) {
  const board = useCollection(() => app.db.collection("board").orderBy("ts", "desc").limit(60), [app.db]) || [];
  return useMemo(() => board.filter((p) => !p.deleted && p.event && p.event.at && p.event.rsvps && p.event.rsvps[app.uid] && ["going", "maybe"].includes(p.event.rsvps[app.uid].s)), [board]);
}
function withBoard(app, items, board, from, to) {
  const extra = board.filter((p) => (p.event.end || p.event.at + 7200e3) > from && p.event.at < to).map((p) => ({ key: "b" + p.id, start: p.event.at, end: p.event.end || p.event.at + 7200e3, kind: "board", rsvp: p.event.rsvps[app.uid].s, title: p.title, sub: p.event.where || "", run: () => app.open("board-post", { id: p.id }) }));
  return [...items, ...extra].sort((a, b) => a.start - b.start);
}

// Overlap layout: cluster items that overlap, then greedy columns within a cluster.
function layoutDay(items) {
  const placed = [];
  let cluster = [], end = 0;
  const flush = () => {
    const cols = [];
    for (const it of cluster) {
      let c = cols.findIndex((last) => last <= it.start);
      if (c < 0) { c = cols.length; cols.push(0); }
      cols[c] = it.end;
      placed.push({ ...it, col: c });
    }
    for (const p of placed.slice(placed.length - cluster.length)) p.cols = cols.length;
    cluster = []; end = 0;
  };
  for (const it of items) { if (cluster.length && it.start >= end) flush(); cluster.push(it); end = Math.max(end, it.end); }
  if (cluster.length) flush();
  return placed;
}

function WeekStrip({ day, onPick }) {
  const app = useApp();
  const week = Sched.startOfWeek(day);
  const today = Sched.et(Clock.now()).key;
  const busy = useMemo(() => {
    const { timed, allDay } = calItems(app, week, Sched.addDays(week, 7));
    const s = {};
    for (const it of timed) s[Sched.et(it.start).key] = (s[Sched.et(it.start).key] || 0) + 1;
    for (const it of allDay) s[Sched.et(it.at).key] = (s[Sched.et(it.at).key] || 0) + 1;
    return s;
  }, [week, app.me, app.hubs, app.feeds, app.tasks]);
  return html`<div class="weekstrip" role="tablist" aria-label="Days this week">${Array.from({ length: 7 }, (_, i) => {
    const d = Sched.addDays(week, i), p = Sched.et(d), sel = p.key === Sched.et(day).key;
    return html`<button key=${p.key} role="tab" aria-selected=${sel} class=${"ws-d" + (sel ? " on" : "") + (p.key === today ? " today" : "")} onClick=${() => onPick(d)}>
      <small>${Sched.DAY_NAME[p.wd].slice(0, 1)}</small><b class="tnum">${p.d}</b><i class=${busy[p.key] ? "has" : ""}></i></button>`;
  })}</div>`;
}

const GRID_PX = 52; // per hour, Notion Calendar's density
function TimeGrid({ days, items, allDay }) {
  const app = useApp();
  const ref = useRef(null);
  const now = Clock.now();
  const mins = (ts) => { const p = Sched.et(ts); return p.h * 60 + p.mi; };
  const lo = Math.min(8 * 60, ...items.map((it) => Math.floor(mins(it.start) / 60) * 60));
  const hi = Math.max(22 * 60, ...items.map((it) => Math.min(24 * 60, Math.ceil((mins(it.end) || 1440) / 60) * 60)));
  const px = GRID_PX / 60;
  const todayKey = Sched.et(now).key;
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    const first = items.length ? Math.min(...items.map((it) => mins(it.start))) : 9 * 60;
    // Today in view: keep the now-line on screen (Notion Calendar opens at the current time).
    const target = days.some((d) => Sched.et(d).key === todayKey) ? Math.max(lo, mins(now) - el.clientHeight / px / 2) : first - 30;
    el.scrollTop = Math.max(0, (target - lo) * px);
  }, [days[0]]);
  const hours = [];
  for (let m = lo; m < hi; m += 60) hours.push(m);
  return html`<div class=${"tgrid" + (days.length === 1 ? " one" : "")}>
    ${days.length > 1 ? html`<div class="tg-head"><span class="tg-gut"></span>${days.map((d) => { const p = Sched.et(d); return html`<span key=${p.key} class=${"tg-dh" + (p.key === todayKey ? " today" : "")}><small>${Sched.DAY_NAME[p.wd].toUpperCase()}</small><b class="tnum">${p.d}</b></span>`; })}</div>` : null}
    ${allDay.length ? html`<div class="tg-allday"><span class="tg-gut"><small>all-day</small></span>${days.map((d) => {
      const k = Sched.et(d).key, list = allDay.filter((a) => Sched.et(a.at).key === k);
      return html`<span class="tg-adcol" key=${k}>${list.map((a) => html`<button key=${a.key} class=${"adchip " + a.kind + (a.tone ? " " + a.tone : "")} style=${a.cid ? { "--edge": courseLook(a.cid).hue, "--tint": courseLook(a.cid).tint } : null} onClick=${a.run || undefined} title=${a.title + " · " + a.sub}>
        <${Icon} name=${a.kind === "due" ? "flag" : a.kind === "task" ? "checkSquare" : "calendar"} size=${12} /><span>${a.title}</span></button>`)}</span>`;
    })}</div>` : null}
    <div class="tg-body" ref=${ref}>
      <div class="tg-inner" style=${{ height: (hi - lo) * px + "px" }}>
        <div class="tg-gut">${hours.map((m) => html`<span key=${m} class="tg-hr" style=${{ top: (m - lo) * px + "px" }}>${m === lo ? "" : Sched.fmtMin(m).replace(":00", "")}</span>`)}</div>
        <div class="tg-cols">
          ${hours.map((m) => html`<i key=${"l" + m} class="tg-line" style=${{ top: (m - lo) * px + "px" }}></i>`)}
          ${days.map((d) => {
            const k = Sched.et(d).key;
            const list = layoutDay(items.filter((it) => Sched.et(it.start).key === k));
            const isToday = k === todayKey;
            return html`<div class=${"tg-col" + (isToday ? " today" : "")} key=${k}>
              ${list.map((it) => {
                const top = (mins(it.start) - lo) * px, h = Math.max(22, ((it.end - it.start) / 60e3) * px - 2);
                const L = it.cid ? courseLook(it.cid) : null;
                const past = it.end < now, live = it.start <= now && it.end > now;
                return html`<button key=${it.key} class=${"tg-ev " + it.kind + (it.rsvp === "maybe" ? " maybe" : "") + (past ? " past" : "") + (live ? " live" : "") + (h < 40 ? " short" : "")}
                  style=${{ top: top + "px", height: h + "px", left: "calc(" + (it.col / it.cols) * 100 + "% + 2px)", width: "calc(" + 100 / it.cols + "% - 4px)", "--edge": L ? L.solid : "var(--ink-2)", "--tint": L ? L.tint : "var(--fill-2)", "--tx": L ? L.text : "var(--ink)" }}
                  onClick=${it.run} title=${it.title + " · " + tShort(it.start) + "–" + tShort(it.end) + (it.sub ? " · " + it.sub : "")}>
                  <b>${it.title}</b>${h >= 40 ? html`<small>${tShort(it.start)}${it.sub ? " · " + it.sub : ""}</small>` : null}</button>`;
              })}
              ${isToday ? html`<div class="tg-now" style=${{ top: (mins(now) - lo) * px + "px" }}><i></i></div>` : null}
            </div>`;
          })}
          ${days.some((d) => Sched.et(d).key === todayKey) ? html`<span class="tg-nowlabel tnum" style=${{ top: (mins(now) - lo) * px + "px" }}>${tShort(now).replace(/ (AM|PM)/, "")}</span>` : null}
        </div>
      </div>
    </div>
    ${!items.length && days.length === 1 ? html`<div class="tg-empty">${Sched.et(days[0]).wd % 6 === 0 ? "No classes on weekends." : "Nothing scheduled."}</div>` : null}
  </div>`;
}

function Agenda({ from, board }) {
  const app = useApp();
  const to = Sched.addDays(from, 21);
  const { timed, allDay } = calItems(app, from, to);
  const all = withBoard(app, timed, board, from, to);
  const now = Clock.now();
  const days = [];
  for (let d = from; d < to; d = Sched.addDays(d, 1)) {
    const k = Sched.et(d).key;
    const t = all.filter((it) => Sched.et(it.start).key === k), a = allDay.filter((it) => Sched.et(it.at).key === k);
    if (t.length || a.length || d === from) days.push({ d, k, t, a });
  }
  return html`<div class="scroller page-scroll"><div class="page-in agenda">
    ${days.map(({ d, k, t, a }) => html`<section key=${k} class="ag-day">
      <h2 class="ag-h"><b>${dayLabel(d) === "Today" || dayLabel(d) === "Tomorrow" ? dayLabel(d) : F.wd.format(d)}</b><span>${F.md.format(d)}</span></h2>
      <div class="group">
        ${a.map((it) => html`<button key=${it.key} class="ag-row allday" onClick=${it.run || undefined} disabled=${!it.run}>
          <span class="ag-time"><span class=${"flag " + (it.tone || "calm")}><${Icon} name=${it.kind === "due" ? "flag" : it.kind === "task" ? "checkSquare" : "calendar"} size=${14} /></span></span>
          <span class="grow ag-t"><b>${it.title}</b><small>${it.sub}</small></span>
          ${it.kind === "due" ? html`<span class=${"due-tone " + it.tone}>${dueLadder(it.at).text}</span>` : null}</button>`)}
        ${t.map((it) => {
          const past = it.end < now, live = it.start <= now && it.end > now;
          return html`<button key=${it.key} class=${"ag-row" + (past ? " past" : "") + (live ? " live" : "")} onClick=${it.run} style=${{ "--edge": it.cid ? courseLook(it.cid).hue : "var(--ink-3)" }}>
            <span class="ag-time tnum">${tShort(it.start)}<small>${tShort(it.end)}</small></span><span class="mrow-edge"></span>
            <span class="grow ag-t"><b>${it.title}</b><small>${[it.kind === "event" || it.kind === "board" ? (it.rsvp === "maybe" ? "Maybe" : "Going") : "", it.sub].filter(Boolean).join(" · ")}</small></span>
            ${live ? html`<span class="pill live">Now</span>` : past ? html`<${Icon} name="check" size=${16} />` : null}</button>`;
        })}
        ${!t.length && !a.length ? html`<div class="rowempty">Nothing scheduled today.</div>` : null}
      </div>
    </section>`)}
    <p class="muted sm center">Showing the next 3 weeks. Study sessions and Board events appear once you say you're going.</p>
  </div></div>`;
}
