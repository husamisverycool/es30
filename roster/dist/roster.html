const WEEKDAYS = [[1, "M"], [2, "Tu"], [3, "W"], [4, "Th"], [5, "F"]];
const minToInput = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
const inputToMin = (v) => { const [h, m] = (v || "0:0").split(":"); return +h * 60 + +m; };
function recurLink(app, cid, mt) {
  const c = course(app, cid);
  const first = Sched.occurrences([mt], Clock.now(), Clock.now() + 8 * 864e5)[0];
  if (!first) return null;
  const by = mt.d.map((d) => ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][d]).join(",");
  const base = calLinks(c.code + (mt.kind === "section" ? " section" : ""), first.start, first.end, c.title + (mt.where ? " · " + mt.where : ""));
  return base.google + "&recur=" + encodeURIComponent("RRULE:FREQ=WEEKLY;BYDAY=" + by + ";UNTIL=20261204T235959Z") + (mt.where ? "&location=" + encodeURIComponent(mt.where) : "");
}
function MeetingsSheet({ onClose }) {
  const app = useApp();
  const courses = app.myCourses.filter(Catalog.isCourse);
  const sched = (app.me && app.me.schedule) || {};
  const [edit, setEdit] = useState(null);
  const startEdit = (cid) => {
    const cur = sched[cid] && sched[cid].length ? sched[cid][0] : Sched.parseMeets(course(app, cid).meets, course(app, cid).where)[0];
    setEdit({ cid, d: cur ? cur.d : [2, 4], s: cur ? cur.s : 600, e: cur ? cur.e : 675, where: cur ? cur.where : "" });
  };
  const save = async () => {
    if (!edit.d.length || edit.e <= edit.s) { app.toast("Pick at least one day, and an end time after the start."); return; }
    const ok = await app.updateProfile({ schedule: { ...sched, [edit.cid]: [{ d: [...edit.d].sort(), s: edit.s, e: edit.e, where: edit.where.trim(), kind: "lecture" }] } }, course(app, edit.cid).code + " times saved");
    if (ok) setEdit(null);
  };
  if (edit) {
    const c = course(app, edit.cid);
    return html`<${Sheet} title=${c.code + " times"} onClose=${() => setEdit(null)} footer=${html`<button class="btn ghost" onClick=${() => setEdit(null)}>Cancel</button><button class="btn primary" onClick=${save}>Save</button>`}>
      <label class="field"><span>Days</span><div class="daypick">${WEEKDAYS.map(([d, l]) => html`<button key=${d} class=${"daychip" + (edit.d.includes(d) ? " on" : "")} aria-pressed=${edit.d.includes(d)} onClick=${() => setEdit({ ...edit, d: edit.d.includes(d) ? edit.d.filter((x) => x !== d) : [...edit.d, d] })}>${l}</button>`)}</div></label>
      <div class="field-row"><label class="field"><span>Starts</span><input class="input" type="time" step="300" value=${minToInput(edit.s)} onInput=${(e) => setEdit({ ...edit, s: inputToMin(e.target.value) })} /></label>
        <label class="field"><span>Ends</span><input class="input" type="time" step="300" value=${minToInput(edit.e)} onInput=${(e) => setEdit({ ...edit, e: inputToMin(e.target.value) })} /></label></div>
      <label class="field"><span>Where</span><input class="input" placeholder="Science Center Hall B" value=${edit.where} onInput=${(e) => setEdit({ ...edit, where: e.target.value })} /></label>
      <p class="muted sm">Only your calendar changes. Times from my.harvard are a starting point; fix them if your class moved.</p>
    <//>`;
  }
  return html`<${Sheet} title="Class times" icon="calendar" onClose=${onClose}>
    <div class="group">${courses.map((cid) => {
      const c = course(app, cid);
      const custom = sched[cid] && sched[cid].length;
      const mts = custom ? sched[cid] : Sched.parseMeets(c.meets, c.where);
      const sec = app.me && app.me.sections && app.me.sections[cid] && Catalog.slot(app.me.sections[cid]);
      const link = mts[0] ? recurLink(app, cid, mts[0]) : null;
      return html`<div class="mtrow" key=${cid}>
        <${Tile} courseId=${cid} size=${40} />
        <div class="grow mtrow-t"><b>${c.code}</b>
          <small>${mts.length ? mts.map((mt) => Sched.fmtMeeting(mt) + (mt.where ? " · " + mt.where : "")).join("; ") : "No times yet"}${custom ? " · edited" : ""}</small>
          ${sec ? html`<small>Section ${sec.label}</small>` : null}</div>
        ${link ? html`<a class="iconbtn sm" href=${link} target="_blank" rel="noopener noreferrer" aria-label=${"Add " + c.code + " to Google Calendar, repeating weekly"} title="Add to Google Calendar (repeats weekly)"><${Icon} name="calendarPlus" size=${18} /></a>` : null}
        <button class="btn sm soft" onClick=${() => startEdit(cid)}>${mts.length ? "Edit" : "Add"}</button>
      </div>`;
    })}</div>
    <p class="muted sm">Your classmates see your times only if you're friends, to find free time together.</p>
  <//>`;
}

function BoardNewSheet({ cat: cat0, onClose }) {

    setBusy(true);

    ${timed ? html`<div class="field-row"><label class="field"><span>Starts</span><input class="input" type="datetime-local" value=${at} onInput=${(e) => setAt(e.target.value)} /></label>
      <label class="field"><span>Length</span><select class="input" value=${dur} onChange=${(e) => setDur(+e.target.value)}>${[[30, "30 min"], [60, "1 hour"], [90, "1.5 hours"], [120, "2 hours"], [180, "3 hours"]].map(([v, l]) => html`<option value=${v}>${l}</option>`)}</select></label></div>
      <label class="field"><span>Where</span><input class="input" placeholder="Cabot Library, 3rd floor" value=${where} onInput=${(e) => setWhere(e.target.value)} /></label>` : null}
    <label class="field"><span>Details <small>optional</small></span><textarea class="input" rows="3" maxlength="600" placeholder=${PH[cat][1]} value=${body} onInput=${(e) => setBody(e.target.value)}></textarea></label>
    <input type="file" accept="image/*" hidden ref=${fileRef} onChange=${onFile} />
    ${preview ? html`<div class="imgprev"><img src=${preview} alt="" /><button class="iconbtn sm" onClick=${() => { setFile(null); setPreview(null); }} aria-label="Remove photo"><${Icon} name="x" size=${16} /></button></div>`
      : html`<button class="btn ghost" onClick=${() => fileRef.current && fileRef.current.click()}><${Icon} name="image" size=${18} />Add a photo</button>`}

// ---------------------------------------------------------------------------
// People: friends and who's free (Saturn), people who added you (Instagram's
// "Follow back"), suggestions from shared classes and your House, a
// directory, and profiles (Hinge's vitals + prompts, Saturn's schedule
// compare, Discord's mutual servers strip).

function personMeetings(app, m) { return Derive.meetingsOf(m, (id) => course(app, id)); }
function freeLabel(app, m, now) {
  const mt = personMeetings(app, m);
  const busy = Derive.busyAt(mt, now);
  if (busy) return { busy, text: "In " + course(app, busy.cid).code + " · free in " + inWords(busy.end - now), tone: "busy" };
  const next = Derive.nextOf(mt, now, 1);
  if (next && Sched.et(next.start).key === Sched.et(now).key) return { text: "Free until " + tShort(next.start), tone: "free" };
  return { text: "Free the rest of today", tone: "free" };
}

  const addedYou = app.members.filter((m) => m.id !== app.uid && m.following && m.following[app.uid] && !(me.following && me.following[m.id]));
  const sugg = useMemo(() => Derive.suggestions(me, app.members, app.uid).filter((x) => !x.addedYou).slice(0, 12), [app.members, me]);
  const st = me.status && me.status.e && me.status.until > now ? me.status : null;
  const withState = friends.map((m) => ({ m, f: freeLabel(app, m, now), st: m.status && m.status.e && m.status.until > now ? m.status : null }));
  const free = withState.filter((x) => x.f.tone === "free"), busy = withState.filter((x) => x.f.tone === "busy");
  const myIds = new Set(app.myCourses);
  const dir = q.trim() ? app.members.filter((m) => m.id !== app.uid && [m.displayName, m.house, m.concentration, m.year].join(" ").toLowerCase().includes(q.trim().toLowerCase()) && Object.keys(m.courses || {}).some((c) => myIds.has(c))).slice(0, 40) : [];

    <div class="scroller page-scroll"><div class="page-in">

      ${addedYou.length ? html`<section><h2 class="sec-h">Added you</h2><div class="group">${addedYou.map((m) => html`<${PersonRow} key=${m.id} m=${m} right=${html`<${FollowBtn} id=${m.id} sm=${true} back=${true} />`} />`)}</div></section>` : null}

// Saturn's "Me | Them" side-by-side day, with shared free blocks highlighted.
function Compare({ other, name }) {
  const app = useApp();
  const now = Clock.now();
  const week = Sched.startOfWeek(now);
  const todayIdx = (Sched.et(now).wd + 6) % 7;
  const [di, setDi] = useState(Math.min(4, todayIdx));
  const day = Sched.addDays(week, di);
  const mine = myMeetings(app), theirs = personMeetings(app, other);
  const together = Derive.freeTogether(mine, theirs, day);
  const lo = 8 * 60, hi = 22 * 60, px = 0.6;
  const occ = (mt) => Sched.occurrences(mt, Sched.startOfDay(day), Sched.addDays(day, 1));
  const mins = (ts) => { const q = Sched.et(ts); return q.h * 60 + q.mi; };
  const block = (o) => html`<span class="cmp-ev" key=${o.cid + o.start} style=${{ top: (mins(o.start) - lo) * px + "px", height: Math.max(16, ((o.end - o.start) / 60e3) * px - 2) + "px", "--edge": courseLook(o.cid).solid, "--tint": courseLook(o.cid).tint, "--tx": courseLook(o.cid).text }}><b>${course(app, o.cid).code}</b></span>`;
  return html`<section class="prof-sec"><h3 class="eyebrow">Free together</h3>
    <div class="seg days" role="tablist">${["M", "Tu", "W", "Th", "F"].map((l, i) => html`<button key=${l} role="tab" aria-selected=${di === i} class=${di === i ? "on" : ""} onClick=${() => setDi(i)}>${l}</button>`)}</div>
    <div class="freelist">${together.length ? together.map(([s, e]) => html`<span class="freechip" key=${s}>${tShort(s)}–${tShort(e)}</span>`) : html`<span class="muted sm">No shared free time between 8 AM and 10 PM.</span>`}</div>
    <div class="cmp">
      <div class="cmp-gut">${[9, 12, 15, 18, 21].map((h) => html`<span key=${h} style=${{ top: (h * 60 - lo) * px + "px" }}>${Sched.fmtMin(h * 60).replace(":00", "")}</span>`)}</div>
      <div class="cmp-col"><small class="cmp-h">You</small><div class="cmp-track" style=${{ height: (hi - lo) * px + "px" }}>${together.map(([s, e]) => html`<i class="cmp-free" key=${"f" + s} style=${{ top: (mins(s) - lo) * px + "px", height: ((e - s) / 60e3) * px + "px" }}></i>`)}${occ(mine).map(block)}</div></div>
      <div class="cmp-col"><small class="cmp-h">${name}</small><div class="cmp-track" style=${{ height: (hi - lo) * px + "px" }}>${together.map(([s, e]) => html`<i class="cmp-free" key=${"f" + s} style=${{ top: (mins(s) - lo) * px + "px", height: ((e - s) / 60e3) * px + "px" }}></i>`)}${occ(theirs).map(block)}</div></div>
    </div>
  </section>`;
}

// ---- status (Slack's status picker: emoji + text + "clear after") -------------------------
function StatusSheet({ onClose }) {

    <label class="field"><span>Clear after</span>

// Activity (Instagram/Threads activity: grouped actors, New / Earlier),
// Saved (Slack's Later), Tasks (Things 3: Today / Upcoming / Anytime /
// Logbook), and You (iOS Settings-style grouped lists).
// ---------------------------------------------------------------------------
const INBOX_COPY = {
  mention: (n) => html`<b>${n}</b> mentioned you`,
  reply: (n) => html`<b>${n}</b> replied to you`,
  reactions: (n, it) => html`<b>${n}</b> reacted ${it.emoji.join("")} to your message`,
  rsvp: (n) => html`<b>${n}</b> ${n.includes(" and ") ? "are" : "is"} going to your study session`,
  votes: (n) => html`<b>${n}</b> voted in your poll`,
  fix: () => html`<b>Your fix was applied.</b> Three classmates agreed`,
  recap: () => html`<b>New lecture recap</b> to check`,
  announce: () => html`<b>Announcement</b> from the organizer`,
};
function actorNames(app, ids) {
  const names = ids.map((id) => firstName(app.person(id).name));
  if (names.length <= 1) return names[0] || "Someone";
  if (names.length === 2) return names[0] + " and " + names[1];
  return names[0] + " and " + (names.length - 1) + " others";
}
function ActivityView() {
  const app = useApp();
  const [tab, setTab] = useState("you");
  const [seen] = useState(() => app.inboxSeen());
  const items = useMemo(() => Derive.inbox({ uid: app.uid, feeds: Object.fromEntries(Object.entries(app.feeds).filter(([, f]) => f)), fixes: app.fixes.map((f) => ({ ...f, appliedAt: appliedAt(f) })) }), [app.feeds, app.fixes]);
  useEffect(() => () => app.markInboxSeen(), []);
  const mine = items.filter((i) => i.kind !== "recap" && i.kind !== "announce");
  const other = items.filter((i) => i.kind === "recap" || i.kind === "announce");
  const list = tab === "you" ? mine : other;
  const fresh = list.filter((i) => i.ts > seen), today = list.filter((i) => i.ts <= seen && daysBetween(i.ts, Clock.now()) === 0), earlier = list.filter((i) => i.ts <= seen && daysBetween(i.ts, Clock.now()) > 0);
  const go = (it) => { const m = (app.feeds[it.cid] || []).find((x) => x.id === it.mid); app.openCourse(it.cid, it.kind === "recap" || it.kind === "fix" ? "recaps" : m && m.thread && m.thread !== "main" ? (m.thread.startsWith("sec-") ? "section" : "pset") : "chat", it.mid); };
  const Row = (it) => html`<button class=${"actrow" + (it.ts > seen ? " new" : "")} key=${it.id} onClick=${() => go(it)}>
    <span class="act-av">${it.actors.length ? html`<${Faces} ids=${it.actors.slice(0, 2)} size=${it.actors.length > 1 ? 30 : 40} max=${2} />` : html`<span class=${"act-ic k-" + it.kind}><${Icon} name=${it.kind === "fix" ? "checkCircle" : it.kind === "recap" ? "ai" : "megaphone"} size=${20} /></span>`}</span>
    <span class="grow act-t"><span>${INBOX_COPY[it.kind](actorNames(app, it.actors), it)} <span class="tm">${relShort(it.ts)}</span></span>
      ${it.text ? html`<small>“${(it.text || "").slice(0, 120)}”</small>` : null}</span>
    <${Tile} courseId=${it.cid} size=${28} />
  </button>`;
  const Group = (title, arr) => (arr.length ? html`<section key=${title}><h2 class="sec-h">${title}</h2><div class="group">${arr.map(Row)}</div></section>` : null);
  return html`<div class="page">
    <${PageHead} title="Activity"><${Seg} value=${tab} onChange=${setTab} label="Activity filter" options=${[["you", "For you", mine.filter((i) => i.ts > seen).length || null], ["class", "Recaps & news", other.filter((i) => i.ts > seen).length || null]]} /><//>

function TasksView() {
  const app = useApp();
  useTick(60000);
  const now = Clock.now();
  const [title, setTitle] = useState("");
  const [showDone, setShowDone] = useState(false);
  const open = app.tasks.filter((t) => !t.done);
  const endToday = Sched.addDays(Sched.startOfDay(now), 1);
  const today = open.filter((t) => t.due && t.due < endToday).sort((a, b) => a.due - b.due);
  const upcoming = open.filter((t) => t.due && t.due >= endToday).sort((a, b) => a.due - b.due);
  const anytime = open.filter((t) => !t.due).sort((a, b) => b.ts - a.ts);
  const done = app.tasks.filter((t) => t.done).sort((a, b) => b.done - a.done);
  // Due dates in your classes you haven't turned into tasks yet.
  const fromDue = [];
  for (const cid of app.myCourses) for (const d of ((app.hubs[cid] && app.hubs[cid].due) || [])) if (d.at > now && !app.tasks.some((t) => t.from === cid + ":" + d.id)) fromDue.push({ ...d, cid });
  fromDue.sort((a, b) => a.at - b.at);
  const add = async () => { const t = title.trim(); if (!t) return; setTitle(""); await app.addTask({ title: t, quiet: true }); };
  const Sec = (t, arr, icon) => (arr.length ? html`<section><h2 class="sec-h">${icon ? html`<${Icon} name=${icon} size=${18} fill=${true} />` : null}${t}</h2><div class="group">${arr.map((x) => html`<${TaskRow} key=${x.id} t=${x} />`)}</div></section>` : null);
  return html`<div class="page">
    <${PageHead} title="Tasks" sub=${open.length ? plural(open.length, "open task") : "All done"}><button class="iconbtn" onClick=${() => app.open("task-new")} aria-label="New task with a date"><${Icon} name="calendarPlus" size=${22} /></button><//>
    <div class="scroller page-scroll"><div class="page-in">
      ${app.canWrite ? html`<div class="quickadd"><${Icon} name="plus" size=${18} /><input class="grow" placeholder="New task" value=${title} onInput=${(e) => setTitle(e.target.value)} onKeyDown=${(e) => e.key === "Enter" && !e.isComposing && add()} aria-label="New task" />${title.trim() ? html`<button class="btn sm primary" onClick=${add}>Add</button>` : null}</div>` : null}
      ${Sec("Today", today, "star")}${Sec("Upcoming", upcoming)}${Sec("Anytime", anytime)}
      ${fromDue.length ? html`<section><h2 class="sec-h">From your classes</h2><div class="group">${fromDue.slice(0, 5).map((d) => html`<div class="taskrow ghost" key=${d.cid + d.id}>
        <span class="flag calm"><${Icon} name="flag" size=${14} /></span>
        <span class="grow taskrow-t"><b>${d.title}</b><small>${course(app, d.cid).code} · <span class=${"due-tone " + dueLadder(d.at).tone}>${dueLadder(d.at).text}</span></small></span>
        <button class="btn sm soft" onClick=${() => app.addTask({ title: "Start " + d.title, cid: d.cid, due: d.at, from: d.cid + ":" + d.id })}>Add</button></div>`)}</div></section>` : null}
      ${!open.length && !fromDue.length ? html`<${Empty} icon="checkSquare" title="Nothing to do">Add a task, or turn a due date in one of your classes into one.<//>` : null}
      ${done.length ? html`<button class="link logbook" onClick=${() => setShowDone(!showDone)}>${showDone ? "Hide" : "Show"} ${plural(done.length, "completed task")}</button>${showDone ? html`<div class="group">${done.map((t) => html`<${TaskRow} key=${t.id} t=${t} />`)}</div>` : null}` : null}
      <p class="fine">Tasks are private. Only you can see them.</p>
    </div></div>
  </div>`;
}

// ---- ⌘K palette (Linear / Raycast: grouped results, arrow keys, actions) -----------------------
function Palette({ scope, onClose }) {
  const app = useApp();
  const [q, setQ] = useState("");
  const [sc, setSc] = useState(scope || null);
  const [sel, setSel] = useState(0);
  const listRef = useRef(null);
  const commands = [
    ["Go to Now", "clock", "G N", () => app.setRoute({ view: "now" })], ["Go to Classes", "chats", "G C", () => app.setRoute({ view: "classes" })],
    ["Go to Calendar", "calendar", "G L", () => app.setRoute({ view: "calendar" })], ["Go to Board", "board", "G B", () => app.setRoute({ view: "board" })],
    ["Go to People", "users", "G P", () => app.setRoute({ view: "people" })], ["Go to Activity", "bell", "G A", () => app.setRoute({ view: "activity" })],
    ["Go to Tasks", "tasks", "G T", () => app.setRoute({ view: "tasks" })], ["Go to Saved", "bookmark", "G S", () => app.setRoute({ view: "saved" })],
    ["New task", "checkSquare", "", () => app.open("task-new")], ["Set a status", "smile", "", () => app.open("status")],
    ["Post to the Board", "board", "", () => app.open("board-new", {})], ["Add a class", "plus", "", () => app.open("add-classes")],
    ["Edit class times", "sliders", "", () => app.open("meetings")], ["Edit profile", "edit", "", () => app.open("edit-profile")],
    ["Keyboard shortcuts", "keyboard", "?", () => app.open("shortcuts")],
  ];
  const feeds = Object.fromEntries(Object.entries(app.feeds).filter(([cid, f]) => f && (!sc || cid === sc)));
  const res = useMemo(() => Derive.search(q, { feeds, members: sc ? [] : app.members.filter((m) => m.id !== app.uid), courses: sc ? [] : app.myCourses.map((c) => course(app, c)), nameOf: (id) => app.person(id).name }), [q, sc, app.feeds]);
  const ql = q.trim().toLowerCase();
  const cmds = sc ? [] : commands.filter(([l]) => !ql || l.toLowerCase().includes(ql)).slice(0, ql ? 5 : 8);
  const rows = [];
  if (!ql && !sc) app.myCourses.forEach((c) => rows.push({ g: "Classes", key: "c" + c, icon: null, tile: c, label: course(app, c).code, sub: course(app, c).title, run: () => app.openCourse(c) }));
  res.classes.forEach((c) => rows.push({ g: "Classes", key: "c" + c.id, tile: c.id, label: c.code, sub: c.title, run: () => app.openCourse(c.id) }));
  cmds.forEach(([l, ic, k, run]) => rows.push({ g: "Actions", key: "a" + l, icon: ic, label: l, kbd: k, run }));
  res.people.forEach((m) => rows.push({ g: "People", key: "p" + m.id, uid: m.id, label: m.displayName, sub: tagLine(m) + (m.concentration ? " · " + m.concentration : ""), run: () => app.open("profile", { uid: m.id }) }));
  res.messages.slice(0, 20).forEach(({ cid, m }) => rows.push({ g: "Messages", key: "m" + cid + m.id, uid: m.by, label: m.text || (m.poll && m.poll.question) || (m.event && m.event.title) || "Photo", sub: app.person(m.by).name + " · " + course(app, cid).code + " · " + relShort(m.ts), run: () => app.openCourse(cid, m.thread && m.thread !== "main" ? (m.thread.startsWith("sec-") ? "section" : "pset") : "chat", m.id) }));
  useEffect(() => setSel(0), [q, sc]);
  useEffect(() => { const el = listRef.current && listRef.current.querySelector(".pal-row.on"); if (el) el.scrollIntoView({ block: "nearest" }); }, [sel]);
  const go = (r) => { onClose(); setTimeout(r.run, 0); };
  const onKey = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setSel(Math.min(rows.length - 1, sel + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setSel(Math.max(0, sel - 1)); }
    else if (e.key === "Enter" && rows[sel]) { e.preventDefault(); go(rows[sel]); }
    else if (e.key === "Backspace" && !q && sc) setSc(null);
  };
  let lastG = null;
  return html`<${Sheet} bare label="Search" onClose=${onClose} size="palette">
    <div class="pal-in"><${Icon} name="search" size=${20} />${sc ? html`<span class="pal-scope">${course(app, sc).code}<button onClick=${() => setSc(null)} aria-label="Search everywhere"><${Icon} name="x" size=${12} /></button></span>` : null}
      <input class="grow" placeholder=${sc ? "Search this class" : "Search messages, people, classes…"} value=${q} onInput=${(e) => setQ(e.target.value)} onKeyDown=${onKey} autofocus aria-label="Search" />
      <kbd>esc</kbd></div>
    <div class="pal-list" ref=${listRef} role="listbox">
      ${rows.map((r, i) => {
        const head = r.g !== lastG ? html`<div class="pal-g" key=${"g" + r.g}>${r.g}</div>` : null;
        lastG = r.g;
        return html`${head}<button key=${r.key} role="option" aria-selected=${i === sel} class=${"pal-row" + (i === sel ? " on" : "")} onMouseMove=${() => sel !== i && setSel(i)} onClick=${() => go(r)}>
          ${r.tile ? html`<${Tile} courseId=${r.tile} size=${28} />` : r.uid ? html`<${Avatar} uid=${r.uid} size=${28} />` : html`<span class="pal-ic"><${Icon} name=${r.icon} size=${18} /></span>`}
          <span class="grow pal-t"><b>${r.label}</b>${r.sub ? html`<small>${r.sub}</small>` : null}</span>${r.kbd ? html`<kbd>${r.kbd}</kbd>` : i === sel ? html`<kbd>↵</kbd>` : null}</button>`;
      })}
      ${ql && !rows.length ? html`<div class="pal-empty">No results for “${q.trim()}”${sc ? html` in ${course(app, sc).code}. <button class="link" onClick=${() => setSc(null)}>Search everywhere</button>` : ""}</div>` : null}
    </div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> to move</span><span><kbd>↵</kbd> to open</span><span class="grow"></span><span>${res.messages.length ? plural(res.messages.length, "message") : ""}</span></div>
  <//>`;
}

  const look = courseLook(courseId);

  const max = Math.max(1, ...byDay);
  const cards = [
    html`<div class="st-c"><span class="st-k">${F.md.format(from)} – ${F.md.format(Sched.addDays(from, 6))}</span><h2>Your week in ${c.code}</h2><p class="st-big tnum">${W.messages}</p><p>messages from <b>${plural(W.people, "classmate")}</b></p></div>`,
    html`<div class="st-c"><span class="st-k">Busiest day</span><h2>${W.busiest ? ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][W.busiest.day] : "Quiet week"}</h2>
      <div class="st-bars">${byDay.map((n, d) => html`<span key=${d}><i style=${{ height: Math.max(4, (n / max) * 100) + "%" }} class=${W.busiest && (W.busiest.day + 6) % 7 === d ? "on" : ""}></i><small>${["M", "T", "W", "T", "F", "S", "S"][d]}</small></span>`)}</div>

    html`<div class="st-c"><span class="st-k">Most talked about</span>${W.topProblem ? html`<h2>Problem ${prettyProblem(W.topProblem.p)}</h2><p class="st-big tnum">${W.topProblem.n}</p><p>messages tagged with it</p>` : html`<h2>No tagged problems yet</h2>`}</div>`,
    html`<div class="st-c"><span class="st-k">Most reacted</span>${W.top ? html`<blockquote class="st-q"><${RichText} text=${W.top.m.text || (W.top.m.poll && W.top.m.poll.question) || "📷 Photo"} /></blockquote><p><b>${app.person(W.top.m.by).name}</b> · ${plural(W.top.n, "reaction")}</p>` : html`<h2>No reactions yet</h2>`}
      ${W.topEmoji.length ? html`<p class="st-emoji">${W.topEmoji.map(([e, n]) => html`<span key=${e}>${e}<small>${n}</small></span>`)}</p>` : null}</div>`,
    html`<div class="st-c"><span class="st-k">Recaps</span><h2>The class checked the AI</h2><p class="st-big tnum">${W.checks}</p><p>lines checked · <b>${plural(W.fixes, "fix", "fixes")}</b> suggested · ${plural(W.notes, "set")} of notes shared</p></div>`,
    html`<div class="st-c"><span class="st-k">You</span><h2>${W.mine ? "Your week" : "You mostly read this week"}</h2><p>${plural(W.mine, "message")} · ${plural(W.myReacts, "reaction")}${W.helped ? " · replied to " + plural(W.helped, "classmate") : ""}</p><p class="st-end">That's the week in ${c.code}.</p></div>`,
  ];
  useEffect(() => { if (paused) return; const t = setTimeout(() => (i < cards.length - 1 ? setI(i + 1) : null), 6000); return () => clearTimeout(t); }, [i, paused]);
  useEffect(() => { const k = (e) => { if (e.key === "ArrowRight") setI((x) => Math.min(cards.length - 1, x + 1)); if (e.key === "ArrowLeft") setI((x) => Math.max(0, x - 1)); if (e.key === "Escape") onClose(); }; window.addEventListener("keydown", k); return () => window.removeEventListener("keydown", k); }, []);

    <div class="st-body" key=${i}>${cards[i]}</div>

  </div>`;
}

  <//>`;
}

const PRIYA = { name: "Priya Raman", house: "Pforzheimer", year: "'29", concentration: "Neuroscience", courses: ["stat110", "lifesci1a", "expos20", "gened1079"], sections: { stat110: "w1630", lifesci1a: "r1500" }, color: "#2F7CC2", prompts: [{ q: "I usually start the pset…", a: "Wednesday after section, then I hit a wall on problem 3" }] };

function useCourseCounts() {
  const app = useApp();
  return useMemo(() => {
    const counts = {}, faces = {};
    for (const m of app.members) for (const cid of Object.keys(m.courses || {})) {
      if (m.id === app.uid) continue;
      counts[cid] = (counts[cid] || 0) + 1;
      (faces[cid] = faces[cid] || []).length < 3 && faces[cid].push(m.id);
    }
    return { counts, faces };
  }, [app.members]);
}

function CoursePicker({ picked, setPicked, exclude }) {
  const app = useApp();
  const [q, setQ] = useState("");
  const [paste, setPaste] = useState(null);
  const [scanBusy, setScanBusy] = useState(false);
  const [canScan, setCanScan] = useState(false);
  const fileRef = useRef(null);
  const { counts, faces } = useCourseCounts();
  useEffect(() => { if (app.sample) app.sample.limits().then((l) => setCanScan(!!(l && l.images))).catch(() => {}); }, [app.sample]);
  const results = Catalog.search(q);
  const code = Catalog.normalizeCode(q);
  const customId = code ? Catalog.idFromCode(code) : null;
  const has = (id) => picked.some((p) => p.id === id);
  const toggle = (id, extra) => setPicked(has(id) ? picked.filter((p) => p.id !== id) : [...picked, extra || { id }]);
  const fromText = (text) => {
    const found = new Map();
    const re = /\b([A-Z]{2,10})\s?(\d{1,4}[A-Z]{0,2})\b/g;
    let m;
    while ((m = re.exec(String(text).toUpperCase()))) {
      if (/^(FALL|SPRING|ROOM|HALL|TERM|CLASS|PM|AM|SEC)$/.test(m[1])) continue;
      const c = m[1] + " " + m[2];
      found.set(Catalog.idFromCode(c), c);
    }
    return [...found].map(([id, c]) => (Catalog.byId[id] ? { id } : { id, code: c }));
  };
  const addMany = (list) => {
    const next = [...picked];
    for (const it of list) if (!next.some((p) => p.id === it.id) && !(exclude || []).includes(it.id)) next.push(it);
    setPicked(next);
    app.toast(list.length ? "Found " + plural(list.length, "class", "classes") : "No course codes found. Try typing them.");
  };
  const scan = async (file) => {
    if (!file) return;
    setScanBusy(true);
    try {
      const codes = await app.sample.json("This image is a screenshot of a Harvard student's class schedule (for example from my.harvard). List every course code you can read, like \"STAT 110\" or \"LIFESCI 1A\". Reply with only a JSON array of strings.", { images: file, modelTier: "quick" });
      addMany(fromText((Array.isArray(codes) ? codes : []).join(" ")));
    } catch (e) {
      app.toast(e && e.code === "not_granted" ? "Scanning needs your OK to use Claude. Type your classes instead." : "Couldn't read that screenshot. Type your classes instead.");
    }
    setScanBusy(false);
  };
  const Row = (c, extra) => {
    const on = has(c.id), joined = (exclude || []).includes(c.id);
    return html`<button class=${"cres" + (on ? " on" : "")} key=${c.id} disabled=${joined} onClick=${() => toggle(c.id, extra)} aria-pressed=${on}>
      <${Tile} courseId=${c.id} size=${44} />
      <span class="grow cres-t"><b>${c.code}</b><small>${extra ? "Not in the starter list. Add it and a chat starts for it." : (c.short || c.title) + (c.meets && c.meets.includes(":") ? " · " + c.meets : "")}</small>
        ${counts[c.id] ? html`<span class="cres-who"><${Faces} ids=${faces[c.id]} size=${18} max=${3} /><span>${counts[c.id]} on Roster</span></span>` : null}</span>
      ${joined ? html`<span class="pill sm">Joined</span>` : html`<span class=${"addbtn" + (on ? " on" : "")}><${Icon} name=${on ? "check" : "plus"} size=${18} /></span>`}
    </button>`;
  };
  return html`<div class="picker">
    ${picked.length ? html`<div class="picked">${picked.map((p) => html`<span class="pickchip" key=${p.id}><${Tile} courseId=${p.id} size=${22} />${Catalog.get(p.id, { [p.id]: { code: p.code || p.id.toUpperCase() } }).code}<button onClick=${() => toggle(p.id)} aria-label=${"Remove " + (p.code || p.id)}><${Icon} name="x" size=${14} /></button></span>`)}</div>` : null}
    <div class="searchwrap"><${Icon} name="search" size=${18} /><input id="course-q" class="grow" placeholder="Search STAT 110, Expos, Gen Ed…" value=${q} onInput=${(e) => setQ(e.target.value)} autocomplete="off" aria-label="Search courses" />${q ? html`<button class="iconbtn sm" onClick=${() => setQ("")} aria-label="Clear"><${Icon} name="xCircle" size=${18} fill=${true} /></button>` : null}</div>
    <div class="altrow">
      <button class="chip" onClick=${() => setPaste(paste == null ? "" : null)}><${Icon} name="paste" size=${15} />Paste from my.harvard</button>
      ${canScan ? html`<button class="chip" disabled=${scanBusy} onClick=${() => fileRef.current && fileRef.current.click()}><${Icon} name="camera" size=${15} />${scanBusy ? "Reading…" : "Scan a screenshot"}</button>
        <input type="file" accept="image/png,image/jpeg,image/webp" ref=${fileRef} hidden onChange=${(e) => scan(e.target.files && e.target.files[0])} />` : null}
    </div>
    ${paste != null ? html`<div class="pastebox"><textarea id="paste-sched" class="input" rows="4" placeholder="Paste your schedule or shopping cart. Roster pulls out the course codes." value=${paste} onInput=${(e) => setPaste(e.target.value)}></textarea>
      <button class="btn sm primary" onClick=${() => { addMany(fromText(paste)); setPaste(null); }}>Find my classes</button></div>` : null}
    <div class="cresults">
      ${customId && !Catalog.byId[customId] ? Row({ id: customId, code }, { id: customId, code }) : null}
      ${results.map((c) => Row(c))}
    </div>
  </div>`;
}

const OB_STEPS = ["welcome", "classes", "verify", "name", "house", "conc", "sections", "prompts", "pledge", "friends", "build", "arrive"];
function Onboarding({ onDone }) {
  const app = useApp();
  const demo = app.demo;
  const placed = app.placement && app.placement.courses ? app.placement.courses.map((id) => ({ id })) : [];
  const [step, setStep] = useState(0);
  const [dir, setDir] = useState(1);
  const [picked, setPicked] = useState(demo ? PRIYA.courses.map((id) => ({ id })) : placed);
  const [name, setName] = useState(demo ? PRIYA.name : (app.placement && app.placement.name) || app.viewerName || "");
  const [orgBusy, setOrgBusy] = useState(false);
  const [setupChoice, setSetupChoice] = useState(null);
  const [color, setColor] = useState(demo ? PRIYA.color : SWATCHES[hash(app.uid || "") % SWATCHES.length]);
  const [photo, setPhoto] = useState("");
  const [year, setYear] = useState(demo ? PRIYA.year : "");
  const [house, setHouse] = useState(demo ? PRIYA.house : "");
  const [conc, setConc] = useState(demo ? PRIYA.concentration : "");
  const [sections, setSections] = useState(demo ? PRIYA.sections : {});
  const [prompts, setPrompts] = useState(demo ? PRIYA.prompts : []);
  const [following, setFollowing] = useState({});
  // The placement lookup can land after this screen mounts; preselect once it does.
  const placedKey = placed.map((p) => p.id).join(",");
  useEffect(() => { if (placedKey) setPicked((cur) => [...cur, ...placed.filter((p) => !cur.some((c) => c.id === p.id))]); }, [placedKey]);
  const [built, setBuilt] = useState(0);
  const [failed, setFailed] = useState(false);
  // Verified = a member of the organization that runs this class, not an invited guest.
  // Artifact: a member of the class's organization. Web build: on the organizer's class list (a placement link).
  const verified = demo || (app.web ? !!(app.placement && app.placement.token) || app.isOrganizerReal : !!app.uid && !app.viewerGuest);
  const key = OB_STEPS[step];
  const go = (n) => { setDir(n > step ? 1 : -1); setStep(n); };
  const next = () => go(step + 1), back = () => go(Math.max(0, step - 1));
  const courses = picked.filter((p) => Catalog.isCourse(p.id));
  const first = firstName(name.trim()) || "there";
  const skippable = ["conc", "sections", "prompts", "friends"].includes(key);

  const build = async () => {
    setFailed(false); setBuilt(0);
    app.setArriving(true);
    const tick = (n) => new Promise((r) => setTimeout(() => { setBuilt(n); r(); }, 380));
    await tick(1);
    const ok = await app.joinCourses({
      picked,
      sections,
      profile: { displayName: name.trim(), year, house, concentration: conc, color, photo, prompts: prompts.filter((p) => p.a && p.a.trim()), following, pledgeAt: Clock.now(), verified: verified ? (demo ? "harvard.edu" : app.web ? (app.isOrganizerReal ? "organizer" : "placed") : "org") : "" },
    });
    if (!ok) { setFailed(true); app.setArriving(false); return; }
    if (app.web && app.isOrganizerReal) for (const p of picked) await app.seedClass(p.id);
    for (let n = 2; n <= buildLines.length; n++) await tick(n);
    setTimeout(() => go(OB_STEPS.indexOf("arrive")), 450);
  };
  useEffect(() => { if (key === "build") build(); }, [key]);
  const { counts, faces } = useCourseCounts();
  const houseSpace = Catalog.houseId(house), yearSpace = Catalog.yearId(year);
  const buildLines = [
    ...courses.map((p) => "Joining " + Catalog.get(p.id, { [p.id]: { code: p.code || p.id.toUpperCase() } }).code + (counts[p.id] ? " · " + plural(counts[p.id], "classmate") : "")),
    houseSpace ? "Joining your House chat · " + Catalog.space(houseSpace).code : null,
    yearSpace ? "Joining " + Catalog.space(yearSpace).code : null,
    "Putting your classes on your calendar",
    "Pinning what's due this week",
  ].filter(Boolean);

  // ---- steps ----
  let body, cta = null;
  if (key === "welcome" && app.web && app.rt.hello && !app.rt.hello.hasOrganizer && !app.isOrganizerReal && setupChoice !== "student") {

      <div class="ob-tiles" aria-hidden="true">${["stat110"].map((id) => html`<span key=${id} class="ob-tile" style=${{ "--r": "-6deg", "--y": "0px", "--d": "0ms" }}><${Tile} courseId=${id} size=${84} /></span>`)}</div>

    cta = html`<button class="btn primary lg block" disabled=${orgBusy} onClick=${async () => { setOrgBusy(true); const ok = await app.claimOrganizer(); setOrgBusy(false); if (ok) { setPicked((cur) => (cur.some((c) => c.id === "stat110") ? cur : [{ id: "stat110" }, ...cur])); next(); } }}>${orgBusy ? "Setting up…" : "I'm running this class"}</button>

    body = html`<div class="ob-welcome">
      <div class="ob-tiles" aria-hidden="true">${["stat110", "lifesci1a", "expos20", "gened1079"].map((id, i) => html`<span key=${id} class="ob-tile" style=${{ "--r": [-12, 5, -4, 11][i] + "deg", "--y": [10, -6, 14, 0][i] + "px", "--d": i * 90 + "ms" }}><${Tile} courseId=${id} size=${72} /></span>`)}</div>

      </ul>
    </div>`;
    cta = html`<button class="btn primary lg block" onClick=${next}>Get started</button>
      ${app.live ? html`<button class="btn ghost block" onClick=${() => app.switchMode("demo")}>Just looking? Open the demo class</button>` : null}
      ${app.rt.webStatic ? html`<a class="staticnote" href="setup.html"><${Icon} name="info" size=${16} /><span class="grow"><b>Running a study?</b> This copy has no class server yet, so only the demo works. Here's how to switch the live class on.</span><${Icon} name="chevronRight" size=${14} /></a>` : null}

  return html`<div class="concpick">
    <div class="searchwrap"><${Icon} name="search" size=${18} /><input class="grow" placeholder="Search concentrations" value=${q} onInput=${(e) => setQ(e.target.value)} aria-label="Search concentrations" /></div>
    ${!q.trim() ? html`<div class="chips">${popular.map((c) => html`<button key=${c} class=${"chip" + (value === c ? " on" : "")} onClick=${() => onPick(c)}>${c}</button>`)}</div>` : null}
    <div class="group conclist">${list.map((c) => html`<button key=${c} class=${"radrow" + (value === c ? " on" : "")} onClick=${() => onPick(c)} aria-pressed=${value === c}><span class="grow">${c}</span><span class="radio"></span></button>`)}</div>
  </div>`;

// Hinge: pick a prompt, answer it, three slots; empty slots read "Select a prompt".
function PromptPicker({ prompts, setPrompts }) {
  const [editing, setEditing] = useState(null);
  const [draft, setDraft] = useState({ q: "", a: "" });
  const slots = [0, 1, 2].map((i) => prompts[i] || null);
  const used = prompts.map((p) => p.q);
  const open = (i) => { setEditing(i); setDraft(prompts[i] || { q: "", a: "" }); };
  const save = () => { const n = [...prompts]; n[editing] = { q: draft.q, a: draft.a.trim() }; setPrompts(n.filter((p) => p && p.q && p.a)); setEditing(null); };
  if (editing != null) {
    return html`<div class="promptedit-ob">
      ${!draft.q ? html`<div class="group">${Catalog.PROMPTS.filter((q) => !used.includes(q) || (prompts[editing] && prompts[editing].q === q)).map((q) => html`<button key=${q} class="setrow" onClick=${() => setDraft({ ...draft, q })}><span class="grow">${q}</span><${Icon} name="chevronRight" size=${16} /></button>`)}</div>`
        : html`<div class="promptcard edit"><button class="pc-q" onClick=${() => setDraft({ ...draft, q: "" })}>${draft.q} <${Icon} name="edit" size=${14} /></button>
          <textarea class="input" rows="3" maxlength="150" placeholder="Your answer" value=${draft.a} onInput=${(e) => setDraft({ ...draft, a: e.target.value })} autofocus></textarea><small class="muted">${150 - draft.a.length}</small></div>`}
      <div class="row-gap"><button class="btn ghost" onClick=${() => setEditing(null)}>Cancel</button>${draft.q ? html`<button class="btn primary" disabled=${!draft.a.trim()} onClick=${save}>Done</button>` : null}</div>
    </div>`;
  }
  return html`<div class="promptslots">${slots.map((p, i) => p ? html`<div class="promptcard" key=${i}><small>${p.q}</small><p>${p.a}</p><span class="pc-acts"><button class="iconbtn sm" onClick=${() => open(i)} aria-label="Edit prompt"><${Icon} name="edit" size=${16} /></button><button class="iconbtn sm" onClick=${() => setPrompts(prompts.filter((_, j) => j !== i))} aria-label="Remove prompt"><${Icon} name="x" size=${16} /></button></span></div>`
    : html`<button class="promptcard empty" key=${i} onClick=${() => open(prompts.length)}><small>Select a prompt</small><p>And write your own answer</p><span class="pc-plus"><${Icon} name="plus" size=${18} /></span></button>`)}</div>`;
}


// ---------------------------------------------------------------------------
// Organizer tools (AI + data spec): the research question measured from the
// log (verdict strip with icon + words, zoned meters, pace with a dashed
// projection, lurkers, light vs written contributions), recap drafting that
// streams line by line for Keep / Edit / Remove, dates & cycles, placement
// by email, a reports queue, announcements, and a pseudonymous export.
// ---------------------------------------------------------------------------
const pct = (v) => (v == null ? "—" : Math.round(v * 100) + "%");
const VERDICT = { success: ["check", "Success line met"], revise: ["warning", "Between the lines"], kill: ["x", "Below the kill line"], pending: ["clock", "Not measurable yet"] };
function Verdict({ v, text }) {
  const [ic, t] = VERDICT[v] || VERDICT.pending;
  return html`<span class=${"verdict " + v}><${Icon} name=${ic} size=${13} />${text || t}</span>`;
}

function OrganizerSheet({ courseId, tab: tab0, onClose }) {

    <nav class="tabs inset" role="tablist">${TABS.map(([k, l]) => html`<button key=${k} role="tab" aria-selected=${tab === k} class=${"tab" + (tab === k ? " on" : "")} onClick=${() => setTab(k)}>${l}</button>`)}</nav>
    ${app.demo ? html`<div class="org-demo"><${Icon} name="info" size=${16} />Demo data: example classmates in a simulated ${c.code} chat, one pset cycle after placement. In the live class these numbers come from real activity.</div>` : null}
    ${tab === "results" ? html`<${Results} courseId=${courseId} />` : null}

    ${tab === "mod" ? html`<${Moderation} courseId=${courseId} />` : null}
    ${tab === "announce" ? html`<${Announcer} courseId=${courseId} />` : null}
    ${tab === "export" ? html`<${Exporter} courseId=${courseId} />` : null}
  <//>`;
}

function useCourseLog(courseId) {
  const app = useApp();
  const [data, setData] = useState(null);
  const [n, setN] = useState(0);
  useEffect(() => {
    let alive = true;
    const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
    const safe = (p) => p.then(rows).catch(() => []);
    Promise.all([
      safe(app.db.collection("courses/" + courseId + "/messages").orderBy("ts", "asc").limit(2000).get()),
      safe(app.db.collection("courses/" + courseId + "/fixes").get()),
      safe(app.db.collection("courses/" + courseId + "/checks").limit(2000).get()),
      safe(app.db.collection("recaps/" + courseId + "/items").get()),
      safe(app.db.collection("members").get()),
      safe(app.db.collection("survey").get()),
      safe(app.db.collection("courses/" + courseId + "/stuck").get()),
      safe(app.db.collection("courses/" + courseId + "/notes").get()),
      app.db.doc("hub/" + courseId).get().then((s) => (s.exists ? s.data() : {})).catch(() => ({})),
    ]).then(([messages, fixes, checks, recaps, members, surveys, stuck, notes, hub]) => {
      if (alive) setData({ messages, fixes, checks, recaps, members, surveys: surveys.filter((s) => s.course === courseId), stuck, notes, hub });
    });
    return () => { alive = false; };
  }, [courseId, n]);
  return [data, () => setN((x) => x + 1)];
}

// Zoned meter: red below kill, amber between, green above success (Stripe Radar's risk bar).
function Meter({ v, kill, ok, proj }) {
  const w = (x) => Math.max(0, Math.min(100, x * 100)) + "%";
  return html`<div class="meter" aria-hidden="true">
    <span class="zone kill" style=${{ width: w(kill) }}></span><span class="zone mid" style=${{ left: w(kill), width: "calc(" + w(ok) + " - " + w(kill) + ")" }}></span><span class="zone ok" style=${{ left: w(ok), right: 0 }}></span>
    ${proj != null ? html`<span class="m-proj" style=${{ left: w(proj) }}></span>` : null}
    ${v != null ? html`<span class="m-val" style=${{ left: w(v) }}></span>` : null}
    <span class="m-tick" style=${{ left: w(kill) }}><small>${Math.round(kill * 100)}</small></span><span class="m-tick" style=${{ left: w(ok) }}><small>${Math.round(ok * 100)}</small></span>
  </div>`;
}

function Results({ courseId }) {
  const app = useApp();
  const [data, refresh] = useCourseLog(courseId);
  const [scope, setScope] = useState("placed");
  if (!data) return html`<div class="loading"><span class="dots"><i></i><i></i><i></i></span><span class="muted sm">Reading the chat log…</span></div>`;
  const cycles = (data.hub && data.hub.cycles) || [];
  if (cycles.length < 2) return html`<${Empty} icon="chart" title="Set your two pset cycles first">The research question compares cycle 1 with cycle 2. Add both under Dates.<//>`;
  const now = Clock.now();
  const placedOnly = scope === "placed" && data.members.some((m) => m.placement);
  const members = placedOnly ? data.members.filter((m) => m.placement || app.organizerIds.includes(m.id)) : data.members;
  const inScope = new Set(members.map((m) => m.id));
  const M = Metrics.compute({ courseId, members, messages: data.messages, fixes: data.fixes, checks: data.checks, recaps: data.recaps, cycles, organizerIds: app.organizerIds, now, stuck: data.stuck, notes: data.notes });
  const [c1, c2] = M.cycles;
  const elapsed2 = c2.started ? Math.min(1, (now - c2.start) / (c2.end - c2.start)) : 0;
  const pace = c2.started && !c2.finished && c1.studentMsgs && elapsed2 > 0.02 ? c2.studentMsgs / elapsed2 / c1.studentMsgs : null;
  const org = new Set(app.organizerIds);
  const days = [];
  for (let t = Sched.startOfDay(c1.start); t < c2.end; t = Sched.addDays(t, 1)) days.push({ t, n: 0, c2: t >= Sched.startOfDay(c2.start), future: t > now });
  for (const m of data.messages) {
    if (!m.by || org.has(m.by) || !inScope.has(m.by) || m.deleted || !["text", "photo", "poll", "event"].includes(m.kind)) continue;
    const i = days.findIndex((d, j) => m.ts >= d.t && (j === days.length - 1 || m.ts < days[j + 1].t));
    if (i >= 0) days[i].n++;
  }
  const maxN = Math.max(1, ...days.map((d) => d.n));
  const tally = (key, opts) => opts.map((o) => [o, data.surveys.filter((s) => (Array.isArray(s[key]) ? s[key].includes(o) : s[key] === o)).length]);
  const fixesPer = M.recaps.length ? M.recaps.reduce((a, r) => a + r.fixes, 0) / M.recaps.length : null;
  const LIGHT = [["react", "Reactions"], ["vote", "Poll votes"], ["rsvp", "RSVPs"], ["check", "Recap checks"], ["stuck", "“Stuck too”"], ["agree", "Fix votes"]];
  const WRITE = [["post", "Posts"], ["reply", "Replies"], ["fix", "Fixes"], ["note", "Notes"]];
  return html`<div class="dash">
    <div class="dash-q"><div class="grow"><b>Do placed students talk, and keep talking?</b>
      <small>${plural(M.placed, "student")} ${placedOnly ? "placed by you in" : "in"} ${course(app, courseId).code} · ${c1.label} ${F.md.format(c1.start)}–${F.md.format(c1.end)} · ${c2.label} ${F.md.format(c2.start)}–${F.md.format(c2.end)} · organizer excluded</small></div>
      ${data.members.some((m) => m.placement) ? html`<${Seg} value=${placedOnly ? "placed" : "all"} onChange=${setScope} label="Who counts" options=${[["placed", "Placed by you"], ["all", "Everyone who joined"]]} />` : null}
      <button class="btn sm ghost" onClick=${refresh}><${Icon} name="history" size=${15} />Refresh</button></div>

    <div class="kpis">
      <div class="kpi">
        <span class="kpi-k">Posted, replied or reacted in ${c1.label}</span>
        <span class="kpi-v tnum">${pct(c1.rate)}<small>${c1.contributors} of ${c1.placed}</small></span>
        <${Meter} v=${c1.rate} kill=${0.15} ok=${0.35} />
        <${Verdict} v=${c1.started ? M.verdicts.contribution : "pending"} text=${!c1.finished && c1.started ? "In progress" : null} />
        <span class="kpi-n">Counting only people who wrote something: <b>${pct(c1.writerRate)}</b> (${c1.writers}).</span>
      </div>
      <div class="kpi">
        <span class="kpi-k">${c2.label} messages as a share of ${c1.label}</span>
        <span class="kpi-v tnum">${pct(M.retention)}<small>${c2.studentMsgs} vs ${c1.studentMsgs}</small></span>
        <${Meter} v=${M.retention} proj=${pace} kill=${0.25} ok=${0.5} />
        <${Verdict} v=${c2.finished ? M.verdicts.retention : pace == null ? "pending" : pace >= 0.5 ? "success" : pace < 0.25 ? "kill" : "revise"} text=${c2.finished ? null : pace != null ? "On pace for " + pct(pace) : null} />
        <span class="kpi-n">${c2.finished ? "Final." : c2.started ? Math.round(elapsed2 * 100) + "% of " + c2.label + " has passed. Dashed mark = projection at this pace." : "Starts " + dueWhen(c2.start) + "."}</span>
      </div>
      <div class="kpi sm">
        <span class="kpi-k">Fixes per AI recap</span>
        <span class="kpi-v tnum">${fixesPer == null ? "—" : fixesPer.toFixed(1)}</span>
        <${Verdict} v=${M.verdicts.corrections} />

        <tr class="sub"><td>Top 3 posters' share</td>${[c1, c2].map((c) => html`<td class="num">${pct(c.top3Share)}</td>`)}</tr>

    ${M.recaps.length ? html`<section class="dcard"><div class="dcard-h"><b>Recaps</b></div><table class="tbl"><thead><tr><th>Lecture</th><th class="num">Fixes</th><th class="num">Agreements</th></tr></thead>
      <tbody>${[...M.recaps].sort((a, b) => a.lecture - b.lecture).map((r) => html`<tr key=${r.id}><td>${r.lecture} · ${r.title}</td><td class="num">${r.fixes}</td><td class="num">${r.agrees}</td></tr>`)}</tbody></table></section>` : null}

      : html`<p class="muted sm">The survey card appears on every student's class page once ${c1.label} ends.</p>`}</section>
  </div>`;
}

// ---- recap drafting: stream, then Keep / Edit / Remove per line ----------------------------------
// Demo only: raw notes an organizer might paste, so the drafting flow can be tried end to end.
const EXAMPLE_NOTES = "L10 (example notes)\nIndicator r.v.s again. I_A = 1 if A occurs else 0. E[I_A] = P(A), the fundamental bridge. Slide 4.\nMatching problem: n people, n hats, shuffled. I_j = 1 if person j gets own hat. E[# matches] = n * (1/n) = 1, no matter n. Slide 6.\nLOTUS: E[g(X)] = sum over x of g(x) P(X = x). You don't need the PMF of g(X). Slide 11.\nVariance: Var(X) = E[(X - EX)^2] = E[X^2] - (EX)^2. Slide 14.\nVar(X + c) = Var(X), Var(cX) = c^2 Var(X). Variance is NOT linear in general.\nPoisson preview at the very end, more next time.";
function RecapComposer({ courseId, onDone }) {
  const app = useApp();
  const c = course(app, courseId);
  const [lecture, setLecture] = useState("");
  const [date, setDate] = useState(toLocalInput(Clock.now()));
  const [title, setTitle] = useState("");
  const [sections, setSections] = useState("");
  const [notes, setNotes] = useState("");
  const [lines, setLines] = useState([]);
  const [busy, setBusy] = useState(false);
  const [streamN, setStreamN] = useState(0);
  const ctl = useRef(null);
  useEffect(() => {
    app.db.collection("recaps/" + courseId + "/items").get().then((s) => setLecture(String(s.docs.reduce((m, d) => Math.max(m, d.data().lecture || 0), 0) + 1))).catch(() => setLecture("1"));
  }, [courseId]);
  const words = notes.trim() ? notes.trim().split(/\s+/).length : 0;
  const draft = async () => {
    if (!app.sample) return;
    ctl.current = new AbortController();
    setBusy(true); setStreamN(0); setLines([]);
    const prompt = "You are drafting a lecture recap for a student-run class group chat for " + c.code + (c.title ? " (" + c.title + ")" : "") + " at Harvard.\n" +
      "Use ONLY the organizer's notes below. Do not add facts, examples or formulas that are not in the notes. Keep the course's own notation exactly as the notes write it, even if other textbooks differ. Write math between $ signs in LaTeX.\n" +
      "Reply with only JSON: {\"title\": short lecture title, \"bullets\": [{\"text\": one plain sentence of at most 30 words, \"ref\": the slide, timestamp or section the notes tie it to, or \"\"}]} with 4 to 6 bullets.\n\nNotes:\n\"\"\"\n" + notes.slice(0, 20000) + "\n\"\"\"";
    try {
      const out = await app.sample.json(prompt, { signal: ctl.current.signal, onText: ({ text }) => setStreamN((text.match(/"text"\s*:/g) || []).length) });
      if (out && Array.isArray(out.bullets)) {
        setLines(out.bullets.slice(0, 8).map((b, i) => ({ id: "b" + (i + 1), text: String(b.text || "").trim(), ref: String(b.ref || "").trim(), st: "new" })).filter((b) => b.text));
        if (!title && out.title) setTitle(String(out.title));
      } else app.toast("Claude's draft didn't come back as a list. Try again or write the lines yourself.");
    } catch (e) {
      if (e && e.code === "cancelled") { /* stopped */ }
      else if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) app.toast("Claude isn't available on this view. Write the lines yourself below.");
      else if (e && e.code === "rate_limited") app.toast("Too many requests right now. Try again in a minute.");
      else app.toast("The draft didn't finish. Try again, or write the lines yourself.");
    }
    setBusy(false);
  };
  const setL = (i, patch) => setLines(lines.map((b, j) => (j === i ? { ...b, ...patch } : b)));
  const kept = lines.filter((b) => b.st !== "removed" && b.text.trim());
  const unreviewed = lines.filter((b) => b.st === "new").length;
  const post = async () => {
    const clean = kept.map((b, i) => ({ id: "b" + (i + 1), text: b.text.trim(), ref: (b.ref || "").trim() }));
    const ok = await app.postRecap(courseId, { lecture: Number(lecture) || 1, title: title.trim(), sections: sections.trim(), date: fromLocalInput(date) || Clock.now(), bullets: clean });
    if (ok) onDone();
  };
  const status = busy ? (streamN ? "Drafting line " + (streamN + 1) + "…" : "Reading your notes (" + plural(words, "word") + ")…") : "";
  return html`<div class="dash">
    <div class="field-row four">
      <label class="field"><span>Lecture</span><input class="input" inputmode="numeric" value=${lecture} onInput=${(e) => setLecture(e.target.value)} /></label>
      <label class="field"><span>Date</span><input class="input" type="datetime-local" value=${date} onInput=${(e) => setDate(e.target.value)} /></label>
      <label class="field"><span>Title</span><input class="input" value=${title} onInput=${(e) => setTitle(e.target.value)} placeholder="Expectation & Linearity" /></label>
      <label class="field"><span>Textbook sections</span><input class="input" value=${sections} onInput=${(e) => setSections(e.target.value)} placeholder="§4.1–4.3" /></label>
    </div>
    ${app.demo && !notes ? html`<div class="org-demo"><${Icon} name="note" size=${16} /><span class="grow">Try it with an organizer's raw notes from a lecture.</span><button class="btn sm soft" onClick=${() => setNotes(EXAMPLE_NOTES)}>Use example notes</button></div>` : null}
    <label class="field"><span>Your lecture notes, slide text or transcript <small>${words ? plural(words, "word") : ""}</small></span>
      <textarea class="input" rows="7" value=${notes} onInput=${(e) => setNotes(e.target.value)} placeholder="Paste what you wrote down. Claude drafts only from this, so it can't invent what wasn't said."></textarea></label>
    <div class="row-gap">
      ${app.sample ? html`<button class="btn primary" disabled=${busy || words < 20} onClick=${draft}><${Icon} name="ai" size=${17} />${lines.length ? "Draft again" : "Draft with Claude"}</button>` : html`<span class="muted sm">Claude isn't available on this view. Write the lines yourself.</span>`}
      ${busy ? html`<button class="btn ghost" onClick=${() => ctl.current && ctl.current.abort()}>Stop</button><span class="shimmer">${status}</span>` : null}
      <button class="btn ghost" onClick=${() => setLines([...lines, { id: "b" + (lines.length + 1), text: "", ref: "", st: "edit" }])}><${Icon} name="plus" size=${17} />Add a line</button>
    </div>
    ${lines.length ? html`<section class="dcard"><div class="dcard-h"><b>Check every line against your notes</b><span class="muted sm">${unreviewed ? unreviewed + " to review" : "All reviewed"}</span></div>
      <ol class="draftlist">${lines.map((b, i) => html`<li key=${b.id + i} class=${"dl " + b.st}>
        ${b.st === "edit" ? html`<div class="dl-edit"><textarea class="input" rows="2" value=${b.text} onInput=${(e) => setL(i, { text: e.target.value })} aria-label=${"Line " + (i + 1)} autofocus></textarea>
            <input class="input" value=${b.ref} onInput=${(e) => setL(i, { ref: e.target.value })} placeholder="Slide 14" aria-label="Reference" /></div>`
          : html`<div class="dl-t"><span class="recap-text"><${RichText} text=${b.text} /></span>${b.ref ? html`<span class="srcchip">${b.ref}</span>` : null}</div>`}
        <div class="dl-acts">
          ${b.st === "edit" ? html`<button class="yn on" onClick=${() => setL(i, { st: "kept" })}>Done</button>`
            : b.st === "removed" ? html`<button class="yn" onClick=${() => setL(i, { st: "new" })}>Undo</button>`
            : html`<button class=${"yn" + (b.st === "kept" ? " on" : "")} onClick=${() => setL(i, { st: "kept" })}><${Icon} name="check" size=${14} />Keep</button><button class="yn" onClick=${() => setL(i, { st: "edit" })}><${Icon} name="edit" size=${14} />Edit</button><button class="yn" onClick=${() => setL(i, { st: "removed" })}><${Icon} name="x" size=${14} />Remove</button>`}
        </div></li>`)}</ol></section>` : null}
    <div class="row-end"><span class="muted sm grow">${kept.length ? plural(kept.length, "line") + " will post, marked as an AI draft." : ""}</span>
      <button class="btn primary" disabled=${!title.trim() || !kept.length || unreviewed > 0} onClick=${post}>${unreviewed ? "Review " + plural(unreviewed, "line") + " first" : "Post recap to " + c.code}</button></div>
  </div>`;
}

function HubEditor({ courseId }) {
  const app = useApp();
  const hub = useDocData(() => app.db.doc("hub/" + courseId), [courseId]);
  const threads = useCollection(() => app.db.collection("courses/" + courseId + "/threads"), [courseId]);
  const [form, setForm] = useState(null);
  const [newT, setNewT] = useState({ title: "", due: "", problems: "" });
  useEffect(() => {
    if (hub === null || form) return;
    const h = hub || {};
    const def = Clock.now();
    setForm({
      due: (h.due || []).map((d) => ({ ...d, at: toLocalInput(d.at) })),
      cycles: (h.cycles && h.cycles.length ? h.cycles : [{ id: "c1", label: "PSet 1", start: def, end: def + 7 * 864e5 }, { id: "c2", label: "PSet 2", start: def + 7 * 864e5, end: def + 14 * 864e5 }]).map((c) => ({ ...c, start: toLocalInput(c.start), end: toLocalInput(c.end) })),
      rules: (h.rules || ["Collaboration follows the course syllabus: talk through ideas, write up your own solutions.", "No posting solutions or answers to graded problems.", "This chat is run by a student. Course staff are not in it."]).join("\n"),
      links: (h.links || []).map((l) => l.title + " | " + l.url).join("\n"),
    });
  }, [hub]);
  if (!form) return html`<div class="loading"><span class="dots"><i></i><i></i><i></i></span></div>`;
  const upd = (k, i, f, v) => setForm({ ...form, [k]: form[k].map((x, j) => (j === i ? { ...x, [f]: v } : x)) });
  const save = async () => {
    const data = {
      ...(hub || {}),
      due: form.due.filter((d) => d.title.trim() && d.at).map((d, i) => ({ id: d.id || "d" + Date.now().toString(36) + i, title: d.title.trim(), at: fromLocalInput(d.at), where: (d.where || "").trim() })),
      cycles: form.cycles.map((c, i) => ({ id: "c" + (i + 1), label: c.label.trim() || "Cycle " + (i + 1), start: fromLocalInput(c.start), end: fromLocalInput(c.end) })),
      rules: form.rules.split("\n").map((s) => s.trim()).filter(Boolean),
      links: form.links.split("\n").map((s) => s.split("|")).filter((p) => p.length >= 2 && /^https?:\/\//.test(p.slice(1).join("|").trim())).map((p, i) => ({ id: "l" + i, title: p[0].trim(), url: p.slice(1).join("|").trim() })),
    };
    delete data.id;
    await app.write(() => app.db.doc("hub/" + courseId).set(data), "Saved. Everyone in the class sees the new dates.");
  };
  const addThread = async () => {
    const due = fromLocalInput(newT.due);
    const id = (newT.title.trim().toLowerCase().replace(/[^a-z0-9]+/g, "") || "pset") + "-" + Date.now().toString(36).slice(-4);
    const ok = await app.write(() => app.db.doc("courses/" + courseId + "/threads/" + id).set({ title: newT.title.trim(), kind: "pset", due, problems: newT.problems.split(/[,\s]+/).map((s) => s.trim().toLowerCase().replace(/[()]/g, "")).filter(Boolean), ts: Clock.now(), by: app.uid }), "PSet board added.");
    if (ok) setNewT({ title: "", due: "", problems: "" });
  };
  return html`<div class="dash">
    <section class="dcard"><div class="dcard-h"><b>Pinned due dates</b></div>
      ${form.due.map((d, i) => html`<div class="erow" key=${i}>
        <input class="input" value=${d.title} placeholder="PSet 5" onInput=${(e) => upd("due", i, "title", e.target.value)} aria-label="Title" />
        <input class="input" type="datetime-local" value=${d.at} onInput=${(e) => upd("due", i, "at", e.target.value)} aria-label="Due" />
        <input class="input" value=${d.where || ""} placeholder="Gradescope" onInput=${(e) => upd("due", i, "where", e.target.value)} aria-label="Where" />
        <button class="iconbtn sm" onClick=${() => setForm({ ...form, due: form.due.filter((_, j) => j !== i) })} aria-label="Remove"><${Icon} name="x" size=${16} /></button></div>`)}
      <button class="btn sm ghost" onClick=${() => setForm({ ...form, due: [...form.due, { title: "", at: "", where: "" }] })}><${Icon} name="plus" size=${15} />Add a date</button></section>
    <section class="dcard"><div class="dcard-h"><b>Experiment cycles</b><span class="muted sm">Cycle 1 = the first full pset after placement; cycle 2 = the next, with no prompting. Avoid midterm week.</span></div>
      ${form.cycles.map((c, i) => html`<div class="erow three" key=${i}>
        <input class="input" value=${c.label} onInput=${(e) => upd("cycles", i, "label", e.target.value)} aria-label=${"Cycle " + (i + 1) + " label"} />
        <input class="input" type="datetime-local" value=${c.start} onInput=${(e) => upd("cycles", i, "start", e.target.value)} aria-label="Start" />
        <input class="input" type="datetime-local" value=${c.end} onInput=${(e) => upd("cycles", i, "end", e.target.value)} aria-label="End" /></div>`)}</section>
    <div class="field-row">
      <label class="field"><span>Pinned rules, one per line</span><textarea class="input" rows="4" value=${form.rules} onInput=${(e) => setForm({ ...form, rules: e.target.value })}></textarea></label>
      <label class="field"><span>Links: “Title | https://…”</span><textarea class="input" rows="4" value=${form.links} onInput=${(e) => setForm({ ...form, links: e.target.value })} placeholder="Course site | https://stat110.hsites.harvard.edu"></textarea></label>
    </div>
    <div class="row-end"><button class="btn primary" onClick=${save}>Save dates & cycles</button></div>
    <section class="dcard"><div class="dcard-h"><b>PSet boards</b></div>
      ${(threads || []).sort((a, b) => (a.due || 0) - (b.due || 0)).map((t) => html`<div class="setrow static" key=${t.id}><span class="grow"><b>${t.title}</b><small> · due ${t.due ? dueWhen(t.due) : "—"} · ${(t.problems || []).map(prettyProblem).join(", ")}</small></span></div>`)}
      <div class="erow">
        <input class="input" value=${newT.title} placeholder="PSet 6" onInput=${(e) => setNewT({ ...newT, title: e.target.value })} aria-label="PSet title" />
        <input class="input" type="datetime-local" value=${newT.due} onInput=${(e) => setNewT({ ...newT, due: e.target.value })} aria-label="Due" />
        <input class="input" value=${newT.problems} placeholder="1, 2, 3a, 3b, 4" onInput=${(e) => setNewT({ ...newT, problems: e.target.value })} aria-label="Problems" />
        <button class="btn sm primary" disabled=${!newT.title.trim() || !newT.due} onClick=${addThread}>Add</button></div></section>
  </div>`;
}

// ---- placement: pick people from the organization's directory (user.search) -------------------
function Placement({ courseId }) {
  const app = useApp();
  return app.web ? html`<${WebPlacement} courseId=${courseId} />` : html`<${DirectoryPlacement} courseId=${courseId} />`;
}
function DirectoryPlacement({ courseId }) {
  const app = useApp();
  const [q, setQ] = useState("");
  const [hits, setHits] = useState([]);
  const [picked, setPicked] = useState([]);
  const [also, setAlso] = useState([]);
  const [done, setDone] = useState(null);
  const [busy, setBusy] = useState(false);
  const existing = useCollection(() => app.db.collection("placements"), [app.db]) || [];
  const placedHere = existing.filter((p) => (p.courses || []).includes(courseId));
  const others = app.myCourses.filter((c) => Catalog.isCourse(c) && c !== courseId);
  const search = async (v) => {
    setQ(v); setDone(null);
    if (app.demo) { const t = v.trim().toLowerCase(); setHits(t ? Object.entries(Demo.people).filter(([, p]) => p.name.toLowerCase().includes(t)).slice(0, 8).map(([id, p]) => ({ id, name: p.name, avatarUrl: "" })) : []); return; }
    if (!app.rt.user) return;
    const r = await app.rt.user.search(v);
    setHits((r || []).filter((p) => !p.isMe));
  };
  const toggle = (p) => setPicked(picked.some((x) => x.id === p.id) ? picked.filter((x) => x.id !== p.id) : [...picked, p]);
  const go = async () => {
    setBusy(true);
    const n = await app.placePeople(picked.map((p) => p.id), [courseId, ...also]);
    setBusy(false); setDone(n);
    if (n) setPicked([]);
  };
  return html`<div class="dash">
    <p class="lead">Pick the students who signed up. The next time they open Roster, they start already placed in ${course(app, courseId).code}${also.length ? " and " + also.map((c) => course(app, c).code).join(", ") : ""}: no link to find.</p>
    <div class="searchwrap"><${Icon} name="search" size=${18} /><input class="grow" placeholder="Search people by name" value=${q} onInput=${(e) => search(e.target.value)} onFocus=${() => !q && search("")} aria-label="Search people" /></div>
    ${hits.length ? html`<div class="group">${hits.map((p) => {
      const on = picked.some((x) => x.id === p.id), already = placedHere.some((x) => x.id === p.id);
      return html`<div class="prow static" key=${p.id}>${p.avatarUrl ? html`<img class="av" style=${{ width: "36px", height: "36px" }} src=${p.avatarUrl} alt="" />` : html`<${Avatar} uid=${p.id} size=${36} name=${p.name} />`}
        <span class="grow prow-t"><b>${p.name}</b>${p.guest ? html`<small>Guest</small>` : already ? html`<small>Already placed here</small>` : null}</span>
        <button class=${"btn sm " + (on ? "ghost" : "primary")} disabled=${already} onClick=${() => toggle(p)}>${on ? html`<${Icon} name="check" size=${15} />Picked` : "Pick"}</button></div>`;
    })}</div>` : q.trim() ? html`<p class="muted sm">No one in your organization matches “${q.trim()}”.</p>` : null}
    ${picked.length ? html`<div class="picked">${picked.map((p) => html`<span class="pickchip" key=${p.id}><${Avatar} uid=${p.id} size=${22} name=${p.name} />${p.name}<button onClick=${() => toggle(p)} aria-label=${"Remove " + p.name}><${Icon} name="x" size=${14} /></button></span>`)}</div>` : null}
    ${others.length ? html`<div class="field"><span>Also place them in</span><div class="chips">${others.map((c) => html`<button key=${c} class=${"chip" + (also.includes(c) ? " on" : "")} onClick=${() => setAlso(also.includes(c) ? also.filter((x) => x !== c) : [...also, c])}>${course(app, c).code}</button>`)}</div></div>` : null}

// Web build: one personal link per student (?p=…). Opening it lands them in the class chat,

function WebPlacement({ courseId }) {
  const app = useApp();
  const code = course(app, courseId).code;
  const [text, setText] = useState("");
  const [also, setAlso] = useState([]);
  const [busy, setBusy] = useState(false);
  const [olink, setOlink] = useState(null);

  const others = app.myCourses.filter((c) => Catalog.isCourse(c) && c !== courseId);
  const people = text.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => { const [n, ...rest] = l.split(/[,\t]/); return { name: n.trim(), contact: rest.join(",").trim() }; }).filter((p) => p.name);
  const link = (t) => app.rt.remote.placementLink(t);
  const copy = (txt, msg) => navigator.clipboard.writeText(txt).then(() => app.toast(msg || "Copied"), () => app.toast("Copy isn't available here. Select the text instead."));

    ${others.length ? html`<div class="field"><span>Also place them in</span><div class="chips">${others.map((c) => html`<button key=${c} class=${"chip" + (also.includes(c) ? " on" : "")} onClick=${() => setAlso(also.includes(c) ? also.filter((x) => x !== c) : [...also, c])}>${course(app, c).code}</button>`)}</div></div>` : null}
    <div class="row-end"><span class="muted sm grow">Send each person their own link (email, text or DM). Don't post the links in a group.</span>
      <button class="btn primary" disabled=${!people.length || busy} onClick=${create}>${busy ? "Creating…" : "Create " + plural(people.length, "link")}</button></div>
    <section class="dcard"><div class="dcard-h"><b>Placement links · ${list.length}</b><span class="muted sm">${joined} of ${list.length} joined</span>
      ${list.length ? html`<button class="btn sm ghost" onClick=${() => copy(list.map((p) => [p.name, p.contact, link(p.id)].filter(Boolean).join("\t")).join("\n"), "All links copied (name, contact, link)")}><${Icon} name="copy" size=${15} />Copy all</button>` : null}</div>
      ${list.length ? list.map((p) => html`<div class="plrow" key=${p.id}>
        <span class="grow prow-t"><b>${p.name}</b><small>${p.contact || link(p.id).replace(/^https?:\/\//, "")}</small></span>
        <span class=${"pill sm " + (p.claimedBy ? "ok" : "")}>${p.claimedBy ? "Joined" : "Not yet"}</span>
        <button class="btn sm ghost" onClick=${() => copy(message(p), "Message with " + firstName(p.name) + "'s link copied")}>Copy message</button>
        <button class="iconbtn sm" onClick=${() => copy(link(p.id), "Link copied")} aria-label=${"Copy " + p.name + "'s link"}><${Icon} name="link" size=${16} /></button></div>`)
      : html`<p class="muted sm">No one placed in ${code} yet.</p>`}</section>
    <section class="dcard"><div class="dcard-h"><b>Your organizer link</b></div>

function Moderation({ courseId }) {
  const app = useApp();
  const all = useCollection(() => app.db.collection("reports"), [app.db]);
  const items = (all || []).flatMap((d) => Object.entries(d.items || {}).map(([id, r]) => ({ ...r, id, reporter: d.id }))).filter((r) => r.cid === courseId || r.cid === "board" || r.cid === "person").sort((a, b) => b.ts - a.ts);
  const open = items.filter((r) => r.status !== "closed" && r.status !== "removed");
  const hidden = (app.feeds[courseId] || []).filter((m) => m.hidden);
  const removeIt = async (r) => {
    if (r.cid === "board") await app.deleteBoard({ id: r.mid });
    else if (r.cid !== "person") { const m = (app.feeds[r.cid] || []).find((x) => x.id === r.mid); if (m && !m.hidden) await app.hideMsg(r.cid, m); }
    await app.resolveReport(r.reporter, r.id, "removed");
  };
  return html`<div class="dash">
    ${all === null ? html`<div class="loading"><span class="dots"><i></i><i></i><i></i></span></div>` : null}
    <section class="dcard"><div class="dcard-h"><b>Open reports · ${open.length}</b><span class="muted sm">Reporters are anonymous to the people they report.</span></div>
      ${open.length ? open.map((r) => html`<div class="report" key=${r.reporter + r.id}>
        <div class="report-h"><span class="pill warn sm">${r.reason}</span><span class="muted sm grow">${r.cid === "board" ? "Board post" : r.cid === "person" ? "Profile" : course(app, r.cid).code} · ${relShort(r.ts)}</span></div>
        <div class="report-who"><${Avatar} uid=${r.author} size=${24} /><b>${app.person(r.author).name}</b></div>
        ${r.text ? html`<blockquote class="rep-q">${r.text}</blockquote>` : null}${r.note ? html`<p class="muted sm">“${r.note}”</p>` : null}
        <div class="row-gap">${r.cid !== "person" ? html`<button class="btn sm danger" onClick=${() => removeIt(r)}>Remove for everyone</button>` : null}<button class="btn sm ghost" onClick=${() => app.resolveReport(r.reporter, r.id, "closed")}>Keep it up</button>
          ${r.cid !== "board" && r.cid !== "person" ? html`<button class="btn sm ghost" onClick=${() => app.openCourse(r.cid, "chat", r.mid)}>See in chat</button>` : null}</div>
      </div>`) : html`<p class="muted sm">No open reports.</p>`}</section>
    ${hidden.length ? html`<section class="dcard"><div class="dcard-h"><b>Removed messages · ${hidden.length}</b></div>${hidden.map((m) => html`<div class="setrow static" key=${m.id}><${Avatar} uid=${m.by} size=${24} /><span class="grow">${(m.text || "Photo").slice(0, 90)}</span><button class="btn sm ghost" onClick=${() => app.hideMsg(courseId, m)}>Restore</button></div>`)}</section>` : null}

function Exporter({ courseId }) {
  const app = useApp();
  const [data] = useCourseLog(courseId);
  if (!data) return html`<div class="loading"><span class="dots"><i></i><i></i><i></i></span></div>`;
  const cycles = (data.hub && data.hub.cycles) || [];
  const csv = Metrics.csv({ courseId, members: data.members, messages: data.messages, fixes: data.fixes, cycles, organizerIds: app.organizerIds, checks: data.checks, stuck: data.stuck, notes: data.notes });
  const summary = Metrics.compute({ courseId, members: data.members, messages: data.messages, fixes: data.fixes, checks: data.checks, recaps: data.recaps, cycles, organizerIds: app.organizerIds, now: Clock.now(), stuck: data.stuck, notes: data.notes });
  const rows = csv.split("\n");

// ---------------------------------------------------------------------------
// App shell. One information architecture on phone and desktop (HIG
// sidebarAdaptable; Discord's 2023–26 split as the warning):
//   phone   — Saturn-style tab bar: Now · Classes · Calendar · Board · People,
//             header bell (Activity) + avatar (You); ⌘K / search icon.
//   desktop — sidebar with the same destinations + your classes and spaces.
// Linear "G then key" shortcuts, ⌘K palette, "?" legend (GitHub).
// ---------------------------------------------------------------------------
const NAV = [
  ["now", "Now", "clock"],
  ["classes", "Classes", "chats"],
  ["calendar", "Calendar", "calendar"],
  ["board", "Board", "board"],
  ["people", "People", "users"],
];
function BootScreen() {
  return html`<div class="boot"><div class="boot-mark">roster</div><div class="boot-sub">Opening your classes…</div></div>`;
}

function useShortcuts() {
  const app = useApp();
  const pending = useRef(null);
  useEffect(() => {
    const onKey = (e) => {
      const t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); app.open("palette", {}); return; }
      if (typing || e.metaKey || e.ctrlKey || e.altKey || app.sheets.length) return;
      if (e.key === "/") { e.preventDefault(); app.open("palette", {}); return; }
      if (e.key === "?") { app.open("shortcuts"); return; }
      if (pending.current) {
        const k = e.key.toLowerCase();
        clearTimeout(pending.current); pending.current = null;
        const map = { n: "now", c: "classes", l: "calendar", b: "board", p: "people", a: "activity", s: "saved", t: "tasks", y: "you" };
        if (map[k]) app.setRoute({ view: map[k] });
        else if (/^[1-9]$/.test(k) && app.myCourses[+k - 1]) app.openCourse(app.myCourses[+k - 1]);
        return;
      }
      if (e.key.toLowerCase() === "g") pending.current = setTimeout(() => (pending.current = null), 900);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  });
}

function AppShell() {
  const app = useApp();
  useShortcuts();
  const wide = useMedia("(min-width: 1024px)");
  const r = app.route;
  const inClass = r.view === "class" && r.courseId && app.myCourses.includes(r.courseId);
  const view = inClass ? "class" : r.view === "class" ? "classes" : r.view;
  const inboxN = useInboxCount();
  const navTo = (v) => app.setRoute({ view: v });
  let main;
  if (view === "class") main = html`<${ClassView} key=${r.courseId} courseId=${r.courseId} tab=${r.tab} onBack=${() => app.setRoute({ view: "classes" })} />`;
  else if (view === "now") main = html`<${NowView} />`;
  else if (view === "classes") main = wide && app.myCourses[0] ? html`<${ClassView} key=${app.myCourses[0]} courseId=${app.myCourses[0]} tab="chat" onBack=${() => {}} />` : html`<${ClassesView} />`;
  else if (view === "calendar") main = html`<${CalendarView} />`;
  else if (view === "board") main = html`<${BoardView} />`;
  else if (view === "people") main = html`<${PeopleView} />`;
  else if (view === "activity") main = html`<${ActivityView} />`;
  else if (view === "saved") main = html`<${SavedView} />`;
  else if (view === "tasks") main = html`<${TasksView} />`;
  else if (view === "you") main = html`<${YouView} />`;
  else main = html`<${NowView} />`;
  const tabView = ["now", "classes", "calendar", "board", "people"].includes(view) ? view : view === "class" ? "classes" : null;
  return html`<div class=${"shell" + (wide ? " desk" : "") + (view === "class" ? " in-class" : "")}>
    ${app.banner}
    <div class="shell-body">
      ${wide ? html`<${Sidebar} view=${view} inboxN=${inboxN} />` : null}
      <main class="main" id="main">${main}</main>
    </div>
    ${!wide && view !== "class" ? html`<nav class="tabbar" aria-label="Main">${NAV.map(([k, l, ic]) => html`<button key=${k} class=${tabView === k ? "on" : ""} aria-current=${tabView === k ? "page" : undefined} onClick=${() => navTo(k)}>
      <span class="tb-ic"><${Icon} name=${ic} size=${26} fill=${tabView === k} />${k === "classes" && unreadTotal(app) ? html`<i class="tb-dot"></i>` : null}</span><span>${l}</span></button>`)}</nav>` : null}
  </div>`;
}
function unreadTotal(app) {
  let n = 0;
  for (const cid of app.myCourses) { const f = app.feeds[cid]; if (!f) continue; const lr = app.lastRead(cid, "main"); n += f.filter((m) => m.ts > lr && m.by !== app.uid && (m.thread || "main") === "main" && m.kind !== "system").length; }
  return n;
}
function useInboxCount() {
  const app = useApp();
  return useMemo(() => {
    const seen = app.inboxSeen();
    const items = Derive.inbox({ uid: app.uid, feeds: Object.fromEntries(Object.entries(app.feeds).filter(([, f]) => f)), fixes: app.fixes.map((f) => ({ ...f, appliedAt: appliedAt(f) })) });
    return items.filter((i) => i.ts > seen && i.kind !== "recap").length;
  }, [app.feeds, app.fixes, app.lrVersion]);
}

function classUnread(app, cid) {
  const f = app.feeds[cid];

}

function ClassRow({ courseId }) {
  const app = useApp();
  const f = app.feeds[courseId] || [];
  const c = course(app, courseId);
  const last = [...f].reverse().find((m) => !m.deleted && !m.hidden && (m.thread || "main") === "main");
  const n = classUnread(app, courseId);
  const preview = !last ? "No messages yet" : last.kind === "recap" ? html`<i>${last.text.replace(/^Lecture \d+ recap: /, "Recap · ")}</i>` : last.kind === "system" ? last.text
    : html`<b>${last.by === app.uid ? "You" : firstName(app.person(last.by).name)}:</b> ${last.kind === "photo" ? "📷 Photo" : last.kind === "poll" ? "📊 " + last.poll.question : last.kind === "event" ? "📅 " + last.event.title : last.text}`;
  return html`<button class=${"crow" + (n ? " unread" : "")} onClick=${() => app.openCourse(courseId)}>
    <${Tile} courseId=${courseId} size=${48} />
    <span class="crow-b"><span class="crow-top"><b>${c.code}</b><span class="crow-when">${last ? relShort(last.ts) : ""}</span></span>
      <span class="crow-bot"><span class="crow-prev">${preview}</span>${n ? html`<span class="badge">${n > 99 ? "99+" : n}</span>` : null}</span></span>
  </button>`;
}

const DEMO_KEY = "roster-demo-v7";

function getDemoDB() {
