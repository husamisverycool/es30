.stat.applied { color: var(--success); background: none; padding: 0; } .stat.dismissed { color: var(--ink-2); background: none; padding: 0; } .stat.open { color: var(--warning); background: none; padding: 0; }
.rules { list-style: decimal; padding-left: 20px; display: grid; gap: 6px; font: var(--t-subhead); }
.linkrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; color: var(--ink); border-top: .5px solid var(--separator); font: var(--t-subhead); }
.orgcta { display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: left; width: 100%; background: var(--well); }
.orgcta b { display: block; font: var(--t-headline); }
.orgcta small { display: block; font: var(--t-footnote); color: var(--ink-2); }
.classview .stack-col .card, .classview .hintcard { background: var(--well); }
.classview .input.search { background-color: var(--fill-3); }
.classview .pgroup .prow { background: var(--well); }

/* ---- AI recap (Granola grey-until-checked; Newsreader for AI text) ------------------------------ */
.recap { padding: 14px 16px 12px; display: grid; gap: 8px; margin: 12px 0 4px; max-width: 620px; width: 100%; }
.recap-status { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font: var(--t-footnote); }
.recap-status b { font-weight: 600; }
.recap-status .sub { color: var(--ink-2); }
.recap-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.recap-status .dot.ok { background: var(--success-fill); } .recap-status .dot.warn { background: var(--warning-fill); }
.recap-label { display: flex; align-items: center; flex-wrap: wrap; gap: 5px; font: var(--t-caption1); color: var(--ink-2); }
.recap-label button { color: var(--accent); font-weight: 600; }
.recap-title { font: 600 22px/28px var(--font-serif); letter-spacing: -0.01em; }
.recap-sub { font: var(--t-footnote); color: var(--ink-2); margin-top: -4px; }
.lines { display: grid; gap: 2px; }
.line { display: flex; gap: 10px; padding: 8px 0; border-top: .5px solid var(--separator); }
.line-mk { width: 10px; height: 10px; border-radius: 50%; margin-top: 9px; flex: none; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.line.checked .line-mk { background: var(--success-fill); box-shadow: none; }
.line.fixed .line-mk { background: var(--info-fill); box-shadow: none; }
.line.open .line-mk { background: var(--warning-fill); box-shadow: none; }
.line-body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.line-t, .recap-text { font: var(--t-recap); color: var(--ai-ink); }
.line.checked .line-t, .line.fixed .line-t { color: var(--ink); }
.line-orig { font: 400 14px/20px var(--font-serif); color: var(--ink-2); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.line-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font: var(--t-caption1); color: var(--ink-2); }
.srcchip { height: 22px; padding: 0 8px; border-radius: var(--r-xs); background: var(--surface); box-shadow: inset 0 0 0 .5px var(--separator); font: 600 11px/22px var(--font-sans); color: var(--ink-2); }
.srcchip.miss { box-shadow: inset 0 0 0 1px var(--warning-fill); }
.fixedby { display: inline-flex; align-items: center; gap: 4px; color: var(--info); font-weight: 600; }
.ok-t { color: var(--success); font-weight: 600; }
.line-acts { display: inline-flex; gap: 4px; margin-left: auto; }
.line-acts button { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 .5px var(--separator); font: 600 12px/1 var(--font-sans); color: var(--ink); }
.line-acts button.on { background: var(--success-tint); color: var(--success); box-shadow: inset 0 0 0 1px var(--success-fill); }
.recap-foot { display: flex; gap: 6px; align-items: flex-start; font: var(--t-caption1); color: var(--ink-2); padding-top: 6px; border-top: .5px solid var(--separator); }
.sugg { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--surface); }
.sugg-old { font: 400 14px/20px var(--font-serif); color: var(--danger); text-decoration: line-through; background: var(--danger-tint); border-radius: 6px; padding: 4px 6px; }
.sugg-new { font: 400 15px/22px var(--font-serif); color: var(--success); background: var(--success-tint); border-radius: 6px; padding: 4px 6px; }
.sugg-by { display: flex; align-items: center; gap: 6px; font: var(--t-caption1); color: var(--ink-2); }
.sugg-q { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font: 600 13px/18px var(--font-sans); }
.dots3 { display: inline-flex; gap: 3px; }
.dots3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--fill); }
.dots3 i.on { background: var(--success-fill); }
.yn { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 11px; border-radius: var(--r-pill); background: var(--fill-3); font: 600 13px/1 var(--font-sans); }
.yn.on { background: var(--ink); color: var(--surface); }
.sugg.preview .eyebrow { margin-bottom: 2px; }
.srcpop { max-width: 300px; padding: 8px 10px; display: grid; gap: 6px; }
.srcpop p { font: 400 15px/22px var(--font-serif); }
.hist { display: grid; gap: 12px; }
.hist-row { display: flex; gap: 10px; align-items: flex-start; }
.hist-row b { display: block; font: 600 14px/19px var(--font-sans); }
.hist-row p { font: 400 15px/22px var(--font-serif); margin: 2px 0; }
.hist-row small { font: var(--t-caption1); color: var(--ink-2); }

/* ---- calendar ------------------------------------------------------------------------------------ */
.calbar { display: flex; align-items: center; gap: 6px; padding: 0 16px 10px; max-width: 752px; width: 100%; margin: 0 auto; flex: none; }
.desk .calbar { max-width: none; padding: 0 24px 12px 32px; }
.desk .page:has(.tgrid:not(.one)) .pagehead { max-width: none; padding-left: 32px; padding-right: 24px; }
.calnote { display: flex; align-items: center; gap: 10px; margin: 0 16px 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--warning-tint); color: var(--warning); font: var(--t-footnote); text-align: left; flex: none; }
.desk .calnote { margin: 0 24px 12px 32px; }
.weekstrip { display: grid; grid-template-columns: repeat(7, 1fr); padding: 0 8px 8px; flex: none; }
.ws-d { display: grid; justify-items: center; gap: 2px; padding: 4px 0; }
.ws-d small { font: 600 11px/13px var(--font-sans); color: var(--ink-2); }
.ws-d b { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 500 17px/1 var(--font-sans); transition: background var(--dur-short); }
.ws-d.today b { color: var(--school-text); font-weight: 700; }
.ws-d.on b { background: var(--ink); color: var(--surface); font-weight: 600; }
.ws-d.on.today b { background: var(--school-fill); color: #fff; }
.ws-d i { width: 4px; height: 4px; border-radius: 50%; }
.ws-d i.has { background: var(--ink-3); }
.tgrid { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
.desk .tgrid { margin: 0 0 0 0; border-radius: 16px; box-shadow: 0 0 0 .5px var(--separator); overflow: hidden; }
.tg-head, .tg-allday { display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); border-bottom: .5px solid var(--separator); flex: none; }
.tgrid.one .tg-allday { grid-template-columns: 56px minmax(0, 1fr); }
.tg-dh { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding: 10px 0 8px; }
.tg-dh small { font: 600 11px/1 var(--font-sans); font-stretch: var(--wdth-compressed); letter-spacing: .05em; color: var(--ink-2); }
.tg-dh b { font: 600 20px/1 var(--font-sans); }
.tg-dh.today small { color: var(--school-text); }
.tg-dh.today b { color: #fff; background: var(--school-fill); border-radius: 50%; width: 30px; height: 30px; display: grid; place-items: center; font-size: 16px; }
.tg-allday .tg-gut { display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; }
.tg-allday .tg-gut small { font: 500 10px/1 var(--font-sans); color: var(--ink-2); }
.tg-adcol { display: grid; gap: 3px; padding: 4px 3px; border-left: .5px solid var(--separator); align-content: start; min-width: 0; }
.adchip { display: flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 6px; background: var(--fill-3); font: 600 11px/1 var(--font-sans); white-space: nowrap; overflow: hidden; min-width: 0; text-align: left; }
.adchip > span:not(.ic) { overflow: hidden; text-overflow: ellipsis; }
.adchip.due { background: var(--tint); color: var(--ink); box-shadow: inset 3px 0 0 var(--edge); }
.adchip.due.today, .adchip.due.tomorrow { color: var(--warning); }
.adchip.due.now, .adchip.due.late { color: var(--danger); }
.tg-body { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
.tg-inner { position: relative; display: grid; grid-template-columns: 56px minmax(0, 1fr); }
.tg-gut { position: relative; }
.tg-hr { position: absolute; right: 8px; transform: translateY(-50%); font: 500 11px/1 var(--font-sans); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tg-cols { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.tg-line { position: absolute; left: 0; right: 0; height: 0; border-top: .5px solid var(--separator); pointer-events: none; }
.tg-col { position: relative; border-left: .5px solid var(--separator); }
.tg-ev { position: absolute; display: grid; align-content: start; gap: 1px; padding: 4px 6px 4px 8px; border-radius: 6px; background: var(--tint); color: var(--tx); box-shadow: inset 3px 0 0 var(--edge); text-align: left; overflow: hidden; font: 500 12px/15px var(--font-sans); z-index: 1; transition: transform var(--dur-micro); }
.tg-ev:hover { z-index: 2; box-shadow: inset 3px 0 0 var(--edge), var(--shadow-float); }
.tg-ev b { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tg-ev small { font: 500 11px/14px var(--font-sans); opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tg-ev.short { padding-top: 2px; }
.tg-ev.past { opacity: .62; }
.tg-ev.live { box-shadow: inset 3px 0 0 var(--edge), 0 0 0 1.5px var(--edge); }
.tg-ev.event, .tg-ev.board { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--fill), inset 3px 0 0 var(--edge); }
.tg-ev.maybe { background: repeating-linear-gradient(-45deg, var(--surface), var(--surface) 5px, var(--fill-4) 5px, var(--fill-4) 10px); }
.tg-now { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--danger-fill); z-index: 3; pointer-events: none; }
.tg-now i { position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger-fill); }
.tg-nowlabel { position: absolute; left: -56px; width: 50px; text-align: right; transform: translateY(-50%); font: 700 11px/16px var(--font-sans); color: var(--danger-fill); background: var(--surface); z-index: 3; padding-right: 4px; }
.tg-empty { position: absolute; left: 0; right: 0; top: 40%; text-align: center; color: var(--ink-2); font: var(--t-subhead); pointer-events: none; }
.tgrid.one { position: relative; }
.agenda { gap: 20px; }
.ag-day { display: grid; gap: 8px; }
.ag-h { display: flex; align-items: baseline; gap: 8px; margin: 0 4px; position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 6px 0; }
.ag-h b { font: var(--t-title3); letter-spacing: var(--tr-title3); }
.ag-h > span { font: var(--t-subhead); color: var(--ink-2); }
.ag-row.allday .ag-time { display: flex; justify-content: center; }
.ag-row.live { background: var(--danger-tint); }
.mtrow { display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 14px; }
.mtrow-t b { display: block; font: var(--t-headline); }
.mtrow-t small { display: block; font: var(--t-footnote); color: var(--ink-2); margin-top: 1px; }
.daypick { display: flex; gap: 6px; }
.daychip { flex: 1; text-align: center; height: 40px; border-radius: var(--r-pill); background: var(--surface); box-shadow: inset 0 0 0 .5px var(--separator); font: 600 15px/1 var(--font-sans); }
.daychip.on { background: var(--ink); color: var(--surface); box-shadow: none; }

/* ---- board --------------------------------------------------------------------------------------- */
.chiprow { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 12px; scrollbar-width: none; flex: none; max-width: 752px; width: 100%; margin: 0 auto; }
.desk .chiprow { padding: 0 32px 14px; max-width: 760px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: var(--r-pill); background: var(--surface); font: 500 14px/1 var(--font-sans); white-space: nowrap; flex: none; transition: background var(--dur-short), color var(--dur-short); }
.fchip.on { background: var(--ink); color: var(--surface); }
.fchip-n { font: 500 12px/1 var(--font-sans); opacity: .6; font-variant-numeric: tabular-nums; }
.boardpage { gap: 24px; }
.evrail { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scrollbar-width: none; }
.evtile { width: 220px; flex: none; display: grid; gap: 6px; padding: 14px; border-radius: var(--r-lg); background: var(--surface); text-align: left; align-content: start; }
.evtile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.evtile .datetile { background: var(--bg); }
.evtile-t { font: var(--t-headline); letter-spacing: var(--tr-headline); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.feed { display: grid; gap: 12px; }
.bcard { display: grid; gap: 10px; padding: 14px 16px 12px; border-radius: var(--r-lg); background: var(--surface); }
.bcard.full { padding: 0; background: transparent; }
.bcard-h { display: flex; align-items: center; gap: 10px; }
.bcard-who b { display: block; font: 600 15px/20px var(--font-sans); }
.bcard-who small { display: block; font: var(--t-footnote); color: var(--ink-2); }
.catpill { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 9px; border-radius: var(--r-pill); background: var(--fill-3); font: 600 12px/1 var(--font-sans); color: var(--ink-2); flex: none; }
.bcard-b { display: grid; gap: 6px; cursor: pointer; }
.bcard.full .bcard-b { cursor: default; }
.bcard-t { font: var(--t-title3); letter-spacing: var(--tr-title3); }
.price { margin-right: 8px; color: var(--success); }
.bcard-p { font: var(--t-callout); color: var(--ink); }
.bcard-p.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.bcard-img { border-radius: 14px; overflow: hidden; max-height: 360px; }
.bcard-img img { width: 100%; object-fit: cover; }
.bcard-ev { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 14px; background: var(--bg); margin-top: 4px; }
.bcard-ev > .grow > b { display: block; font: 600 15px/20px var(--font-sans); }
.bcard-ev > .grow > small { display: flex; align-items: center; gap: 4px; font: var(--t-footnote); color: var(--ink-2); margin-top: 2px; }
.bcard .rsvp { padding: 0; }
.bcard .rsvp button { background: var(--bg); box-shadow: none; }
.bcard .rsvp button.on { background: var(--ink); }
.bcard-f { display: flex; align-items: center; gap: 8px; }
.bcard-c { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: var(--r-pill); font: 600 13px/1 var(--font-sans); color: var(--ink-2); }
.bcard-c:hover { background: var(--fill-4); }
.bcard .reacts .react { box-shadow: none; background: var(--bg); }
.bcard .reacts .react.me { background: var(--school-tint); box-shadow: inset 0 0 0 1px var(--accent); }
.mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 10px; }
@media (min-width: 760px) { .mgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.mtile { display: grid; gap: 3px; text-align: left; align-content: start; }
.mtile-img { aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--surface); margin-bottom: 6px; display: block; }
.mtile-img img { width: 100%; height: 100%; object-fit: cover; }
.mtile-ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--ink-3); }
.mtile-price { font: 700 17px/22px var(--font-sans); }
.mtile-t { font: var(--t-subhead); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mtile small { font: var(--t-caption1); color: var(--ink-2); }
.cmts { display: grid; gap: 12px; }
.cmt { display: flex; gap: 10px; align-items: flex-start; }
.cmt-b { flex: 1; min-width: 0; padding: 8px 12px; border-radius: 16px; background: var(--surface); }
.cmt-b b { font: 600 13px/18px var(--font-sans); margin-right: 6px; }
.cmt-b p { font: var(--t-subhead); margin-top: 1px; }
.cmt-composer { display: flex; align-items: center; gap: 8px; width: 100%; }
.cmt-composer .input { height: 40px; border-radius: 20px; }
.catpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.catopt { display: grid; justify-items: center; gap: 6px; padding: 12px 6px; border-radius: var(--r-md); background: var(--surface); font: 600 13px/16px var(--font-sans); }
.catopt.on { background: var(--ink); color: var(--surface); }
.imgprev { position: relative; border-radius: 14px; overflow: hidden; max-height: 240px; }
.imgprev img { width: 100%; object-fit: cover; }
.imgprev .iconbtn { position: absolute; top: 8px; right: 8px; background: rgba(0, 0, 0, .55); color: #fff; }

/* ---- popovers, menus, trays, toasts ------------------------------------------------------------- */
.pop { position: fixed; z-index: 300; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-overlay); animation: popin var(--dur-short) var(--ease-enter); }
@keyframes popin { from { opacity: 0; transform: scale(.96); } }
.menu { padding: 6px; min-width: 230px; display: grid; }
.menu-g { display: grid; }
.menu-g + .menu-g { border-top: .5px solid var(--separator); margin-top: 6px; padding-top: 6px; }
.menu button { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px; font: var(--t-body); text-align: left; }
.menu button:hover { background: var(--fill-4); }
.menu button > span:not(.ic) { flex: 1; }
.menu button.danger { color: var(--danger); }
.tray { padding: 6px; }
.tray-row { display: flex; gap: 2px; }
.tray-e { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 26px; animation: trayin .36s var(--ease-pop) both; animation-delay: calc(var(--i) * 25ms); }
.tray-e:hover { background: var(--fill-3); transform: scale(1.12); }
.tray-e.more { color: var(--ink-2); background: var(--fill-3); font-size: 0; }
@keyframes trayin { from { opacity: 0; transform: scale(.4) translateY(8px); } }
.tray-grid { display: grid; grid-template-columns: repeat(7, 40px); gap: 2px; padding: 6px 2px 2px; border-top: .5px solid var(--separator); margin-top: 6px; }
.tray-grid button { width: 40px; height: 40px; border-radius: 10px; font-size: 22px; }
.tray-grid button:hover { background: var(--fill-3); }
.tray.compact { display: flex; justify-content: center; padding: 6px 0 10px; }
.tray.compact .tray-row { padding: 4px; border-radius: var(--r-pill); background: var(--surface); box-shadow: var(--shadow-float); }
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom)); display: grid; gap: 8px; justify-items: center; z-index: 400; pointer-events: none; width: calc(100% - 32px); max-width: 460px; }
.toast { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 10px 10px 18px; border-radius: var(--r-pill); background: var(--ink); color: var(--surface); box-shadow: var(--shadow-overlay); font: 500 14px/19px var(--font-sans); pointer-events: auto; animation: toastin var(--dur-medium) var(--ease-pop); }
.toast button { font-weight: 700; padding: 6px 10px; border-radius: var(--r-pill); color: var(--surface); box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .4); }
@keyframes toastin { from { opacity: 0; transform: translateY(12px) scale(.96); } }

/* ---- sheets (Vaul on phone, dialog on desktop) ----------------------------------------------------- */
.scrim { position: fixed; inset: 0; z-index: 200; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; animation: fadein var(--dur-medium) var(--ease-enter); }
.scrim.out { animation: fadeout .22s var(--ease-exit) forwards; }
@keyframes fadein { from { opacity: 0; } }
@keyframes fadeout { to { opacity: 0; } }
.sheet { width: 100%; max-height: 92dvh; display: flex; flex-direction: column; background: var(--bg); border-radius: var(--r-xl) var(--r-xl) 0 0; box-shadow: var(--shadow-overlay); animation: sheetin .5s var(--ease-sheet); transition: transform .5s var(--ease-sheet); overflow: hidden; }
.sheet.out { animation: sheetout .22s var(--ease-exit) forwards; }
@keyframes sheetin { from { transform: translateY(100%); } }
@keyframes sheetout { to { transform: translateY(100%); } }
.sheet.tall { height: 92dvh; }
.sheet-grab { display: flex; justify-content: center; padding: 6px 0 2px; touch-action: none; flex: none; }
.sheet-grab i { width: 36px; height: 5px; border-radius: 3px; background: var(--fill); }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 4px 12px 10px 18px; touch-action: none; flex: none; }
.sheet-h > .ic { color: var(--ink-2); }
.sheet-h h2 { flex: 1; font: var(--t-title2); letter-spacing: var(--tr-title2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-x { width: 30px; height: 30px; border-radius: 50%; background: var(--fill-3); color: var(--ink-2); display: grid; place-items: center; flex: none; }
.sheet-b { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 20px; display: grid; gap: 16px; align-content: start; overscroll-behavior: contain; }
.sheet-f { display: flex; align-items: center; gap: 8px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); border-top: .5px solid var(--separator); background: var(--bg); flex: none; }
.sheet-f .btn.primary:only-child { margin-left: auto; }
.sheet.ctx { background: transparent; box-shadow: none; }
.sheet.ctx .sheet-grab { display: none; }
.sheet.ctx .sheet-b { gap: 0; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
.sheet.ctx .menu { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-overlay); }
.sheet.palette .sheet-b { padding: 0; gap: 0; }
.sheet.palette .sheet-grab { display: none; }
@media (min-width: 760px) {
  .scrim { align-items: center; padding: 24px; }
  .sheet { width: 560px; max-height: 86vh; border-radius: 20px; animation: dialogin var(--dur-medium) var(--ease-enter); }
  .sheet.out { animation: dialogout var(--dur-short) var(--ease-exit) forwards; }
  .sheet.tall { height: auto; min-height: 60vh; }
  .sheet.sm { width: 420px; }
  .sheet.wide { width: min(1040px, 100%); height: 88vh; }
  .sheet.ctx { width: 380px; }
  .sheet.palette { width: 640px; align-self: flex-start; margin-top: 10vh; max-height: 70vh; }
  .sheet-grab { display: none; }
  .sheet-h { padding-top: 16px; }
  @keyframes dialogin { from { opacity: 0; transform: scale(.96) translateY(8px); } }
  @keyframes dialogout { to { opacity: 0; transform: scale(.98); } }
}
.sheet .group, .sheet .input:not(.search) { background-color: var(--surface); }

/* event / info rows / photo / attach */
.evsheet { display: flex; gap: 14px; align-items: center; }
.evsheet-t { font: var(--t-title2); letter-spacing: var(--tr-title2); margin-bottom: 6px; }
.evsheet-note { font: var(--t-callout); padding: 12px 14px; border-radius: var(--r-md); background: var(--surface); }
.inforow { display: flex; align-items: center; gap: 12px; padding: 11px 16px; }
.inforow > .ic { color: var(--ink-2); width: 24px; justify-content: center; }
.inforow b { display: block; font: 500 16px/21px var(--font-sans); }
.inforow small { display: block; font: var(--t-footnote); color: var(--ink-2); }
.viewer { position: fixed; inset: 0; z-index: 250; background: #000; color: #fff; display: flex; flex-direction: column; animation: fadein var(--dur-medium); }
.viewer-h, .viewer-f { display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 8px 8px; flex: none; }
.viewer-f { padding: 8px 12px calc(12px + env(safe-area-inset-bottom)); }
.viewer .iconbtn { color: #fff; }
.viewer .iconbtn:hover { background: rgba(255, 255, 255, .12); }
.viewer-who { display: flex; align-items: center; gap: 10px; }
.viewer-who b { display: block; font: 600 15px/20px var(--font-sans); }
.viewer-who small { display: block; font: var(--t-footnote); color: rgba(255, 255, 255, .7); }
.viewer-img { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px; overflow: auto; cursor: zoom-in; }
.viewer-img img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform var(--dur-medium) var(--ease-smooth); }
.viewer-img.zoom { cursor: zoom-out; place-items: start; }
.viewer-img.zoom img { max-width: none; max-height: none; width: 200%; }
.viewer-cap { padding: 0 16px 8px; font: var(--t-callout); text-align: center; }
.viewer-f .emo { width: 44px; height: 44px; border-radius: 50%; font-size: 24px; display: grid; place-items: center; }
.viewer-f .emo.on { background: rgba(255, 255, 255, .2); }
.viewer-f .btn { background: rgba(255, 255, 255, .14); color: #fff; }
.sendprev { border-radius: 16px; overflow: hidden; background: #000; display: grid; place-items: center; max-height: 50vh; }
.sendprev img { max-height: 50vh; object-fit: contain; }
.attach-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 4px 0 8px; }
.attach-o { display: grid; justify-items: center; gap: 8px; font: 500 13px/16px var(--font-sans); text-align: center; }
.attach-ic { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; color: #fff; transition: transform var(--dur-short) var(--ease-pop); }

.optin { display: flex; align-items: center; gap: 10px; }
.optin .input { flex: 1; }
.note-t { font: var(--t-title2); letter-spacing: var(--tr-title2); }
.byline { display: inline-flex; align-items: center; gap: 8px; font: var(--t-footnote); color: var(--ink-2); }
.note-img { border-radius: 14px; width: 100%; }
.notebody { font: 400 17px/26px var(--font-sans); display: grid; gap: 10px; }
.notebody ul { list-style: disc; padding-left: 22px; display: grid; gap: 4px; }
.notebody ol { list-style: decimal; padding-left: 22px; display: grid; gap: 4px; }
.rep-q { padding: 10px 12px; border-radius: 12px; background: var(--surface); box-shadow: inset 3px 0 0 var(--ink-3); font: var(--t-subhead); color: var(--ink-2); white-space: pre-wrap; }
.radrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; text-align: left; }

.radrow small { display: block; font: var(--t-footnote); color: var(--ink-2); }
.radio { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--ink-3); flex: none; transition: box-shadow var(--dur-short); }
.radrow.on .radio { box-shadow: inset 0 0 0 7px var(--ink); }
.done-art { width: 72px; height: 72px; border-radius: 50%; background: var(--success-tint); color: var(--success); display: grid; place-items: center; justify-self: center; margin-top: 8px; }
.pledge { display: grid; gap: 18px; counter-reset: p; }
.pledge li { display: flex; gap: 14px; align-items: flex-start; }
.pledge b { display: block; font: var(--t-headline); letter-spacing: var(--tr-headline); }
.pledge p { font: var(--t-subhead); color: var(--ink-2); margin-top: 2px; }
.bul { list-style: disc; padding-left: 20px; display: grid; gap: 6px; font: var(--t-subhead); }
.kbdlist { display: grid; gap: 2px; }
.kbdrow { display: flex; align-items: center; gap: 6px; padding: 8px 4px; border-bottom: .5px solid var(--separator); font: var(--t-subhead); }

.ep-av { display: flex; align-items: center; gap: 16px; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }

.sw { width: 30px; height: 30px; border-radius: 50%; transition: box-shadow var(--dur-short); }
.sw.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink); }

/* ⌘K palette (Linear / Raycast) */
.pal-in { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: .5px solid var(--separator); color: var(--ink-2); background: var(--surface); }
.pal-in input { border: 0; background: none; outline: none; font: 400 18px/24px var(--font-sans); color: var(--ink); }
.pal-scope { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 4px 0 9px; border-radius: var(--r-pill); background: var(--fill-3); color: var(--ink); font: 600 13px/1 var(--font-sans); }
.pal-scope button { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; }
.pal-list { flex: 1; min-height: 0; max-height: 52vh; overflow-y: auto; padding: 6px; background: var(--surface); }
.pal-g { padding: 10px 10px 4px; font: 600 12px/16px var(--font-sans); color: var(--ink-2); }
.pal-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 46px; padding: 6px 10px; border-radius: 10px; text-align: left; }
.pal-row.on { background: var(--fill-3); }
.pal-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--fill-3); color: var(--ink-2); flex: none; }
.pal-t b { display: block; font: 500 15px/20px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-t small { display: block; font: var(--t-footnote); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal-empty { padding: 28px 16px; text-align: center; color: var(--ink-2); font: var(--t-subhead); }
.pal-foot { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-top: .5px solid var(--separator); font: var(--t-caption1); color: var(--ink-2); background: var(--surface); }
.pal-foot kbd { margin-right: 3px; }
@media (max-width: 759px) { .sheet.palette { height: 92dvh; } .pal-list { max-height: none; } .pal-foot { display: none; } }

/* weekly story (Instagram stories; Wrapped cards) */
.story { position: fixed; inset: 0; z-index: 260; background: var(--st); color: #fff; display: flex; flex-direction: column; animation: fadein var(--dur-medium); }
@media (min-width: 760px) { .story { inset: 4vh auto; left: 50%; transform: translateX(-50%); width: 420px; border-radius: 24px; box-shadow: var(--shadow-overlay); overflow: hidden; } }
.st-prog { display: flex; gap: 4px; padding: calc(10px + env(safe-area-inset-top)) 12px 6px; }
.st-prog i { flex: 1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .32); overflow: hidden; }
.st-prog b { display: block; height: 100%; width: 0; background: #fff; }
.st-prog b.done { width: 100%; }
.st-prog b.on { animation: stfill 6s linear forwards; }
.st-prog b.paused { animation-play-state: paused; }
@keyframes stfill { to { width: 100%; } }
.st-h { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; position: relative; z-index: 2; }
.st-h b { font: 600 15px/20px var(--font-sans); }
.st-h .iconbtn { color: #fff; }
.st-body { flex: 1; display: grid; place-items: center; padding: 24px 28px 64px; animation: stin var(--dur-long) var(--ease-smooth); }
@keyframes stin { from { opacity: 0; transform: translateY(16px); } }
.st-c { display: grid; gap: 12px; text-align: left; width: 100%; }
.st-k { font: 700 13px/16px var(--font-sans); font-stretch: var(--wdth-compressed); letter-spacing: .06em; text-transform: uppercase; opacity: .78; }
.st-c h2 { font: 700 34px/40px var(--font-sans); letter-spacing: -0.025em; }
.st-c p { font: 400 19px/26px var(--font-sans); opacity: .92; }
.st-big { font: 800 112px/0.95 var(--font-sans) !important; font-stretch: var(--wdth-expanded); letter-spacing: -0.04em; opacity: 1 !important; }
.st-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 180px; align-items: end; }
.st-bars > span { display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 6px; text-align: center; font: 600 12px/1 var(--font-sans); }
.st-bars i { align-self: end; border-radius: 6px; background: rgba(255, 255, 255, .35); }
.st-bars i.on { background: #fff; }
.st-q { font: 400 24px/32px var(--font-serif); padding-left: 14px; box-shadow: inset 3px 0 0 rgba(255, 255, 255, .6); }
.st-emoji { display: flex; gap: 18px; font-size: 34px; }
.st-emoji small { font: 700 14px/1 var(--font-sans); margin-left: 4px; vertical-align: middle; }
.st-end { margin-top: 24px; opacity: .7 !important; }
.st-tap { position: absolute; top: 90px; bottom: 0; z-index: 1; }
.st-tap.l { left: 0; width: 34%; } .st-tap.r { right: 0; width: 66%; }

/* ---- onboarding ------------------------------------------------------------------------------------ */
.ob { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.ob-top { display: flex; align-items: center; gap: 12px; padding: calc(6px + env(safe-area-inset-top)) 8px 6px; max-width: 600px; width: 100%; margin: 0 auto; flex: none; }
.ob-prog { flex: 1; height: 4px; border-radius: 2px; background: var(--fill-3); overflow: hidden; }
.ob-prog i { display: block; height: 100%; background: var(--ink); border-radius: 2px; transition: width var(--dur-long) var(--ease-smooth); }
.ob-skip { font: 600 15px/1 var(--font-sans); color: var(--ink-2); padding: 10px 12px; }
.ob-skip-sp { width: 52px; }
.ob-scroll { flex: 1; min-height: 0; overflow-y: auto; }
.ob-body { max-width: 560px; margin: 0 auto; padding: 12px 20px 28px; display: grid; gap: 18px; }
.ob-body.fwd { animation: obfwd var(--dur-medium) var(--ease-enter); }
.ob-body.bwd { animation: obbwd var(--dur-medium) var(--ease-enter); }
@keyframes obfwd { from { opacity: 0; transform: translateX(24px); } }
@keyframes obbwd { from { opacity: 0; transform: translateX(-24px); } }
.ob-cta { max-width: 560px; width: 100%; margin: 0 auto; padding: 10px 20px calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 8px; flex: none; }
.ob-cta .fine { padding: 4px 0 0; }
.ob-h1 { font: var(--t-largetitle); letter-spacing: var(--tr-largetitle); }
.ob-h { font: var(--t-title1); letter-spacing: var(--tr-title1); }
@media (min-width: 1024px) { .ob-h1 { font: 700 40px/46px var(--font-sans); letter-spacing: -0.028em; } .ob-h { font: 700 30px/36px var(--font-sans); letter-spacing: -0.02em; } }
.ob-sub { font: var(--t-callout); color: var(--ink-2); margin-top: -8px; }
.ob-welcome { display: grid; gap: 18px; padding-top: calc(16px + 4vh); }
.ob-tiles { display: flex; justify-content: center; margin-bottom: 18px; }
.ob-tile { display: inline-flex; margin: 0 -6px; border-radius: 24px; transform: rotate(var(--r)) translateY(var(--y)); box-shadow: var(--shadow-float); animation: tiledrop .7s var(--ease-pop) both; animation-delay: var(--d); }
.ob-tile .tile { border-radius: 23px !important; }
@keyframes tiledrop { from { opacity: 0; transform: rotate(0) translateY(-40px) scale(.8); } }
.ob-points { display: grid; gap: 16px; margin-top: 6px; }
.ob-points li { display: flex; gap: 14px; align-items: flex-start; }
.ob-pi { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; flex: none; }
.ob-points b { display: block; font: var(--t-headline); letter-spacing: var(--tr-headline); }
.ob-points div > span { display: block; font: var(--t-subhead); color: var(--ink-2); margin-top: 1px; }
.ob-banner { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); background: var(--success-tint); color: var(--success); font: 600 14px/19px var(--font-sans); }
.ob-banner.warn { background: var(--warning-tint); color: var(--warning); }
.picker { display: grid; gap: 12px; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; }
.pickchip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 4px; border-radius: var(--r-pill); background: var(--surface); font: 600 14px/1 var(--font-sans); box-shadow: inset 0 0 0 .5px var(--separator); }
.pickchip .tile { border-radius: 50% !important; }
.pickchip button { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
.searchwrap { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 6px 0 12px; border-radius: 12px; background: var(--fill-3); color: var(--ink-2); }
.searchwrap input { border: 0; background: none; outline: none; font: var(--t-body); color: var(--ink); height: 100%; }
.altrow { display: flex; gap: 8px; flex-wrap: wrap; }
.pastebox { display: grid; gap: 8px; justify-items: start; }
.cresults { display: grid; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; }
.cres { display: flex; align-items: center; gap: 12px; padding: 10px 14px; text-align: left; width: 100%; }
.cres + .cres { border-top: .5px solid var(--separator); }
.cres:disabled { opacity: .6; }
.cres-t b { display: block; font: var(--t-headline); letter-spacing: var(--tr-headline); }
.cres-t small { display: block; font: var(--t-footnote); color: var(--ink-2); margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cres-who { display: flex; align-items: center; gap: 6px; margin-top: 4px; font: 500 12px/1 var(--font-sans); color: var(--ink-2); }
.addbtn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-3); color: var(--ink); flex: none; transition: background var(--dur-short), transform var(--dur-medium) var(--ease-pop); }
.addbtn.on { background: var(--ink); color: var(--surface); transform: rotate(0); }
.verify { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); }
.verify b { display: block; font: var(--t-headline); overflow-wrap: anywhere; }
.verify small { display: block; font: var(--t-footnote); color: var(--ink-2); margin-top: 2px; }
.verify-ic { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--fill-3); color: var(--ink-2); flex: none; }
.verify-ic img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.verify-ok { color: var(--info-fill); display: inline-flex; animation: pop .592s var(--ease-pop); }
.ob-avatar { display: grid; justify-items: center; gap: 12px; }
.housegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.housechip { display: grid; justify-items: center; align-content: center; gap: 2px; height: 58px; border-radius: var(--r-md); background: var(--surface); font: 600 15px/19px var(--font-sans); transition: background var(--dur-short), color var(--dur-short); }
.housechip small { font: 500 11px/13px var(--font-sans); color: var(--ink-2); }
.housechip.on { background: var(--ink); color: var(--surface); }
.housechip.on small { color: var(--surface); opacity: .7; }
.concpick { display: grid; gap: 12px; }
.conclist { max-height: 46vh; overflow-y: auto; }
.sec-lab { display: inline-flex !important; align-items: center; gap: 8px; color: var(--ink) !important; font: var(--t-headline) !important; }
.slotgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 560px) { .slotgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.slotchip { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface); text-align: left; }
.slotchip b { font: 600 15px/20px var(--font-sans); }
.slotchip small { font: var(--t-caption1); color: var(--ink-2); }
.slotchip.on { background: var(--ink); color: var(--surface); }
.slotchip.on small { color: var(--surface); opacity: .7; }
.ob-build { display: grid; gap: 24px; padding-top: 8vh; }
.buildlist { display: grid; gap: 16px; }
.buildlist li { display: flex; align-items: center; gap: 12px; font: var(--t-callout); color: var(--ink-3); transition: color var(--dur-medium); }
.buildlist li.now, .buildlist li.done { color: var(--ink); }
.bl-ic { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; box-shadow: inset 0 0 0 1.5px var(--fill); flex: none; }
.buildlist li.done .bl-ic { background: var(--success-fill); color: #fff; box-shadow: none; animation: pop .592s var(--ease-pop); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--fill); border-top-color: var(--ink); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ob-arrive { display: grid; justify-items: center; gap: 14px; text-align: center; padding-top: 4vh; }
.ob-arrive .ob-sub { margin-top: -10px; }
.ob-avatar-big { position: relative; display: inline-flex; margin-bottom: 8px; animation: pop .7s var(--ease-pop); }
.confetti { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.confetti i { position: absolute; width: 8px; height: 14px; border-radius: 2px; background: var(--c); transform: rotate(var(--a)) translateY(0); opacity: 0; animation: burst 1.1s var(--ease-enter) forwards; animation-delay: calc(200ms + var(--d)); }
@keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(-20px) scale(.6); } 80% { opacity: 1; } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-110px) scale(1); } }
.arrive { display: grid; width: 100%; background: var(--surface); border-radius: var(--r-lg); overflow: hidden; text-align: left; margin-top: 8px; }
.arrive-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; animation: rowin .5s var(--ease-smooth) both; }
.arrive-row + .arrive-row { border-top: .5px solid var(--separator); }
.arrive-row b { display: block; font: var(--t-headline); }
.arrive-row small { display: block; font: var(--t-footnote); color: var(--ink-2); }
@keyframes rowin { from { opacity: 0; transform: translateY(10px); } }

/* ---- organizer ------------------------------------------------------------------------------------- */
.org-demo { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface); font: var(--t-footnote); color: var(--ink-2); }
.dash { display: grid; gap: 14px; }
.dash-q { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dash-q b { display: block; font: var(--t-title3); letter-spacing: var(--tr-title3); }
.dash-q small { display: block; font: var(--t-footnote); color: var(--ink-2); margin-top: 2px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 600px) { .kpis { grid-template-columns: 1fr; } }
.kpi { display: grid; gap: 10px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); align-content: start; }
.kpi-k { font: 600 13px/18px var(--font-sans); color: var(--ink-2); }
.kpi-v { display: flex; align-items: baseline; gap: 8px; font: 800 40px/1 var(--font-sans); font-stretch: var(--wdth-expanded); letter-spacing: -0.03em; }
.kpi.sm .kpi-v { font-size: 30px; }
.kpi-v small { font: 500 14px/1 var(--font-sans); color: var(--ink-2); letter-spacing: 0; }
.kpi-n { font: var(--t-footnote); color: var(--ink-2); }
.kpi-n b { color: var(--ink); }
.meter { position: relative; height: 10px; margin: 6px 0 14px; }
.meter .zone { position: absolute; top: 0; bottom: 0; }
.meter .zone.kill { left: 0; background: var(--danger-tint); border-radius: 5px 0 0 5px; box-shadow: inset 0 0 0 .5px var(--danger-fill); }
.meter .zone.mid { background: var(--warning-tint); box-shadow: inset 0 0 0 .5px var(--warning-fill); }
.meter .zone.ok { background: var(--success-tint); border-radius: 0 5px 5px 0; box-shadow: inset 0 0 0 .5px var(--success-fill); }
.m-val { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); }
.m-proj { position: absolute; top: -4px; width: 0; height: 18px; border-left: 2px dashed var(--ink-2); margin-left: -1px; }
.m-tick { position: absolute; top: 12px; transform: translateX(-50%); }
.m-tick small { font: 600 10px/1 var(--font-sans); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.verdict { justify-self: start; display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: var(--r-pill); font: 600 13px/1 var(--font-sans); background: var(--fill-3); color: var(--ink-2); }
.verdict.success { background: var(--success-tint); color: var(--success); }
.verdict.revise { background: var(--warning-tint); color: var(--warning); }
.verdict.kill { background: var(--danger-tint); color: var(--danger); }
.dcard { display: grid; gap: 12px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); }
.dcard-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.dcard-h b { font: var(--t-headline); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: var(--t-footnote); color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.lgd { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.lgd.c1, .bars i.c1 { background: var(--c8-solid); }
.lgd.c2, .bars i.c2 { background: var(--c5-solid); }
.lgd.s-c, .split .s-c { background: var(--c8-solid); }
.lgd.s-r, .split .s-r { background: var(--warning-fill); }
.lgd.s-n { background: var(--fill-3); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 140px; }
.bar-w { flex: 1; height: 100%; display: flex; align-items: flex-end; }
.bars i { display: block; width: 100%; border-radius: 3px 3px 0 0; transition: height var(--dur-long) var(--ease-smooth); }
.bars i.future { background: transparent !important; box-shadow: inset 0 0 0 1px var(--fill); height: 100%; opacity: .5; border-radius: 3px; }
.bars-axis { display: flex; justify-content: space-between; font: var(--t-caption1); color: var(--ink-2); }
.split-row { display: grid; gap: 6px; }
.split-l { font: 600 14px/18px var(--font-sans); }
.split { display: flex; height: 14px; border-radius: 7px; background: var(--fill-3); overflow: hidden; }
.split i { display: block; height: 100%; }
.tbl { width: 100%; border-collapse: collapse; font: var(--t-subhead); }
.tbl th { text-align: left; font: 600 12px/16px var(--font-sans); color: var(--ink-2); padding: 6px 8px; border-bottom: .5px solid var(--separator); }
.tbl td { padding: 7px 8px; border-bottom: .5px solid var(--separator); }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl tr.sub td { font-weight: 600; }

<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/preact/standalone.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script>

try { var t = localStorage.getItem("roster:theme"); t = t && JSON.parse(t); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
// ---------------------------------------------------------------------------
// LocalDB — an in-page store with the same surface as the artifact `db`
// capability (doc / collection / where / orderBy / limit / get / set /
// update / delete / add / onSnapshot). Demo mode runs on it, so the demo and
// the live class chat share one code path. Nothing here leaves the browser.
// ---------------------------------------------------------------------------
const LocalDB = (() => {
  const isObj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
  const clone = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
  const freeze = (v) => {
    if (v && typeof v === "object") {
      Object.freeze(v);
      for (const k of Object.keys(v)) freeze(v[k]);
    }
    return v;
  };
  function merge(base, patch) {
    const out = isObj(base) ? { ...base } : {};
    for (const k of Object.keys(patch)) {
      const v = patch[k];
      out[k] = isObj(v) ? merge(isObj(out[k]) ? out[k] : {}, v) : clone(v);
    }
    return out;
  }
  const segs = (p) => p.split("/");
  function cmp(a, b) {
    if (a === b) return 0;
    if (a === undefined) return 1;
    if (b === undefined) return -1;
    return a < b ? -1 : 1;
  }
  function test(v, op, x) {
    switch (op) {
      case "==": return v === x;
      case "!=": return v !== x;
      case "<": return v < x;
      case "<=": return v <= x;
      case ">": return v > x;
      case ">=": return v >= x;
      case "in": return x.includes(v);
      case "not-in": return !x.includes(v);
      case "array-contains": return Array.isArray(v) && v.includes(x);
      default: throw new TypeError("unsupported operator " + op);
    }
  }
  let idSeq = 0;
  const newId = () =>
    Date.now().toString(36) + (idSeq++).toString(36).padStart(3, "0") + Math.random().toString(36).slice(2, 7);

  function create({ persistKey } = {}) {
    const docs = new Map(); // path -> frozen body
    const snaps = new Map(); // path -> cached snapshot for the current body
    const listeners = new Set();
    let flushQueued = false;

    if (persistKey) {
      try {
        const raw = localStorage.getItem(persistKey);
        if (raw) for (const [p, d] of JSON.parse(raw)) docs.set(p, freeze(d));
      } catch (_) { /* storage unavailable: start fresh */ }
    }
    let saveTimer = null;
    function persist() {
      if (!persistKey) return;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        try { localStorage.setItem(persistKey, JSON.stringify([...docs])); } catch (_) { /* ignore */ }
      }, 250);
    }

    function snapOf(path) {
      const body = docs.get(path);
      const cached = snaps.get(path);
      if (cached && cached.__body === body) return cached;
      const id = segs(path).pop();
      const s = {
        id,
        exists: body !== undefined,
        data: () => body,
        metadata: { fromCache: false, hasPendingWrites: false },
      };
      Object.defineProperty(s, "__body", { value: body });
      snaps.set(path, s);
      return s;
    }

    function rowsFor(q) {
      const prefix = q.path + "/";
      const depth = segs(q.path).length + 1;
      let rows = [];
      for (const [p, d] of docs) {
        if (p.startsWith(prefix) && segs(p).length === depth) rows.push({ p, d });
      }
      rows = rows.filter(({ d }) => q.filters.every((f) => test(d[f.field], f.op, f.value)));
      if (q.order) {
        const dir = q.order.dir === "desc" ? -1 : 1;
        rows.sort((a, b) => {
          const av = a.d[q.order.field], bv = b.d[q.order.field];
          if (av === undefined || bv === undefined) return cmp(av, bv);
          return cmp(av, bv) * dir;
        });
      } else rows.sort((a, b) => cmp(a.p, b.p));
      if (q.lim) rows = rows.slice(0, q.lim);
      return rows.map((r) => snapOf(r.p));
    }

    function querySnap(list, prev) {
      const changes = [];
      const prevIdx = new Map((prev || []).map((s, i) => [s.id, i]));
      const nextIds = new Set(list.map((s) => s.id));
      list.forEach((s, i) => {
        if (!prevIdx.has(s.id)) changes.push({ type: "added", doc: s, oldIndex: -1, newIndex: i });
        else if (prev[prevIdx.get(s.id)] !== s) changes.push({ type: "modified", doc: s, oldIndex: prevIdx.get(s.id), newIndex: i });
      });
      (prev || []).forEach((s, i) => {
        if (!nextIds.has(s.id)) changes.push({ type: "removed", doc: s, oldIndex: i, newIndex: -1 });
      });
      return {
        docs: list,
        size: list.length,
        empty: list.length === 0,
        docChanges: () => changes,
        metadata: { fromCache: false, hasPendingWrites: false },
      };
    }

    function flush() {
      flushQueued = false;
      for (const l of listeners) {
        if (l.dead) continue;
        try {
          if (l.kind === "doc") {
            const s = snapOf(l.path);
            if (s !== l.last) { l.last = s; l.next(s); }
          } else {
            const list = rowsFor(l.q);
            const same = l.last && l.last.length === list.length && list.every((s, i) => s === l.last[i]);
            if (!same) { const prev = l.last; l.last = list; l.next(querySnap(list, prev)); }
          }
        } catch (e) { console.error(e); }
      }
    }
    function schedule() {
      if (!flushQueued) { flushQueued = true; setTimeout(flush, 0); }
    }
    function write(path, body) {
      if (body === undefined) docs.delete(path);
      else docs.set(path, freeze(clone(body)));
      persist();
      schedule();
    }

    function checkDoc(path) {
      if (segs(path).length % 2 !== 0) throw new TypeError("document path needs an even number of segments: " + path);
    }
    function checkCol(path) {
      if (segs(path).length % 2 !== 1) throw new TypeError("collection path needs an odd number of segments: " + path);
    }

    function docRef(path) {
      checkDoc(path);
      return {
        id: segs(path).pop(),
        path,
        async get() { return snapOf(path); },
        async set(data) { write(path, data); },
        async update(data) {
          if (!docs.has(path)) throw { code: "invalid_argument", message: "update needs an existing document" };
          write(path, merge(docs.get(path), data));
        },
        async delete() { write(path, undefined); },
        async acquire() { return { acquired: true }; },
        onSnapshot(next) {
          const l = { kind: "doc", path, next, last: null };
          listeners.add(l);
          schedule();
          return () => { l.dead = true; listeners.delete(l); };
        },
        collection(sub) { return colRef(path + "/" + sub); },
      };
    }

    function query(path, filters, order, lim) {
      const q = { path, filters, order, lim };
      return {
        where: (field, op, value) => query(path, [...filters, { field, op, value }], order, lim),
        orderBy: (field, dir) => query(path, filters, { field, dir: dir || "asc" }, lim),
        limit: (n) => query(path, filters, order, n),
        async get() { return querySnap(rowsFor(q), null); },
        onSnapshot(next) {
          const l = { kind: "query", q, next, last: null };
          listeners.add(l);
          schedule();
          return () => { l.dead = true; listeners.delete(l); };
        },
      };
    }

    function colRef(path) {
      checkCol(path);
      const base = query(path, [], null, 0);
      return {
        ...base,
        path,
        doc: (id) => docRef(path + "/" + (id || newId())),
        async add(data) { const r = docRef(path + "/" + newId()); await r.set(data); return r; },
      };
    }

    return {
      doc: docRef,
      collection: colRef,
      // Demo-only helpers (not part of the capability surface).
      _seed(entries) { for (const [p, d] of entries) docs.set(p, freeze(clone(d))); schedule(); },
      _isEmpty: () => docs.size === 0,
      _reset() { docs.clear(); snaps.clear(); try { localStorage.removeItem(persistKey); } catch (_) {} schedule(); },
      _dump: () => [...docs],
      // Sync helpers for the web build's server replica (not part of the capability surface).
      _replace(entries) { docs.clear(); snaps.clear(); for (const [p, d] of entries) docs.set(p, freeze(clone(d))); schedule(); },
      _apply(op) {
        if (op.o === "set") write(op.p, op.d);
        else if (op.o === "update") { if (docs.has(op.p)) write(op.p, merge(docs.get(op.p), op.d)); }
        else if (op.o === "delete") write(op.p, undefined);
      },
    };
  }
  return { create, newId };
})();


// ---------------------------------------------------------------------------
// Web build: talks to the Netlify Function at /api. The browser keeps a full
// replica of the class database (a LocalDB with the same API the app already
// uses) and applies the server's ordered change log to it every few seconds.
// Writes go to the server first, then into the replica; when the log comes
// back, every op is re-applied in log order so all browsers converge.
// No logins: a random id + key lives in this browser; a placement link or the
// organizer's link restores that identity on another device.
// ---------------------------------------------------------------------------
const Remote = (() => {
  const API = "api";
  const ID_KEY = "roster:web:id", PL_KEY = "roster:web:placement";
  const rnd = (n) => { const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"; return [...crypto.getRandomValues(new Uint8Array(n))].map((b) => abc[b % abc.length]).join(""); };
  const load = (k) => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (_) { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* private mode */ } };
  let ident = null;
  const identity = () => ident || (ident = load(ID_KEY)) || (ident = { uid: "w_" + rnd(22), key: rnd(40) }, save(ID_KEY, ident), ident);
  const adopt = (id) => { ident = { uid: id.uid, key: id.key }; save(ID_KEY, ident); };

  async function call(method, path, body, opts) {
    const id = identity();
    const headers = { "x-roster-uid": id.uid, "x-roster-key": id.key };
    let payload;
    if (body instanceof Blob) { payload = body; headers["content-type"] = body.type; }
    else if (body !== undefined) { payload = JSON.stringify(body); headers["content-type"] = "application/json"; }
    let res;
    try { res = await fetch(API + "/" + path, { method, headers, body: payload, cache: "no-store", signal: opts && opts.signal }); }
    catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled", message: "Stopped" }; throw { code: "unavailable", message: "Can't reach the class server." }; }
    const data = await res.json().catch(() => null);
    if (!res.ok) throw { code: (data && data.error && data.error.code) || (res.status === 403 ? "invalid_argument" : "unavailable"), message: (data && data.error && data.error.message) || "Request failed", status: res.status };
    return data;
  }
  async function probe() {
    try {
      const res = await fetch(API + "/hello", { cache: "no-store", headers: ident || load(ID_KEY) ? { "x-roster-uid": identity().uid, "x-roster-key": identity().key } : {} });
      if (!res.ok || !/json/.test(res.headers.get("content-type") || "")) return null;
      const j = await res.json();
      return j && j.roster ? j : null;
    } catch (_) { return null; }
  }

  function createDB() {
    const rep = LocalDB.create();
    let cursor = 0, gapPolls = 0, timer = null, inflight = null, stopped = false;
    const ready = (async () => { await pull(); })();
    function applyAll(ops) {
      ops.sort((a, b) => a.s - b.s);
      for (const op of ops) {
        if (op.s <= cursor) continue;
        if (op.s > cursor + 1) {
          if (++gapPolls < 3) break; // an op still being written; wait for it
          gapPolls = 0;
        }
        if (!op.skip && !op.missing) rep._apply(op);
        cursor = op.s;
      }
    }
    async function pull() {
      if (inflight) return inflight;
      inflight = (async () => {
        try {
          const r = await call("GET", "sync?since=" + cursor);
          if (r.full) { rep._replace(r.docs); cursor = r.seq; gapPolls = 0; }
          applyAll(r.ops || []);
        } finally { inflight = null; }
      })();
      return inflight;
    }
    // Poll fast while someone is active or the chat is moving, slower when idle, not when hidden
    // (keeps a two-week class well inside Netlify's free function allowance).
    let lastActive = Date.now(), lastChange = Date.now();
    for (const ev of ["pointerdown", "keydown", "wheel", "touchstart"]) window.addEventListener(ev, () => { lastActive = Date.now(); }, { passive: true, capture: true });
    const interval = () => { const idle = Date.now() - Math.max(lastActive, lastChange); return idle < 60e3 ? 3000 : idle < 300e3 ? 8000 : 20000; };
    function loop() {
      clearTimeout(timer);
      if (stopped) return;
      timer = setTimeout(async () => {
        if (!document.hidden) { const before = cursor; try { await pull(); } catch (_) { /* offline; try again */ } if (cursor !== before) lastChange = Date.now(); }
        loop();
      }, document.hidden ? 30000 : interval());
    }
    document.addEventListener("visibilitychange", () => { if (!document.hidden) pull().catch(() => {}); loop(); });
    window.addEventListener("focus", () => pull().catch(() => {}));
    ready.then(loop, loop);

    async function send(op) {
      await call("POST", "write", { ops: [op] });
      rep._apply(op); // show it now; the log re-applies it in order
      setTimeout(() => pull().catch(() => {}), 250);
    }
    function wrapDoc(path) {
      const r = rep.doc(path);
      return {
        id: r.id, path,
        get: () => r.get(),
        onSnapshot: (next, err) => r.onSnapshot(next, err),
        collection: (sub) => wrapCol(path + "/" + sub),
        set: (d) => send({ o: "set", p: path, d }),
        update: async (d) => {
          const s = await r.get();
          if (!s.exists) throw { code: "invalid_argument", message: "update needs an existing document" };
          return send({ o: "update", p: path, d });
        },
        delete: () => send({ o: "delete", p: path }),
      };
    }
    function wrapCol(path) {
      const c = rep.collection(path);
      return {
        where: c.where, orderBy: c.orderBy, limit: c.limit, get: c.get, onSnapshot: c.onSnapshot, path,
        doc: (id) => wrapDoc(path + "/" + (id || LocalDB.newId())),
        async add(d) { const ref = wrapDoc(path + "/" + LocalDB.newId()); await ref.set(d); return ref; },
      };
    }
    return {
      doc: wrapDoc, collection: wrapCol, ready,
      sync: () => pull(),
      stop: () => { stopped = true; clearTimeout(timer); },
      // Photos go to the server's photo store; documents keep a short URL.
      async _upload(dataUrl) {
        const blob = await (await fetch(dataUrl)).blob();
        const r = await call("POST", "img", blob);
        return r.src.replace(/^\//, "");
      },
      _dump: () => rep._dump(),
    };
  }

  // Claude drafting through the server (only when the site has an API key).
  const sample = {
    async json(input, opts) {
      const r = await call("POST", "draft", { prompt: String(input) }, opts).catch((e) => { throw e.code === "not_granted" || e.status === 501 ? { code: "not_granted", message: e.message } : e; });
      const text = r.text || "";
      if (opts && opts.onText) opts.onText({ text, delta: text });
      const m = text.replace(/```(?:json)?/g, "").match(/\{[\s\S]*\}/);
      try { return JSON.parse(m ? m[0] : text); } catch (_) { return null; }
    },
    limits: async () => ({ images: false }),
  };
  const downloads = {
    async save({ filename, data }) {
      const blob = data instanceof Blob ? data : new Blob([data], { type: /\.json$/.test(filename) ? "application/json" : /\.csv$/.test(filename) ? "text/csv" : "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    },
  };

  // Boot for the web build: null when there is no /api (a static-only deploy).
  async function connect(params) {
    if (location.protocol === "file:") return null;
    let hello = await probe();
    if (!hello) return null;
    const strip = (k) => { try { const u = new URL(location.href); u.searchParams.delete(k); history.replaceState(null, "", u.pathname + (u.search ? u.search : "") + u.hash); } catch (_) { /* ignore */ } };
    // ?o=<token>: the organizer's own link, on a new device.
    const o = params.get("o");
    if (o) { try { adopt(await call("POST", "restore", { token: o, kind: "o" })); } catch (_) { /* bad link: continue as a visitor */ } strip("o"); }
    // ?p=<token>: a student's placement link. If that student already joined, this device becomes them.
    let placement = load(PL_KEY);
    const p = params.get("p");
    if (p) {
      try {
        const r = await call("POST", "open-placement", { token: p });
        if (r.restore) adopt(r.restore);
        placement = { token: p, name: r.name, courses: r.courses };
        save(PL_KEY, placement);
      } catch (_) { /* invalid link */ }
      strip("p");
    }
    identity();
    hello = (await probe()) || hello;
    const db = createDB();
    try { await db.ready; } catch (_) { /* first sync failed; the loop retries */ }
    return {
      hello, db, placement, uid: identity().uid,
      remote: {
        claimOrganizer: () => call("POST", "claim-organizer"),
        organizerLink: async () => { const r = await call("GET", "organizer-link"); return r.token ? location.origin + location.pathname + "?o=" + r.token : null; },
        createPlacements: (people, courses) => call("POST", "placements", { people, courses }),
        claimPlacement: async (token) => { const r = await call("POST", "claim-placement", { token }); if (r.restore) { adopt(r.restore); return { switched: true }; } return { ok: true }; },
        placementLink: (token) => location.origin + location.pathname + "?p=" + token,
        resync: () => db.sync(),
      },
    };
  }
  return { connect, probe, sample, downloads, identity };
})();


// ---------------------------------------------------------------------------
// Research metrics — computed straight from the chat log, nothing
// self-reported. Thresholds come from the Assignment 2a plan:
//   contribution in pset cycle 1: success >= 35%, kill < 15%
//   cycle-2 student messages as a share of cycle 1: success >= 50%, kill < 25%
//   corrections per AI recap: success >= 1
//   unprompted shares (links, files, photos): success >= 3 a week
// The organizer is excluded from every numerator and denominator.
// ---------------------------------------------------------------------------
const Metrics = (() => {
  const URL_RE = /\bhttps?:\/\/\S+|\b(?:docs\.google|drive\.google|overleaf|notion\.so|canvas\.harvard|edstem)\S*/i;
  const isShare = (m) => m.kind === "photo" || (m.attachments && m.attachments.length > 0) || URL_RE.test(m.text || "");
  const verdict = (v, ok, kill) => (v == null ? "pending" : v >= ok ? "success" : v < kill ? "kill" : "revise");

  function compute({ courseId, members, messages, fixes, recaps, cycles, organizerIds, now, checks, stuck, notes }) {
    const org = new Set(organizerIds || []);
    const t = now || Date.now();
    const students = members.filter((m) => !org.has(m.id) && m.courses && m.courses[courseId]);

    // Every contribution event: who, when, what.
    const events = [];
    for (const m of messages) {
      if (!m.by || org.has(m.by) || m.kind === "system" || m.kind === "recap" || m.kind === "announce" || m.deleted) continue;
      events.push({ by: m.by, ts: m.ts, type: m.replyTo ? "reply" : "post", msg: m });
    }
    for (const m of messages) {
      for (const [emoji, who] of Object.entries(m.reactions || {})) {
        for (const [uid, ts] of Object.entries(who || {})) {
          if (ts && !org.has(uid)) events.push({ by: uid, ts, type: "react", emoji });
        }
      }
      // Poll votes and study-session RSVPs are one-tap responses, like a reaction.
      for (const [uid, v] of Object.entries((m.poll && m.poll.votes) || {})) {
        if (v && v.o && !org.has(uid)) events.push({ by: uid, ts: v.t || m.ts, type: "vote" });
      }
      for (const [uid, v] of Object.entries((m.event && m.event.rsvps) || {})) {
        if (v && v.s && !org.has(uid)) events.push({ by: uid, ts: v.t || m.ts, type: "rsvp" });
      }
    }
    for (const f of fixes) {
      if (!org.has(f.by)) events.push({ by: f.by, ts: f.ts, type: "fix" });
      for (const [uid, ts] of Object.entries(f.votes || {})) if (ts && !org.has(uid)) events.push({ by: uid, ts, type: "agree" });
      for (const [uid, ts] of Object.entries(f.nays || {})) if (ts && !org.has(uid)) events.push({ by: uid, ts, type: "agree" });
    }
    // A "looks right" on a recap line is the same act as a 👍 on a summary in GroupMe.
    for (const c of checks || []) if (!org.has(c.by)) events.push({ by: c.by, ts: c.ts, type: "check" });
    for (const st of stuck || []) if (!org.has(st.by)) events.push({ by: st.by, ts: st.ts, type: "stuck" });
    for (const n of notes || []) if (!org.has(n.by)) {
      events.push({ by: n.by, ts: n.ts, type: "note", msg: { kind: "note", text: n.link || "", attachments: [{}] } });
      for (const [uid, ts] of Object.entries(n.helpful || {})) if (ts && !org.has(uid)) events.push({ by: uid, ts, type: "check" });
    }

    const cyc = (cycles || []).map((c) => {
      const placed = students.filter((s) => (s.courses[courseId] || Infinity) < c.end);
      const placedIds = new Set(placed.map((s) => s.id));
      const inWin = events.filter((e) => e.ts >= c.start && e.ts < c.end && placedIds.has(e.by));
      const contributors = new Set(inWin.map((e) => e.by));
      // Stricter reading: only people who wrote something (post, reply, fix, notes).
      const writers = new Set(inWin.filter((e) => e.type === "post" || e.type === "reply" || e.type === "fix" || e.type === "note").map((e) => e.by));
      const posts = inWin.filter((e) => e.type === "post" || e.type === "reply");
      const sharesIn = inWin.filter((e) => (e.type === "post" || e.type === "reply" || e.type === "note") && isShare(e.msg));
      const perPoster = new Map();
      for (const e of posts) perPoster.set(e.by, (perPoster.get(e.by) || 0) + 1);
      const ranked = [...perPoster.values()].sort((a, b) => b - a);
      const top3 = ranked.slice(0, 3).reduce((a, b) => a + b, 0);
      const readers = new Set();
      for (const s of placed) {
        const v = (s.visits && s.visits[courseId]) || {};
        if (Object.values(v).some((ts) => ts >= c.start && ts < c.end)) readers.add(s.id);
      }
      const lurkers = [...readers].filter((id) => !contributors.has(id)).length;
      const opened = new Set([...readers, ...contributors]).size;
      const byType = { post: 0, reply: 0, react: 0, fix: 0, agree: 0, vote: 0, rsvp: 0, check: 0, stuck: 0, note: 0 };
      for (const e of inWin) byType[e.type]++;
      const started = t >= c.start;
      const finished = t >= c.end;
      const rate = placed.length ? contributors.size / placed.length : null;
      return {
        ...c,
        started,
        finished,
        placed: placed.length,
        contributors: contributors.size,
        rate: started ? rate : null,
        writers: writers.size,
        writerRate: started && placed.length ? writers.size / placed.length : null,
        studentMsgs: posts.length,
        posters: perPoster.size,
        top3Share: posts.length ? top3 / posts.length : null,
        readers: readers.size,
        opened,
        lurkers,
        byType,
        shares: sharesIn.length,
        light: byType.react + byType.vote + byType.rsvp + byType.check + byType.stuck + byType.agree,
      };
    });

    const c1 = cyc[0], c2 = cyc[1];
    const retention = c1 && c2 && c2.started && c1.studentMsgs ? c2.studentMsgs / c1.studentMsgs : null;

    const recapRows = (recaps || []).map((r) => ({
      id: r.id,
      title: r.title,
      lecture: r.lecture,
      ts: r.ts,
      fixes: fixes.filter((f) => f.recapId === r.id && !org.has(f.by)).length,
      agrees: fixes
        .filter((f) => f.recapId === r.id)
        .reduce((n, f) => n + Object.values(f.votes || {}).filter(Boolean).length, 0),
    }));

    const allShares = [...messages.filter((m) => m.by && !org.has(m.by) && !m.deleted && m.kind !== "system" && isShare(m)), ...(notes || []).filter((n) => !org.has(n.by))];
    const firstStart = cyc.length ? cyc[0].start : null;
    const weeks = firstStart ? Math.max(1, (Math.min(t, cyc[cyc.length - 1].end) - firstStart) / (7 * 864e5)) : 1;

    return {
      placed: students.length,
      cycles: cyc,
      retention,
      recaps: recapRows,
      sharesPerWeek: allShares.length / weeks,
      verdicts: {
        contribution: verdict(c1 && c1.started ? c1.rate : null, 0.35, 0.15),
        retention: verdict(retention, 0.5, 0.25),
        corrections: recapRows.length ? (recapRows.every((r) => r.fixes >= 1) ? "success" : recapRows.some((r) => r.fixes >= 1) ? "revise" : "kill") : "pending",
        shares: allShares.length ? (allShares.length / weeks >= 3 ? "success" : "revise") : "pending",
      },
      cycleFinal: { c1: c1 && c1.finished, c2: c2 && c2.finished },
    };
  }

  // A pseudonymous log for the write-up: no names, no message text.
  function csv({ courseId, members, messages, fixes, cycles, organizerIds, checks, stuck, notes }) {
    const org = new Set(organizerIds || []);
    const alias = new Map();
    const nameOf = (uid) => {
      if (org.has(uid)) return "ORGANIZER";
      if (!alias.has(uid)) alias.set(uid, "S" + String(alias.size + 1).padStart(3, "0"));
      return alias.get(uid);
    };
    members.filter((m) => m.courses && m.courses[courseId]).forEach((m) => nameOf(m.id));
    const cycleOf = (ts) => {
      const c = (cycles || []).find((c) => ts >= c.start && ts < c.end);
      return c ? c.label : "";
    };
    const rows = [["timestamp_iso", "cycle", "member", "event", "thread", "chars", "has_link_or_file", "target_id"]];
    const push = (ts, who, ev, thread, chars, share, reply) =>
      rows.push([new Date(ts).toISOString(), cycleOf(ts), nameOf(who), ev, thread || "", chars, share ? 1 : 0, reply || ""]);
    for (const m of messages) {
      if (m.deleted || !m.by) continue;
      const kind = m.kind === "recap" ? "recap" : m.kind === "announce" ? "announce" : m.kind === "poll" ? "poll" : m.kind === "event" ? "study_session" : m.kind === "photo" ? "photo" : m.replyTo ? "reply" : "post";
      if (m.kind !== "system") push(m.ts, m.by, kind, m.thread, (m.text || "").length, isShare(m), typeof m.replyTo === "string" ? m.replyTo : m.replyTo ? m.replyTo.id : "");
      for (const [emoji, who] of Object.entries(m.reactions || {}))
        for (const [uid, ts] of Object.entries(who || {})) if (ts) push(ts, uid, "react " + emoji, m.thread, 0, false, m.id);
      for (const [uid, v] of Object.entries((m.poll && m.poll.votes) || {})) if (v && v.o) push(v.t || m.ts, uid, "vote", m.thread, 0, false, m.id);
      for (const [uid, v] of Object.entries((m.event && m.event.rsvps) || {})) if (v && v.s) push(v.t || m.ts, uid, "rsvp " + v.s, m.thread, 0, false, m.id);
    }
    for (const f of fixes) {
      push(f.ts, f.by, "correction", "recap", (f.text || "").length, false, f.recapId);
      for (const [uid, ts] of Object.entries(f.votes || {})) if (ts) push(ts, uid, "agree", "recap", 0, false, f.id);
      for (const [uid, ts] of Object.entries(f.nays || {})) if (ts) push(ts, uid, "disagree", "recap", 0, false, f.id);
    }
    for (const c of checks || []) push(c.ts, c.by, "check_line", "recap", 0, false, c.recapId);
    for (const st of stuck || []) push(st.ts, st.by, "stuck", st.thread, 0, false, st.problem);
    for (const n of notes || []) {
      push(n.ts, n.by, "notes", "notes", (n.body || "").length, true, "");
      for (const [uid, ts] of Object.entries(n.helpful || {})) if (ts) push(ts, uid, "helpful", "notes", 0, false, n.id);
    }
    // One "open" per person per day, so readers who never post still show up.
    for (const m of members) for (const ts of Object.values((m.visits && m.visits[courseId]) || {})) if (ts && m.courses && m.courses[courseId]) push(ts, m.id, "open", "", 0, false, "");
    const header = rows.shift();
    rows.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
    rows.unshift(header);
    return rows.map((r) => r.map((v) => (/[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : v)).join(",")).join("\n");
  }

  return { compute, csv, isShare };
})();


// ---------------------------------------------------------------------------
// Runtime — decides between the live class chat (shared `db`, real classmates)
// and the demo class (LocalDB with marked example classmates), and wraps
// identity, presence, Claude and downloads behind one small object.
// ---------------------------------------------------------------------------
const Runtime = (() => {
  const hasClaude = () => typeof window.claude === "object" && window.claude && typeof window.claude.use === "function";
  const use = (name) => (hasClaude() ? window.claude.use(name).catch(() => null) : Promise.resolve(null));

  async function boot() {
    const params = new URLSearchParams(location.search);
    const forceDemo = !!window.ROSTER_FORCE_DEMO || params.has("demo");
    // Outside claude.ai (the Netlify build): a live class if this site has the /api function.
    if (!hasClaude()) {
      const web = forceDemo || typeof Remote === "undefined" ? null : await Remote.connect(params);
      if (web) {
        return {
          forceDemo: false, live: true, web: true, db: web.db, user: null,
          me: { id: web.uid, name: (web.placement && web.placement.name) || "", avatarUrl: "" },
          uid: web.uid, isOwner: !!web.hello.isOrganizer, guest: false, canWrite: true,
          sample: web.hello.ai ? Remote.sample : null, room: null, downloads: Remote.downloads, signedIn: true,
          hello: web.hello, placement: web.placement, remote: web.remote,
        };
      }
      return { forceDemo: true, live: false, web: false, webStatic: !forceDemo, db: null, user: null, me: null, uid: null, isOwner: false, guest: false, canWrite: false, sample: null, room: null, downloads: typeof Remote === "undefined" ? null : Remote.downloads, signedIn: false };
    }
    const [db, user, sample, room, downloads] = await Promise.all([
      forceDemo ? null : use("db"), use("user"), use("sample"), forceDemo ? null : use("room"), use("downloads"),
    ]);
    let me = null, canWrite = null, isOwner = false, guest = false;
    if (user) {
      try {
        me = await user.me();
        isOwner = !!me.isOwner;
        canWrite = await user.can("data.write");
        // "Verified" = a member of the organization that owns this artifact (not a guest).
        if (me.id) { const pr = await user.profiles([me.id]); guest = !!(pr && pr[me.id] && pr[me.id].guest); }
      } catch (_) { me = me || null; }
    }
    const live = !!(db && me && me.id);
    return {
      forceDemo,
      live,
      db,
      user,
      me,
      uid: me && me.id,
      isOwner,
      guest,
      // null = the platform said nothing; keep inputs and let a refused write decide.
      canWrite: canWrite === null ? (live ? true : false) : canWrite,
      sample,
      room,
      downloads,
      signedIn: !!(me && me.id),
    };
  }

  // Profiles resolver: live uses the platform; demo uses the example roster.
  function profileResolver(rt, demoPeople) {
    if (rt && rt.live && rt.user) {
      return async (ids) => {
        try { return await rt.user.profiles(ids); } catch (_) { return {}; }
      };
    }
    return async (ids) => {
      const out = {};
      for (const id of ids) {
        const p = demoPeople[id];
        out[id] = p
          ? { id, name: p.name, avatarUrl: "", color: p.color, isMe: false, guest: false }
          : { id, name: "", avatarUrl: "", color: "#8a8f98", isMe: false, guest: false };
      }
      return out;
    };
  }

  return { boot, profileResolver, hasClaude };
})();
