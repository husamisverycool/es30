  return demoDB;
}
const DEMO_ONLINE = new Set(["maya", "dev", "nora", "mei", "theo", "leila", "kofi", "ana", "zara", "jonah", "sam"].map((k) => "u_demo_" + k));
const errCopy = (e) => {
  const c = e && e.code;
  if (c === "invalid_argument") return "You don't have permission to change that here.";
  if (c === "quota_exceeded") return "This class chat has hit its storage limit. Tell the organizer.";
  if (c === "resource_exhausted") return "Slow down a little and try again.";
  return "That didn't go through. Check your connection and try again.";
};
// Fix consensus (Community Notes style), shared by the recap UI and the inbox.
const APPLY_AT = 3;
const agreeN = (f) => Object.values(f.votes || {}).filter(Boolean).length;
const nayN = (f) => Object.values(f.nays || {}).filter(Boolean).length;
const autoApplied = (f) => f.status === "applied" || (f.status !== "dismissed" && agreeN(f) >= APPLY_AT && agreeN(f) >= 2 * nayN(f));
const appliedAt = (f) => f.appliedAt || (autoApplied(f) ? Object.values(f.votes || {}).filter(Boolean).sort((a, b) => a - b)[APPLY_AT - 1] || f.ts : 0);

function useMultiSnap(ids, makeRef, deps) {
  const [map, setMap] = useState({});
  const key = ids.join(",");
  useEffect(() => {
    const offs = ids.map((id) => {
      let ref = null;
      try { ref = makeRef(id); } catch (e) { console.error(e); }
      if (!ref) return () => {};
      return ref.onSnapshot((s) => setMap((m) => ({ ...m, [id]: s })), () => {});
    });
    return () => offs.forEach((o) => o());
  }, [key, ...deps]);
  return map;
}

function Session({ rt, mode, switchMode }) {
  const demo = mode === "demo";

  }, []);
  useEffect(() => { if (Notice.next) { const m = Notice.next; Notice.next = null; setTimeout(() => toast(m), 300); } }, []);
  const liveOK = rt.live && rt.canWrite !== false && !Notice.liveDenied;

  // ---- data ----

    },
    markRead: (cid, thread) => { LS.set("roster:lr:" + mode + ":" + cid + ":" + (thread || "main"), now()); setLrVersion((v) => v + 1); },
    lastRead: (cid, thread) => LS.get("roster:lr:" + mode + ":" + cid + ":" + (thread || "main"), demo ? now() - 2 * 3600e3 : ((myDoc && myDoc.courses && myDoc.courses[cid]) || 0)),
    inboxSeen: () => LS.get("roster:inbox:" + mode, demo ? Demo.NOW - 26 * 3600e3 : 0),
    markInboxSeen: () => { LS.set("roster:inbox:" + mode, now()); setLrVersion((v) => v + 1); },
    resetDemo: () => {
      if (demoDB) { demoDB._reset(); demoDB._seed(Demo.seed()); }
      try { Object.keys(localStorage).filter((k) => /^roster:(lr|draft|last|view|inbox):?(demo)?/.test(k)).forEach((k) => localStorage.removeItem(k)); } catch (_) { /* ignore */ }
      switchMode("demo-reset-" + Date.now());
    },

    // ---- friends, status ----
    follow: (id) => {
      const on = !!(myDoc && myDoc.following && myDoc.following[id]);
      return write(() => db.doc("members/" + uid).update({ following: { [id]: on ? 0 : now() } }), on ? null : "Added " + firstName(person(id).name) + ". You'll see each other's free time if they add you back.");
    },
    isFriend: (id) => !!(myDoc && myDoc.following && myDoc.following[id] && membersById[id] && membersById[id].following && membersById[id].following[uid]),
    setStatus: (st) => write(() => db.doc("members/" + uid).update({ status: st ? { e: st.e, text: st.text, until: st.until || 0, t: now() } : { e: "", text: "", until: 0, t: now() } }), st ? "Status set" : "Status cleared"),

    // ---- tasks (private: only you can read data/users/<you>) ----
    addTask: (t) => write(() => db.collection("data/users/" + uid).add({ type: "task", title: t.title, cid: t.cid || "", due: t.due || 0, done: 0, ts: now(), from: t.from || "" }), t.quiet ? null : "Added to your tasks"),
    toggleTask: (t) => write(() => db.doc("data/users/" + uid + "/" + t.id).update({ done: t.done ? 0 : now() })),
    deleteTask: (t) => write(() => db.doc("data/users/" + uid + "/" + t.id).delete(), "Task deleted"),

    // ---- board (campus-wide) ----
    postBoard: async (p, file) => {
      const body = { by: uid, ts: now(), cat: p.cat, title: p.title, body: p.body || "", reactions: {}, comments: 0 };
      if (p.cat === "event" || p.cat === "study") body.event = { at: p.at || 0, end: p.end || 0, where: p.where || "", rsvps: { [uid]: { s: "going", t: now() } } };
      if (p.cat === "market") body.price = p.price || "";
      if (file) { try { body.image = await storeImage(await Media.compress(file)); } catch (_) { /* skip */ } }
      return write(() => db.collection("board").add(body), "Posted to the Board");
    },
    reactBoard: (p, e) => {
      const mine = !!(p.reactions && p.reactions[e] && p.reactions[e][uid]);
      return write(() => db.doc("board/" + p.id).update({ reactions: { [e]: { [uid]: mine ? 0 : now() } } }));
    },
    rsvpBoard: (p, st) => {
      const cur = p.event && p.event.rsvps && p.event.rsvps[uid];
      return write(() => db.doc("board/" + p.id).update({ event: { rsvps: { [uid]: { s: cur && cur.s === st ? "" : st, t: now() } } } }));
    },
    commentBoard: (p, text) => write(() => db.collection("board/" + p.id + "/comments").add({ by: uid, ts: now(), text })),
    deleteBoard: (p) => write(() => db.doc("board/" + p.id).update({ deleted: now() }), "Post removed"),

    // ---- organizer ----
    // Web build: personal placement links (?p=…) for a list of names.
    createPlacements: async (people, courses) => {
      if (!canWrite || !rt.remote) return null;
      try { const r = await rt.remote.createPlacements(people, courses); rt.remote.resync(); return r.placements; }
      catch (e) { toast(errCopy(e)); return null; }
    },
    // Web build: a new organizer's classes start with working dates, so the experiment runs
    // without any setup (Stat 110 psets are due Fridays at 5 PM on Gradescope).
    seedClass: async (cid) => {
      if (!Catalog.isCourse(cid)) return;
      const ref = db.doc("hub/" + cid);
      try { if ((await ref.get()).exists) return; } catch (_) { return; }
      const t = now();
      const day0 = Sched.startOfDay(t), wd = Sched.et(day0 + 12 * 3600e3).wd;
      const friAt = (k) => { const p = Sched.et(Sched.addDays(day0, k) + 12 * 3600e3); return Sched.at(p.y, p.mo, p.d, 17 * 60); };
      let k = (5 - wd + 7) % 7, fri = friAt(k);
      if (fri - t < 3 * 864e5) { k += 7; fri = friAt(k); }
      const fri2 = friAt(k + 7);
      const isStat = cid === "stat110";
      await write(() => ref.set({
        due: isStat ? [{ id: "d1", title: "This week's pset", at: fri, where: "Gradescope" }, { id: "d2", title: "Next week's pset", at: fri2, where: "Gradescope" }] : [],
        cycles: [{ id: "c1", label: "Pset cycle 1", start: t, end: fri }, { id: "c2", label: "Pset cycle 2", start: fri, end: fri2 }],
        rules: ["Collaboration follows the course syllabus: talk through ideas, write up your own solutions.", "No posting solutions or answers to graded problems before the deadline.", "This chat is run by a student. Course staff are not in it."],
        links: [],
      }));
      if (isStat) await write(() => db.doc("courses/" + cid + "/threads/pset-a").set({ title: "This week's pset", kind: "pset", due: fri, problems: ["1", "2", "3", "4", "5", "6"], ts: t, by: uid }));
    },
    claimOrganizer: async () => {
      try { await rt.remote.claimOrganizer(); await rt.remote.resync(); toast("You're the organizer. Save your organizer link from Organizer tools → Placement."); return true; }
      catch (e) { toast(e && e.code === "already_exists" ? "This class already has an organizer." : errCopy(e)); return false; }
    },
    placePeople: async (ids, courses) => {
      let n = 0;
      for (const id of [...new Set(ids)]) {
        const ok = await write(() => db.doc("placements/" + id).set({ courses, ts: now(), by: uid }));
        if (!ok) return n;
        n++;
      }
      return n;
    },
  };
  app.setArriving = setArriving;
  // Mode strip (Slack's sandbox banner): honest about what's real.
  app.banner = bannerOff ? null : demo
    ? html`<div class="modebar"><span class="modebar-dot"></span><span class="grow"><b>Demo class.</b> Example classmates; what you post stays in this browser.</span>
        ${rt.live && rt.canWrite !== false && !Notice.liveDenied ? html`<button onClick=${() => app.switchMode("live")}>Join the live class</button>` : null}
        <button class="modebar-x" onClick=${() => { LS.set("roster:banner:" + mode, Date.now()); setBannerOff(true); }} aria-label="Hide for today"><${Icon} name="x" size=${14} /></button></div>`
    : !canWrite ? html`<div class="modebar ro"><${Icon} name="eye" size=${14} /><span class="grow">You can read this class but not post.</span><button onClick=${() => app.switchMode("demo")}>Try the demo</button></div>` : null;

  let body;
  if (membersRaw === null || myDoc === null) body = html`<${BootScreen} />`;
  else if (arriving || !myDoc || !Object.keys(myDoc.courses || {}).length) body = html`<${Onboarding} onDone=${(cid) => { setArriving(false); if (cid) app.openCourse(cid); else setRoute({ view: "now" }); }} />`;
  else body = html`<${AppShell} />`;

  return html`<${Ctx.Provider} value=${app}>
    ${body}
    <${SheetHost} />
    <div class="toasts" role="status" aria-live="polite">${toasts.map((t) => html`<div class="toast" key=${t.id}><span>${t.msg}</span>${t.action ? html`<button onClick=${t.action.run}>${t.action.label}</button>` : null}</div>`)}</div>
  <//>`;
}

function Root({ rt }) {
  const [mode, setMode] = useState(() => {
    if (!rt.live || rt.canWrite === false) return "demo";
    return LS.get("roster:mode", "live") === "demo" ? "demo" : "live";
  });
  const key = mode.startsWith("demo") ? mode : "live";
  const base = mode.startsWith("demo") ? "demo" : "live";
  return html`<${Session} key=${key} rt=${rt} mode=${base} switchMode=${setMode} />`;
}
(async function start() {
  const mount = document.getElementById("app");
  const rt = await Runtime.boot();
  mount.innerHTML = "";
  render(html`<${Root} rt=${rt} />`, mount);
})();

}

(function () {
  function fail() { var el = document.querySelector(".boot-sub"); if (el) el.textContent = "Roster couldn't load. Check your connection and reload."; }
  function go() { if (window.htmPreact) __rosterApp(); else fail(); }
  if (window.htmPreact) return go();
  var s = document.createElement("script");
  s.src = "https://unpkg.com/htm@3.1.1/preact/standalone.umd.js"; // fallback copy
  s.onload = go; s.onerror = fail;
  document.head.appendChild(s);
})();
</script>
